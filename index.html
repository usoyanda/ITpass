
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITパスポート 過去問道場</title>
<style>
:root{
  --paper:#f3efe6; --ink:#1c2621; --ink2:#57635b; --line:#cec5b2;
  --card:#fbf9f4; --accent:#b0442c; --ok:#2c6a4d; --okbg:#2c6a4d18; --ngbg:#b0442c18;
  --st:#8a6a33; --mg:#33628a; --tc:#5a3a86;
  --mono:ui-monospace,'SFMono-Regular','Courier New',monospace;
  --serif:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',-apple-system,sans-serif;
  background-image:radial-gradient(circle at 1px 1px,rgba(0,0,0,.03) 1px,transparent 0);
  background-size:14px 14px;-webkit-text-size-adjust:100%}
.wrap{max-width:740px;margin:0 auto;padding:16px 14px 90px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  border-bottom:3px double var(--ink);padding-bottom:9px;margin-bottom:18px}
.title{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:.05em;white-space:nowrap}
.sub{font-family:var(--mono);font-size:11px;color:var(--ink2);text-align:right}
.card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:20px 18px;position:relative}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:repeating-linear-gradient(90deg,var(--ink) 0 7px,transparent 7px 14px);opacity:.22}
h2.lb{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink2);margin:0 0 10px;text-transform:uppercase}
.field{margin-bottom:20px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--ink);background:transparent;color:var(--ink);
  padding:7px 13px;border-radius:999px;font-family:var(--mono);font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--paper)}
.chip.st.on{background:var(--st);border-color:var(--st)}
.chip.mg.on{background:var(--mg);border-color:var(--mg)}
.chip.tc.on{background:var(--tc);border-color:var(--tc)}
.chip:disabled{opacity:.32;cursor:not-allowed;border-style:dashed}
.note{font-family:var(--mono);font-size:11.5px;color:var(--ink2);margin-top:7px;line-height:1.6}
.warn{font-family:var(--mono);font-size:12px;color:var(--accent);background:var(--ngbg);
  padding:10px 12px;border-radius:3px;margin-top:8px;line-height:1.6}
.tgl{display:flex;align-items:center;gap:10px;cursor:pointer}
.sw{width:44px;height:24px;border-radius:999px;border:1.5px solid var(--ink);position:relative;flex:0 0 auto}
.sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:.15s}
.sw.on{background:var(--accent);border-color:var(--accent)}
.sw.on i{left:22px;background:var(--paper)}
.btn{width:100%;padding:15px;border:none;border-radius:3px;background:var(--ink);color:var(--paper);
  font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover:not(:disabled){background:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn2{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn3{background:transparent;color:var(--ink2);border:1px solid var(--line);width:auto;padding:8px 12px;font-size:12px;display:inline-block}
.star{background:transparent;border:1.5px solid var(--line);border-radius:3px;padding:8px 12px;font-size:13px;cursor:pointer;color:var(--ink2)}
.star.on{border-color:var(--accent);color:var(--accent)}
.ta{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:3px;padding:10px;font-family:var(--mono);font-size:12px;line-height:1.6;min-height:110px;margin:8px 0}
.custItem{border-top:1px solid var(--line);padding:14px 0}
.custItem .qq{font-size:13.5px;line-height:1.7;margin-bottom:8px;white-space:pre-wrap}
.badge{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:99px;margin-bottom:6px}
.badge.custom{background:var(--accent);color:var(--paper)}
.badge.orig{background:var(--line);color:var(--ink2)}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.inp{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:3px;padding:10px;font-family:var(--mono);font-size:13px;margin:8px 0;background:var(--card);color:var(--ink)}
.btn2:hover{background:rgba(0,0,0,.05)}
.bar{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:6px}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .25s}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--ink2);display:flex;justify-content:space-between;margin-bottom:16px}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:3px 9px;border-radius:99px;color:#fff;margin:0 6px 12px 0}
.tag.strategy{background:var(--st)}.tag.management{background:var(--mg)}.tag.technology{background:var(--tc)}
.tag.sub{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.q{font-size:16px;line-height:1.8;white-space:pre-wrap;margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;padding:13px 15px;border:1.5px solid var(--ink);border-radius:3px;background:var(--card);
  font-size:14.5px;line-height:1.55;cursor:pointer;font-family:inherit;color:var(--ink);display:flex;gap:9px}
.opt:hover:not(:disabled){background:#efe9db}
.opt b{font-family:var(--mono);flex:0 0 auto}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ng{background:var(--ngbg);border-color:var(--accent)}
.opt:disabled{cursor:default}
.fb{margin-top:16px;border:1px solid var(--line);border-radius:3px;background:#fffefa;overflow:hidden}
.fb .hd{padding:11px 15px;font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.05em}
.fb .hd.ok{color:var(--ok);background:var(--okbg)}
.fb .hd.ng{color:var(--accent);background:var(--ngbg)}
.fb .bd{padding:14px 15px}
.blk{margin-bottom:13px}
.blk:last-child{margin-bottom:0}
.blk .h{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink2);margin-bottom:4px}
.blk .t{font-size:14px;line-height:1.75}
.blk.tip{background:#f5efe0;border-left:3px solid var(--st);padding:11px 12px;border-radius:2px}
.blk.tip .h{color:var(--st)}
.quit{display:block;text-align:center;margin-top:14px;font-family:var(--mono);font-size:11.5px;
  color:var(--ink2);cursor:pointer;text-decoration:underline}
.hero{text-align:center;padding:6px 0 20px}
.big{font-family:var(--serif);font-size:52px;font-weight:700;line-height:1}
.den{font-family:var(--mono);font-size:13px;color:var(--ink2);margin-top:6px}
.stamp{display:inline-block;margin-top:13px;font-family:var(--mono);font-weight:700;font-size:14px;
  padding:5px 16px;border:3px solid;border-radius:4px;transform:rotate(-3deg);letter-spacing:.08em}
.stamp.p{color:var(--ok);border-color:var(--ok)}.stamp.f{color:var(--accent);border-color:var(--accent)}
.row{display:flex;align-items:center;gap:9px;margin-bottom:8px;font-size:12.5px}
.row .l{width:112px;flex:0 0 auto;font-family:var(--mono);font-size:11.5px}
.row .bg{flex:1;height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.row .bg>i{display:block;height:100%}
.row .n{width:56px;text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--ink2)}
.acts{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:150px;padding:13px;font-size:14px}
.rv{border-top:1px solid var(--line);padding:15px 0}
.rv .qq{font-size:14px;margin-bottom:8px;white-space:pre-wrap;line-height:1.7}
.rv .yy{font-size:13px;color:var(--accent);margin-bottom:2px}
.rv .cc{font-size:13px;color:var(--ok);margin-bottom:9px}
.empty{font-family:var(--mono);font-size:13px;color:var(--ink2);text-align:center;padding:18px 0}
@media(max-width:420px){.title{font-size:17px}.big{font-size:44px}.row .l{width:92px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="title">過去問道場</div><div class="sub" id="hsub">ITパスポート試験対策</div></header>
  <div class="card" id="app"></div>
</div>
<script>
const CAT={strategy:{n:"ストラテジ系",c:"st"},management:{n:"マネジメント系",c:"mg"},technology:{n:"テクノロジ系",c:"tc"}};
const QS=[{"id":1,"cat":"strategy","sub":"法務","prompt":"生成AIを用いた生成物の取扱いに関して、既存の著作物の著作権者から許諾を得ることが必要となる可能性のあるものだけを、全て挙げたものはどれか。\n\na 好みのアーティストの楽曲に似た音楽が得られるように生成AIを用いて楽曲を生成し、その楽曲をインターネット上にアップロードし、無料で公開した。\nb 好みのアーティストの楽曲に似た音楽が得られるように生成AIを用いて楽曲を生成し、その楽曲を自分のPC上に保管し、個人で視聴した。\nc 生成AIで音楽を生成したところ、偶然好みのアーティストの楽曲に似た音楽が生成できたので、自分のPC上に保管し、個人で視聴した。","opts":["a","a, b","a, b, c","b, c"],"ans":0,"why":"著作権侵害が問題になるには「①既存著作物に似せる意図（依拠性）」と「②公衆への利用行為」の両方が要る。aは似せる意図があり、かつネット公開＝公衆送信なので許諾が必要になり得る。","wrong":"bは似せる意図はあるが個人視聴のみ＝著作権法30条の「私的使用のための複製」で許諾不要。cは依拠性すらなく（偶然）、かつ私的使用。よってb・cを含む選択肢は全て誤り。","tip":"著作権は「private（自分の中）は自由、public（外に出す）はアウト」。PCの中に置いとくだけならセーフ、ネットに上げた瞬間アウト、と覚える。","year":"r8"},{"id":2,"cat":"strategy","sub":"経営・組織","prompt":"BYODに関する記述として、適切なものはどれか。","opts":["企業の業務に、従業員が私物の携帯情報端末を許可を得た上で利用すること","企業の業務の定型的な作業をソフトウェアのロボットで効率化すること","企業の業務の流れを分析し、継続的に改善、最適化していくこと","企業の業務の流れを見直し、抜本的にデザインし直すこと"],"ans":0,"why":"BYOD＝Bring Your Own Device。「自分のデバイスを持ち込む」というそのままの意味。","wrong":"イはRPA、ウはBPM（業務プロセス管理）、エはBPR（業務改革）。この3つは「業務改善系」で固まっているので、BYODだけ毛色が違うと気づけば消去法で解ける。","tip":"英語を分解するだけで答えが出る問題。Bring Your Own Device＝私物持ち込み。飲み会の「BYOB（酒は自分で持ってこい）」と同じ発想。","year":"r8"},{"id":3,"cat":"strategy","sub":"経営戦略手法","prompt":"投資会社であるA社が、それぞれの投資戦略を採る場合の利益は、表のように予想される。A社がマクシミン戦略を採り、かつ、市況が好転した場合の利益はどれか。マクシミン戦略とは、戦略ごとに予想される利益の最小値が最も大きくなるように戦略を採用する理論である。\n\n　　　　　　　市況が好転　市況が悪化\n投資戦略a　　　20　　　　　-15\n投資戦略b　　　 5　　　　　  0","opts":["-15","0","5","20"],"ans":2,"why":"手順は2段階。①各戦略の最悪値を出す→aは-15、bは0。②最悪値が最大の戦略を選ぶ→0>-15なのでbを採用。③その上で問われているのは「好転した場合」なので、bの好転欄＝5。","wrong":"エ(20)はaを選んでしまった人の答え。ア(-15)・イ(0)は「最小値そのもの」を答えてしまった人の答え。問題は最後に『好転した場合』と聞いているのがミスの誘発ポイント。","tip":"マクシミン＝maximin＝『minを最大化』。悲観論者の戦略。最悪を想定して、その中でマシなやつを選ぶ。逆にマキシマックス（maximax）は楽観論者で、最高値が最大の戦略を選ぶ。","year":"r8"},{"id":4,"cat":"strategy","sub":"技術戦略","prompt":"特定の目的の達成や課題の解決をテーマとして、ソフトウェアの開発者や企画者などが短期集中的にアイディアを出し合い、ソフトウェアの開発などの共同作業を行い、成果を競い合うイベントはどれか。","opts":["トレードフェア","ハッカソン","パネルディスカッション","レセプション"],"ans":1,"why":"ハッカソン＝Hack（作る）＋Marathon（マラソン）の造語。短期集中でモノを作り上げる開発イベント。","wrong":"アのトレードフェアは見本市・展示会。ウのパネルディスカッションは討論会。エのレセプションは歓迎会・宴会。どれも「手を動かして作る」要素がない。","tip":"語尾の「-athon（マラソン）」が『長時間ぶっ通し』のサイン。アイデア出しに特化した派生語が『アイデアソン』。","year":"r8"},{"id":5,"cat":"strategy","sub":"法務","prompt":"インターネットを利用した企業広告に関する新たなビジネスモデルを知的財産として出願し、コンピュータシステムとして実現した。このビジネスモデルを知的財産として、保護する法律はどれか。","opts":["意匠法","実用新案法","著作権法","特許法"],"ans":3,"why":"ビジネスモデルそのものはアイデアなので保護対象外だが、それを『コンピュータシステムとして具体的に実現』した時点で特許法の保護対象（ビジネスモデル特許）になる。","wrong":"アの意匠法はデザイン（見た目）。イの実用新案法は物品の形状・構造の小発明。ウの著作権法は表現物（プログラムコードそのものは著作物だが、ビジネスモデルという仕組みは守らない）。","tip":"知財4法の守備範囲を1行で：特許＝技術アイデア、実用新案＝小さい技術、意匠＝見た目、商標＝名前とロゴ。『仕組み』とあったら特許。","year":"r8"},{"id":6,"cat":"strategy","sub":"ビジネスインダストリ","prompt":"デジタルトランスフォーメーションに関する説明として、最も適切なものはどれか。","opts":["PCやスマートフォンなどのデジタル製品を使いこなせる人と、使いこなせない人の間で様々な機会に差が生じて、社会的な格差につながること","生まれた時からインターネット、PCやスマートフォンなどのデジタル製品が身近にあり、それらを利用しながら育った世代のこと","音声を収集するマイクロフォンなどからのアナログ信号を、電子ファイルとして保存するためにデジタル信号に変換すること","デジタル技術が、人間の生活やビジネスなどのあらゆる面に影響を与え、変革をもたらしていくこと"],"ans":3,"why":"DXのキモは『Transformation＝変革』。単なるIT化ではなく、ビジネスモデルや社会そのものが変わることを指す。","wrong":"アはデジタルデバイド（格差）、イはデジタルネイティブ（世代）、ウはデジタイゼーション（単なるデジタル化）。特にウとの区別が最頻出。紙をPDFにするのはDXではない。","tip":"3段階で覚える：デジタイゼーション（紙→データ化）→デジタライゼーション（業務プロセスをIT化）→DX（ビジネスモデルごと変革）。DXは一番デカい話。","year":"r8"},{"id":7,"cat":"strategy","sub":"エンジニアリング","prompt":"製品やサービスの価値を機能とコストの関係で把握し、価値の向上をはかる\"バリューエンジニアリング\"という手法がある。バリューエンジニアリングにおける価値、機能、コストの関係性を示すものとして、適切なものはどれか。","opts":["価値＝機能／（コスト＋機能）","価値＝機能／コスト","価値＝機能×コスト","価値＝コスト／機能"],"ans":1,"why":"V（価値）＝F（機能）／C（コスト）。機能が上がるか、コストが下がれば価値が上がる、という直感どおりの式。","wrong":"エ（コスト／機能）は分子分母が逆。これだと高い商品ほど価値が高いことになり不合理。ウ（掛け算）だとコストをかけるほど価値が上がることになる。","tip":"コスパ（コストパフォーマンス）と同じ発想。『分母にコスト』が鉄則。分母が小さいほど価値が大きい＝安いほど価値が高い、と自然に一致する。","year":"r8"},{"id":8,"cat":"strategy","sub":"ビジネスインダストリ","prompt":"IoTを利用したシステムの事例として、最も適切なものはどれか。","opts":["資金調達において、不特定多数の借り手と貸し手をインターネット上で仲介するサービスを行う。","ソーシャルメディアへの書込みや、コールセンターの通話内容などから、商品やサービスに対する利用者の感情を分析する。","店舗や工場などの設備に設置したセンサーの情報をインターネット経由で集め、設備の状況について、従業員がスマートフォンを用いて監視する。","文書や画像などの電子ファイルを保存するためのインターネット上のストレージを、サービスとして提供する。"],"ans":2,"why":"IoT＝Internet of Things（モノのインターネット）。『物理的なモノ＋センサー＋ネット接続』が三点セット。ウは設備というモノにセンサーを付けてネット経由で監視しており完全一致。","wrong":"アはソーシャルレンディング（フィンテック）、イは感情分析（AI/テキストマイニング）、エはクラウドストレージ（SaaS）。いずれも『物理的なモノ』が登場しない。","tip":"IoTの判定基準は『現実世界の物体が出てくるか』。センサー・カメラ・家電・工場設備が出てきたらIoT。データやお金の話だけならIoTではない。","year":"r8"},{"id":9,"cat":"strategy","sub":"会計・財務","prompt":"製品の製造に関連して発生する次の費用のうち、間接費だけを全て挙げたものはどれか。\n\na 完成した製品を検査する労務費\nb 工場の電気供給設備を保守する労務費\nc 製品の外注加工費","opts":["a, b","b","b, c","c"],"ans":1,"why":"間接費＝『どの製品にいくらかかったか、直接ひも付けられない費用』。bの電気供給設備の保守は工場全体を支える費用で、特定製品に配賦するしかないため間接費。","wrong":"aの検査労務費は「その製品を検査した時間」として製品に直接ひも付く直接労務費。cの外注加工費は「その製品の加工代」なので直接経費。両方とも直接費。","tip":"判定法は『この費用、製品Xの原価票に1行で書けるか？』。書けるなら直接費、工場全体で按分するしかないなら間接費。電気・水道・工場長の給料は間接費の常連。","year":"r8"},{"id":10,"cat":"strategy","sub":"経営・組織","prompt":"会議に関する記述のうち、ブレーンストーミングの進め方として、適切なものだけを全て挙げたものはどれか。\n\na 自由奔放なアイディアは控え、実現可能なアイディアの提出を求める。\nb ほかのメンバーのアイディアに便乗した案であっても、とがめずに進める。\nc メンバーから出されるアイディアの中で、テーマに適したものを選択しながら進める。","opts":["a","a, b","a, b, c","b"],"ans":3,"why":"ブレストの4原則は『批判厳禁・自由奔放・質より量・結合便乗』。bはまさに「結合便乗」を認めるもので原則どおり。","wrong":"aは「自由奔放を控える」で第2原則に真っ向から違反。cは出た端から選別する行為で「批判厳禁」に違反する。ブレストでは評価は後工程に回すのが鉄則。","tip":"4原則を関西弁で：『けなすな（批判厳禁）・好き放題ええ（自由奔放）・数出せ（質より量）・パクってええ（結合便乗）』。選択肢に『選別』『実現可能性』『批判』が出たら全部アウト。","year":"r8"},{"id":11,"cat":"strategy","sub":"法務","prompt":"プロサッカーチームのファンの集いで、人気のある選手が背広姿でサインをしている姿を撮影し、プリントしてフリーマーケットで販売した。この行為によって侵害されるおそれがある選手が有する権利として、最も適切なものはどれか。","opts":["意匠権","商標権","著作権","パブリシティ権"],"ans":3,"why":"パブリシティ権＝有名人の氏名・肖像がもつ『顧客吸引力（経済的価値）』を本人が独占できる権利。無断で商品化して販売すればこれを侵害する。","wrong":"ウの著作権は写真を撮った人（撮影者）に発生する権利で、被写体である選手の権利ではない。ここが最大の引っかけ。ア意匠権はデザイン、イ商標権は営業標識で無関係。","tip":"『撮った人＝著作権』『写った有名人＝パブリシティ権』とセットで覚える。パブリシティ＝publicity＝広告価値。名前や顔が金を生む有名人にだけ認められる。","year":"r8"},{"id":12,"cat":"strategy","sub":"システム戦略","prompt":"A社は、自社の業務プロセスの課題を抽出し、見直しをするために流れ図を用いて業務プロセスを可視化することにした。A社が流れ図の作成において利用する記述様式として、最も適切なものはどれか。","opts":["CRUD図","DMM (Diamond Mandala Matrix)","E-R図","WFA (Work Flow Architecture)"],"ans":3,"why":"WFA＝Work Flow Architecture。その名のとおり業務（Work）の流れ（Flow）を、組織や役職を縦軸に取って可視化する記述様式。","wrong":"アCRUD図はデータに対する生成・参照・更新・削除の対応表（流れではない）。イDMMは9マス×9マスの発想法。ウE-R図はデータ間の関連を表す図で、業務の流れは表さない。","tip":"英語のまま読むのが最速。Work Flow＝業務フロー。E-R図（Entity-Relationship）はデータの静的な関係、WFAは業務の動的な流れ、と対比で覚える。","year":"r8"},{"id":13,"cat":"strategy","sub":"法務","prompt":"個人情報保護法に規定された匿名加工情報の説明として、最も適切なものはどれか。","opts":["厚生労働省や総務省統計局などが公開している統計情報を自社向けに加工し、自社の保有する情報とひも付けて新たな価値をもたせた情報","個人情報のうち氏名を一定の規則に基づいて匿名化するが、元の個人情報への復元を担保した情報","個人情報を法令に定める方法で匿名化し、復元できないようにしたもので、一定のルールの下で本人の同意なく利活用できる情報","利用者から個人情報を収集する際に、氏名を取得せず個人番号などほかの情報で個人を識別できるようにして収集した情報"],"ans":2,"why":"匿名加工情報の要件は『特定の個人を識別できない』＋『元の個人情報に復元できない』の2つ。この条件を満たせば本人同意なしにビッグデータとして利活用できる。","wrong":"イは『復元を担保した』時点でアウト。これは仮名加工情報（内部利用限定）に近い別概念。エは個人番号で個人を識別できてしまうので加工不足。","tip":"『復元できたら匿名やない』。仮名加工情報（復元しうる／社内利用のみ）と匿名加工情報（復元不可／第三者提供OK）はペアで問われるので必ず対で覚える。","year":"r8"},{"id":14,"cat":"strategy","sub":"経営・組織","prompt":"ISO 26000とは、組織の社会的責任についての国際規格である。ISO 26000で定められている、企業が果たすべき社会的責任を表す用語として、最も適切なものはどれか。","opts":["CSR","SDGs","コーポレートガバナンス","ソーシャルメディアポリシー"],"ans":0,"why":"CSR＝Corporate Social Responsibility（企業の社会的責任）。ISO 26000はまさにこのCSRの国際的なガイダンス規格。","wrong":"イSDGsは国連が定めた持続可能な開発目標（企業だけの責任規格ではない）。ウコーポレートガバナンスは企業統治＝経営を監視する仕組みで、社会的責任とは別軸。","tip":"問題文の『社会的責任』をそのまま英訳すればSocial Responsibility＝CSR。ISOの番号は覚えなくていい（ISO27001＝情報セキュリティ、ISO9001＝品質だけ押さえれば十分）。","year":"r8"},{"id":15,"cat":"strategy","sub":"マーケティング","prompt":"マーケティングにおけるイノベーター理論では、新しい製品やサービスが普及していく過程に沿って、消費者を、イノベーター、アーリーアダプター、アーリーマジョリティ、レイトマジョリティ、ラガードという五つのグループに分ける。このとき、アーリーアダプターからアーリーマジョリティへの普及において生じる、越えることが困難な隔たりを表す用語として、最も適切なものはどれか。","opts":["カニバリゼーション","キャズム","死の谷","レッドオーシャン"],"ans":1,"why":"キャズム（chasm＝深い溝）。初期採用者（新しモノ好き16%）と前期多数派（慎重な一般層）の間には価値観の断絶があり、ここを越えられないと製品は普及しない。","wrong":"アのカニバリゼーションは自社製品同士の共食い。ウの死の谷は研究開発が事業化に至らない資金の壁（技術経営の用語で普及過程の話ではない）。エのレッドオーシャンは競争激化市場。","tip":"『16%の壁』とセットで記憶。イノベーター2.5%＋アーリーアダプター13.5%＝16%を超えられるかが分岐点。chasmは地面がパックリ割れた谷のイメージ。","year":"r8"},{"id":16,"cat":"strategy","sub":"AI","prompt":"教師あり学習において、正解となる情報を付与する作業を表す用語として、最も適切なものはどれか。","opts":["アノテーション","エンコード","データクレンジング","フィルタリング"],"ans":0,"why":"アノテーション（annotation＝注釈付け）。画像に「これは猫」とラベルを貼るような、教師データを作る人手の作業。","wrong":"イエンコードは符号化（形式変換）。ウデータクレンジングは表記ゆれや欠損値の掃除であって、正解を与える作業ではない。エフィルタリングは選別・除去。","tip":"annotation＝注釈。教科書に赤ペンで正解を書き込むイメージ。AI分野で『ラベル付け』とあれば即アノテーション。クレンジング（掃除）との違いは『正解を足すか、汚れを取るか』。","year":"r8"},{"id":17,"cat":"strategy","sub":"AI","prompt":"AIを利活用する上で留意すべき事項として、適切なものだけを全て挙げたものはどれか。\n\na AIの意図しない動作によって、人間の生命や身体などに危害を及ぼす可能性\nb AIの判断に差別的な内容が含まれる可能性\nc AIの判断にプライバシーの侵害となる内容が含まれる可能性","opts":["a, b","a, b, c","a, c","b, c"],"ans":1,"why":"a（安全性）、b（公平性・バイアス）、c（プライバシー）はいずれもAI倫理の中核論点。政府のAI原則にも全て明記されており、3つとも正しい。","wrong":"この形式は『全部正しい＝イ』が正解のパターン。1つでも「これは違う」と思って外すと不正解になる。留意事項を問う問題は基本的に全肯定を疑う。","tip":"AI倫理の三本柱：『危なくないか（安全性）』『えこひいきしてないか（公平性）』『覗いてないか（プライバシー）』。倫理系の問題は、常識的にマズいと思うことは全部『留意すべき』が答え。","year":"r8"},{"id":18,"cat":"strategy","sub":"エンジニアリング","prompt":"コンカレントエンジニアリングを採用する目的として、最も適切なものはどれか。","opts":["開発期間や納期の短縮","開発製品におけるセキュリティの確保","開発製品の省エネルギー性能の確保","開発製品への最新技術の活用"],"ans":0,"why":"コンカレント（concurrent）＝同時並行。設計・製造・調達などの工程を直列ではなく並行して進めることで、トータルの開発期間を圧縮する。","wrong":"イ・ウ・エはいずれも『製品の品質・性能』の話であり、工程の進め方であるコンカレントエンジニアリングの目的とは無関係。","tip":"concurrent＝同時発生。プログラミングの『並行処理』と全く同じ語。並行させる目的は昔から一つだけ、時間短縮。","year":"r8"},{"id":19,"cat":"strategy","sub":"システム戦略","prompt":"サーバ上にインストールされたアプリケーションソフトウェアを、インターネット経由で利用者に提供する事業者、又はそのサービス形態として、適切なものはどれか。","opts":["ASP","ISP","アウトソーシング","データウェアハウス"],"ans":0,"why":"ASP＝Application Service Provider。アプリケーションをネット越しに提供する事業者・形態。今でいうSaaSの先祖にあたる概念。","wrong":"イISPはInternet Service Provider＝回線接続業者（アプリは提供しない）。ここが最大の引っかけ。ウは業務委託全般、エはデータ分析用の蓄積基盤。","tip":"頭文字だけで判別：A＝Application（アプリ屋）、I＝Internet（回線屋）。ASPとSaaSはほぼ同義と考えてよい。","year":"r8"},{"id":20,"cat":"strategy","sub":"システム戦略","prompt":"システム開発におけるRFPの説明として、適切なものはどれか。","opts":["ITベンダーが、情報システム開発の必要性をユーザーに提案するために作成した提案文書","発注者側が、開発すべき情報システムの調達条件などをITベンダーに示すために作成した文書","発注者と受注したITベンダーが、開発するシステムの仕様を明確にするために共同で作成した設計文書","ユーザー部門が、情報システム部門に情報システム開発の必要性と開発要件を明確にするように求めた文書"],"ans":1,"why":"RFP＝Request For Proposal（提案依頼書）。発注者がベンダーに向けて『こういう条件で提案してくれ』と示す文書。矢印の向きは発注者→ベンダー。","wrong":"アはベンダー側が作る提案書（Proposal本体）で、矢印が逆。ウは要件定義書・設計書。エは社内の開発要求で、RFPは社外調達が前提。","tip":"Request（依頼）が付いていたら『買う側が出す』。RFI（情報提供依頼書）→RFP（提案依頼書）→提案書→契約、の順番も一緒に押さえると流れで解ける。","year":"r8"},{"id":21,"cat":"strategy","sub":"法務","prompt":"サイバーセキュリティ基本法の立法趣旨を説明したものはどれか。","opts":["コンピュータへの不正アクセス行為を定義し、その行為を禁止するとともに罰則を定め、ネットワーク通信秩序の維持を図ること","情報セキュリティに関する適切なコントロールを整備、運用するための実践的な規範を定め、企業などで効果的な情報セキュリティ対策の推進を促すこと","情報通信ネットワークを通じたコンピュータへの不正侵入などの行為に対する防御施策に関し、基本理念を定め、国及び地方公共団体の責務などを明らかにして、施策の総合的かつ効果的な推進を図ること","デジタルコンテンツの複製防止のための技術的制限手段を無効化する行為などを規制することによって、企業などの営業上の利益を確保すること"],"ans":2,"why":"『基本法』という名のとおり、個別の行為を罰するのではなく、国・自治体の責務や基本理念を定めて国全体の施策を推進する枠組み法。ウだけが『基本理念』『国及び地方公共団体の責務』に言及している。","wrong":"アは不正アクセス禁止法（罰則を定める行為規制法）。イはISMS/JIS Q 27001などの規範。エは不正競争防止法の技術的制限手段の話。","tip":"法律名に『基本法』が付いたら、中身は必ず『理念・国の責務・施策推進』の3点セット。罰則や具体的禁止行為が書いてある選択肢は基本法ではない。","year":"r8"},{"id":22,"cat":"strategy","sub":"システム戦略","prompt":"伝票入力処理などの定型的な事務作業を、ソフトウェアロボットに代替させることによって、自動化や効率化を図る手段として、最も適切なものはどれか。","opts":["BPO","EUC","FA","RPA"],"ans":3,"why":"RPA＝Robotic Process Automation。PC上の定型的なホワイトカラー業務をソフトウェアロボットが代行する技術。","wrong":"アBPOは業務そのものを外部企業に委託すること（人がやる、社外で）。イEUCはエンドユーザー自身がシステムを作ること。ウFAはFactory Automation＝工場の物理的な自動化。","tip":"『どこを自動化するか』で区別：FA＝工場（物理）、RPA＝事務所のPC作業（ソフト）。Roboticの前にProcess（業務プロセス）が付くのがRPAの本質。","year":"r8"},{"id":23,"cat":"strategy","sub":"マーケティング","prompt":"インターネット広告の手法の一つである、リスティング広告に関する記述として、最も適切なものはどれか。","opts":["Webサイトの閲覧履歴やオンラインショッピングの購買履歴などの利用者の行動履歴を基にして、広告を表示する。","検索エンジンの利用者が検索ボックスに入力したキーワードに連動して、広告を表示する。","事前に広告メールの受信を許諾した利用者に対して、広告メールを配信する。","定期的に発行するメールマガジンに、広告を掲載して配信する。"],"ans":1,"why":"リスティング広告＝検索連動型広告。検索結果の一覧（list）に紛れて表示されるのが名前の由来。今まさに検索している＝購買意欲が高い瞬間に当てられるのが強み。","wrong":"アは行動ターゲティング広告（過去の履歴ベース）。ウはオプトインメール広告。エはメールマガジン広告。アとの違いは『今の検索キーワード』か『過去の行動履歴』か。","tip":"listing＝一覧に載せる。検索結果リストの上に出るアレ。『いま探しているものに刺す』のがリスティング、『過去の行動から追いかける』のが行動ターゲティング。","year":"r8"},{"id":24,"cat":"strategy","sub":"経営・組織","prompt":"コーポレートガバナンスの説明として、適切なものはどれか。","opts":["株主を始めとした利害関係者による経営者への監視や監督を中心とした、企業活動を律する枠組みのこと","企業が活動を行う上で必要な資本の調達のこと","企業の理念や特性を、統一されたイメージやデザインなどで発信し、企業のブランド価値の向上を図ること","競合他社では提供が不可能な価値をもたらす、企業が有する独自のスキルや技術のこと"],"ans":0,"why":"ガバナンス＝統治。『経営者が暴走しないように、株主など外部が監視する仕組み』が本質。主語が株主・利害関係者側にあるのがポイント。","wrong":"イはファイナンス（資金調達）。ウはCI（コーポレートアイデンティティ）。エはコアコンピタンス。特にエは『企業が有する』という主語につられやすい。","tip":"ガバナンス（統治＝監視される側は経営者）とコンプライアンス（法令遵守）はセット問題の常連。『誰が誰を見張るか』で判定：株主→経営者ならガバナンス。","year":"r8"},{"id":25,"cat":"strategy","sub":"ビジネスインダストリ","prompt":"大容量、頻繁な更新、多種多様という三つの要素をもつ情報資産を\"ビッグデータ\"と定義する考え方がある。このビッグデータを特徴づける三つの要素を総称して何というか。","opts":["3C","3D","3G","3V"],"ans":3,"why":"Volume（量）・Velocity（速度＝更新頻度）・Variety（多様性）の頭文字を取って3V。問題文の『大容量・頻繁な更新・多種多様』がそのまま対応している。","wrong":"ア3Cは市場分析のCustomer/Competitor/Company。イ3Dは三次元。ウ3Gは第3世代移動通信。いずれもビッグデータとは無関係。","tip":"問題文の3語を英訳するだけ：量＝Volume、速さ＝Velocity、多様＝Variety。全部Vで始まるから3V。最近はVeracity（正確性）を足して4Vとも言う。","year":"r8"},{"id":26,"cat":"strategy","sub":"会計・財務","prompt":"表はA社の貸借対照表である。A社の自己資本比率は何％か。\n\n【資産の部】流動資産 730／固定資産 270\n【負債の部】流動負債 200／固定負債 500\n【純資産の部】資本金 300\n（単位 百万円）","opts":["30","54","70","90"],"ans":0,"why":"自己資本比率＝自己資本（純資産）÷総資産×100。総資産＝730+270＝1,000、純資産＝300。よって300÷1,000＝30%。","wrong":"ウ70%は負債比率（700÷1,000）を答えたパターン。負債と純資産を取り違えると即このワナに落ちる。貸借対照表は必ず『左（資産）＝右（負債＋純資産）』が成立することを検算に使う。","tip":"自己資本＝『返さなくていい金』＝純資産。他人資本＝『返す金』＝負債。比率が高いほど借金依存が低く倒産しにくい。日本企業の平均は40%前後。","year":"r8"},{"id":27,"cat":"strategy","sub":"AI","prompt":"AIを、様々な課題に対して判断できる\"強いAI\"と、特定の課題だけを判断できる\"弱いAI\"に分類した場合、\"弱いAI\"の記述として、最も適切なものはどれか。","opts":["人間と同等の知能がコンピュータ上で再現され、人間のように判断することができるが、人間と同じような判断ミスをすることもある。","人間のように質問そのものの意味を理解したり、考えたりしているわけではないが、判断の結果を示すことはできる。","人間よりも賢く、人間の手助けがなくても自らの判断力を高めることができる。","自らがもつ知識や能力を自律的に適用することによって、柔軟に判断できる能力がある。"],"ans":1,"why":"弱いAIは『意味を理解していないが、それらしい出力は返せる』のが定義。現在実用化されているAIはほぼ全てこちら。","wrong":"ア・ウ・エはいずれも『人間と同等以上に理解・自律判断する』内容で、これらは全て強いAI（汎用AI）の記述。3つも強いAI側の選択肢が並ぶので、消去法が効く。","tip":"『理解しているフリができるだけ』が弱いAI。中国語の部屋という思考実験がまさにコレ。強いAI＝AGI（汎用人工知能）は現時点では未実現、と割り切って覚える。","year":"r8"},{"id":28,"cat":"strategy","sub":"ビジネスインダストリ","prompt":"インターネット上の商取引に関連したリスクのうち、エスクローサービスを利用することによって低減できるリスクとして、適切なものはどれか。","opts":["オークションサイトに誤った購入金額を入力したときに、取引を取り消せない。","商品の代金を支払ったにもかかわらず、商品が配送されない。","ショッピングサイトで使用しているパスワードが漏えいする。","発注した商品を一旦受け取ると、自己都合では解約できない。"],"ans":1,"why":"エスクロー＝第三者が代金を一時預かりし、買い手が商品到着を確認してから売り手に送金する仕組み。よって『払ったのに届かない』リスクを直接つぶせる。","wrong":"アは入力ミスの問題（システムのUI/確認画面の話）。ウはパスワード管理・認証の問題。エはクーリングオフ等の契約制度の話で、いずれも代金の預かりとは無関係。","tip":"エスクロー＝『間に入る用心棒』。メルカリの売上金が受取評価まで振り込まれへんのが、まさにエスクロー。守るのは『金と品物の同時交換』だけ。","year":"r8"},{"id":29,"cat":"strategy","sub":"法務","prompt":"プログラム開発業務の委託に当たり、請負契約における注文者及び請負業者の権利や義務について特段の取決めがない場合の説明として、適切なものはどれか。","opts":["請負業者が、更に別の業者に仕事の一部を請け負わせる場合は、事前に注文者の承諾を得なければならない。","完成したプログラムに欠陥があるときは、注文者はいつでも欠陥の改修を請求することができる。","注文者には、プログラムの引渡しを受けた時点で、報酬を支払う義務が生じる。","注文者は、プログラムの完成前であればいつでも請負業者に対して損害を賠償することなく請負契約を解除することができる。"],"ans":2,"why":"請負契約は『仕事の完成』に対して報酬を支払う契約。民法上、報酬は目的物の引渡しと同時履行（引渡し時に支払義務が生じる）が原則。","wrong":"アは請負では再委託が原則自由（禁じたければ契約に書く必要がある）。イは契約不適合責任に期間制限があり『いつでも』は誤り。エは解除自体はできるが損害賠償は必要なので『賠償することなく』が誤り。","tip":"請負と準委任の違いが最重要。請負＝完成義務あり・成果物に責任を負う。準委任＝善管注意義務のみ・完成責任なし。SESは準委任、受託開発は請負。","year":"r8"},{"id":30,"cat":"strategy","sub":"経営・組織","prompt":"事業部制組織の事例はどれか。","opts":["AさんはX事業を実施している部門の購買組織に所属している。Y事業の購買はY事業を実施している部門の購買組織が担当している。","Bさんは複数の事業の人事機能を担当する組織に所属している。開発、生産、販売機能も同様に、それぞれ専門の組織が担当している。","Cさんは地域Mで製品Xの販売を担当しており、地域Mの販売に責任をもつ上司と製品Xの販売に責任をもつ上司の、2人の上司の指示を受けている。","Dさんは新規事業の企画開発を目的として関係部署から横断的に人材を集めた組織に所属している。この組織は企画開発が終わり次第解散する。"],"ans":0,"why":"事業部制＝事業ごとに購買・製造・販売などの機能を一式そろえて独立採算で動く形態。アは事業ごとに別々の購買組織を持っており完全一致。","wrong":"イは機能別組織（職能別）。ウは上司が2人いる時点でマトリックス組織。エは期限付きで解散するのでプロジェクト組織。4つの組織形態が4択に1つずつ配置された定番構成。","tip":"判定キーワード：『事業ごとに機能が重複』→事業部制。『機能ごとに集約』→機能別。『上司が2人』→マトリックス。『終わったら解散』→プロジェクト。","year":"r8"},{"id":31,"cat":"strategy","sub":"エンジニアリング","prompt":"リーン生産方式による業務改善の観点であるムリ、ムラ、ムダのうち、ムダに当たるものとして、最も適切なものはどれか。","opts":["属人化していて、担当者によって作成物の品質が異なる作業","組織の能力以上に負荷をかける無謀な計画や作業標準","待機や必要以上の加工など、付加価値を生まない動作","長時間、身体の一部に負担がかかり、健康を害するおそれのある作業"],"ans":2,"why":"ムダ＝付加価値を生まない動作。トヨタ生産方式の7つのムダには『手待ち』『加工そのもののムダ（過剰加工）』が明記されており、ウがそのまま該当。","wrong":"アは担当者によってバラつく＝ムラ。イは能力以上の負荷＝ムリ。エは健康被害の話で3ム分類では労働安全の領域。ア・イとの3択勝負になる問題。","tip":"3ムの割り当て：ムリ＝過負荷（多すぎ）、ムラ＝バラつき（不安定）、ムダ＝価値を生まない（余計）。『バラつき』の語が出たら即ムラ、と反射で切れるようにする。","year":"r8"},{"id":32,"cat":"strategy","sub":"経営戦略手法","prompt":"ニッチ戦略の事例として、最も適切なものはどれか。","opts":["アパレルメーカーA社は、生産コストを下げるために、生産拠点を海外に移した。また、大量に販売が見込めるカジュアルウェアを中心に、安価な商品を全国で販売することにした。","業界2位の食品メーカーB社は、トップシェアを獲得するために、業界3位のC社と経営統合することにした。","金属加工メーカーD社は、自社固有の加工技術を生かして、密閉度の極めて高い高価な無水調理鍋を高級レストラン向けに販売することにした。","電機メーカーE社は、販売量が減ってきた中型テレビ事業を売却し、完全撤退することにした。"],"ans":2,"why":"ニッチ＝隙間。大手が参入しない小さな市場に、独自技術で特化して高付加価値を取る戦略。ウは『固有技術＋高級レストラン向け』と対象を絞り込んでおり完全一致。","wrong":"アは全国・大量・安価でコストリーダーシップ戦略。イはM&Aによるシェア拡大。エは事業撤退（選択と集中）で、いずれも隙間狙いではない。","tip":"ポーターの3つの基本戦略で整理：コストリーダーシップ（安さで全体）／差別化（違いで全体）／集中（狭い市場に絞る）。ニッチは集中戦略の一種。『高級』『向け』『特化』が出たらニッチ。","year":"r8"},{"id":33,"cat":"strategy","sub":"システム戦略","prompt":"購買、製造、販売という供給者から消費者までを結ぶ一連の業務のつながりを総合的に管理し、資材の調達から顧客への販売に至る在庫などの無駄をなくして、プロセス全体の最適化を図るものはどれか。","opts":["CRM","POS","SCM","SFA"],"ans":2,"why":"SCM＝Supply Chain Management。供給の鎖（調達→製造→物流→販売）を一本の流れとして管理し、全体最適を図る手法。","wrong":"アCRMは顧客関係管理（顧客との関係づくり）。イPOSは販売時点情報管理（レジのデータ収集）。エSFAは営業支援システム。3つとも『顧客・販売サイド』に寄った用語で、供給の川上をカバーしていない。","tip":"Supply Chain＝供給の鎖。頭文字で分ける：S＝Supply（供給）、C＝Customer（顧客）、S＝Sales Force（営業部隊）。上流から下流までを『鎖』でつなぐのはSCMだけ。","year":"r8"},{"id":34,"cat":"strategy","sub":"システム戦略","prompt":"IT基本計画の策定の際、明確にすべき事項だけを全て挙げたものはどれか。\n\na ITシステムの利活用に関わるステークホルダ\nb 組織体の現在及び将来的なニーズへの対応\nc 発生したインシデントに関する管理手順\nd 利用者及び関係者との合意に基づいた業務要件とその優先順位","opts":["a, b","a, b, c","a, b, d","b, c, d"],"ans":0,"why":"IT基本計画は経営レベルの大枠を決める段階。ここで明確にするのは『誰が関わるか（a）』と『組織の現在・将来のニーズ（b）』という方向性。","wrong":"cのインシデント管理手順は運用フェーズのサービスマネジメントの話で、基本計画の段階ではない。dの業務要件と優先順位は個別システムの要件定義フェーズの話。cとdは『粒度が細かすぎる』ので落とす。","tip":"計画の階層を意識する：基本計画（方向性・体制）→個別計画（要件・優先順位）→運用（インシデント手順）。選択肢に『手順』『優先順位』など細かい実務語が出たら、基本計画からは外す。","year":"r8"},{"id":35,"cat":"management","sub":"ITガバナンス","prompt":"情報システムの企画、開発、運用、保守に関わるマネジメントとプロセスに対して、ITガバナンスにおける経営陣の活動として、評価、指示、モニターを実施する必要がある。ITガバナンスにおける経営陣の活動に関する記述として、適切なものだけを全て挙げたものはどれか。\n\na 外部のコンサルタントに責任と権限を委譲し、戦略立案からモニタリングまで全面的に任せる。\nb 情報システム戦略で想定した効果が、どの程度達成されているか確認するための情報を収集する。\nc 情報システム戦略を実現するために、必要な責任と要員を組織に割り当てる。\nd 情報システムの複数の将来像を想定し、外部の情報システムの専門家に比較分析を依頼して評価する。","opts":["a, b, c","a, c","b, c","b, c, d"],"ans":3,"why":"ITガバナンスは経営陣が『評価（Evaluate）・指示（Direct）・モニター（Monitor）』を行うこと。b＝モニター、c＝指示、d＝評価（専門家に分析させて自ら評価する）で、EDMの3要素にきれいに対応する。","wrong":"aだけが誤り。『全面的に任せる』＝丸投げで、経営陣自身の責任放棄にあたる。dの『依頼して評価する』とaの『全面的に任せる』の違いを見抜けるかがポイント。分析は外注してよいが、評価と責任は自分が持つ。","tip":"ガバナンス問題の鉄則：『丸投げ』『全て任せる』『委譲する』が入った選択肢は必ず誤り。逆に『自ら確認する』『自ら割り当てる』は正しい。この一発ルールで大半のガバナンス問題が解ける。","year":"r8"},{"id":36,"cat":"management","sub":"プロジェクトマネジメント","prompt":"クライアントPCへのソフトウェアの導入作業が契約に含まれるシステム開発プロジェクトがある。導入作業の行動に関する記述のうち、適切なものだけを全て挙げたものはどれか。\n\na 導入作業中に契約外のPCが見つかった。そのPCを導入対象外とした。\nb 導入作業中に契約外のPCへの導入を依頼された。依頼に基づいて、その対応を無償で行った。\nc 導入作業の続行が困難な状態となった。発注者と合意し、導入前の状態に復旧した。","opts":["a","a, b","a, c","b, c"],"ans":2,"why":"aは契約範囲を正しく守る行動。cは独断ではなく『発注者と合意して』復旧しており、スコープ変更の手続きとして正しい。","wrong":"bが誤り。契約外の作業を良かれと思って無償対応するのは典型的なスコープクリープで、工数・品質・責任範囲が崩れる。親切心が正解に見える罠。","tip":"PM系の判断問題は『契約とスコープを守る』＋『変更は必ず合意を取る』の2軸で切る。無償サービス・善意の追加対応は、試験では常に不適切。","year":"r8"},{"id":37,"cat":"management","sub":"プロジェクトマネジメント","prompt":"Aさんは新規プロジェクトの計画段階の作業をしており、開発コストの見積りに着手した。この段階で短期的に概算費用を見積もる方法として、最も適切なものはどれか。","opts":["FP法を用いて見積もる。","作業単位のコストを見積もり、合算して全体を見積もる。","予想されるソフトウェアのコード行数を基に見積もる。","類似プロジェクトを参考に見積もる。"],"ans":3,"why":"計画段階では詳細な仕様がまだ固まっていない。過去の類似案件の実績を流用する『類似見積法（トップダウン見積り）』が最も短時間で概算を出せる。","wrong":"アFP法は機能を数える必要があり詳細が要る。イはボトムアップ見積りでWBS分解が前提、時間がかかる。ウLOC法もコード行数の予測に設計情報が必要。いずれも『短期的に概算』の条件を満たさない。","tip":"見積り手法は『必要な情報量』で並ぶ：類似（情報ゼロ・最速）＜FP法（機能要件が必要）＜LOC法（設計が必要）＜ボトムアップ（WBSが必要・最精緻）。『初期段階・概算』とあれば必ず類似。","year":"r8"},{"id":38,"cat":"management","sub":"開発技術","prompt":"要求事項が明確であり仕様変更が少ないことが見込まれるソフトウェアの開発に用いる開発モデル・手法として、最も適切なものはどれか。","opts":["アジャイル開発","ウォーターフォールモデル","スパイラルモデル","プロトタイピングモデル"],"ans":1,"why":"ウォーターフォールは上流から下流へ一方向に進み、後戻りを想定しない。だからこそ『要求が明確で変更が少ない』案件に最も適合する。","wrong":"ア・ウ・エはいずれも『要求が固まっていない・変わる』ことを前提に、反復や試作で不確実性を吸収する手法。問題文の条件と正反対。","tip":"開発モデルは『不確実性が高いか低いか』の一軸で選べる。低い→ウォーターフォール。高い→アジャイル/スパイラル/プロトタイピング。問題文に『明確』『変更が少ない』とあれば即ウォーターフォール。","year":"r8"},{"id":39,"cat":"management","sub":"プロジェクトマネジメント","prompt":"システム開発のプロジェクトマネジメントにおけるWBSの説明として、最も適切なものはどれか。","opts":["クリティカルパス上の作業を記載したものである。","主要な成果物に関する予定開始日と予定終了日を記載したものである。","全ての成果物を作成するための作業を階層的に分解して記載したものである。","プロジェクトで使用するツールを記載したものである。"],"ans":2,"why":"WBS＝Work Breakdown Structure（作業分解構成図）。成果物を作るための作業をツリー状に細分化したもの。名前がそのまま定義。","wrong":"アはアローダイアグラム（PERT図）で分かること。イはガントチャートやマイルストーン表の役割。WBSには日付は入らない、という点が最頻出の引っかけ。","tip":"WBS＝Work（作業）をBreakdown（分解）したStructure（構造）。『日付が入る＝ガントチャート』『順序と最長経路＝アローダイアグラム』『分解だけ＝WBS』で3点セット。","year":"r8"},{"id":40,"cat":"strategy","sub":"経営・組織","prompt":"企業の活動に関する記述のうち、内部統制の活動内容として、最も適切なものはどれか。","opts":["決算発表の内容に重大な誤りがあった場合は、速やかに外部に公表する。","支払伝票を起票した際は、起票者が責任をもって確認し最終承認を行う。","定期的にリスクを評価し、洗い出されたリスクの全てを\"回避\"で対応する。","内部通報は必ず直属の上司を通じて行うことを、ルールとして徹底する。"],"ans":0,"why":"内部統制の目的の一つが『財務報告の信頼性』。誤りを隠さず速やかに公表・訂正するのは、その目的に直結する適切な行動。","wrong":"イは起票者が自分で最終承認しており職務分掌違反（不正の温床）。ウはリスク対応が回避一択では事業が成立しない（低減・移転・受容も使う）。エは上司自身が不正の当事者なら通報が潰れるため、直属上司を迂回する経路が必須。","tip":"内部統制の3つの引っかけパターンを暗記：『一人で完結（職務分掌違反）』『全て◯◯で対応（極端）』『通報経路が一本（潰される）』。この3つが出たら即座に切る。","year":"r8"},{"id":41,"cat":"management","sub":"ITガバナンス","prompt":"ITガバナンスの活動において、取締役会等のリーダーシップに関するリスクの記述として、最も適切なものはどれか。","opts":["権限委譲して策定させた成果物であるIT戦略は、担当部門に最終的な責任をもたせないと、取締役会等の説明責任が果たせない。","組織体としてのパフォーマンスの期待値は、取締役会等が設定に関与すると、現状踏襲型となり組織体の目的を達成できない。","取締役会等が規範を策定し、率先して遵守しないと、組織体にその倫理的な行動が徹底されない。","取締役会等が組織体のITガバナンス方針を明示すると、情報システム部門主導の活動に偏重してしまう。"],"ans":2,"why":"トーンアットザトップ（Tone at the Top）の考え方。トップ自身が規範を守らなければ、現場に倫理は根付かない。これがリーダーシップ上の最大リスク。","wrong":"アは責任を担当部門に押し付ける発想で、取締役会の説明責任は委譲できない。イ・エはいずれも『トップが関与すると悪くなる』という主張で、ガバナンスの前提と逆。","tip":"ここでも『トップが関与しない方がいい』系の選択肢は全部誤り、というルールが効く。ガバナンス問題は常に『トップが自ら動くのが正解』。","year":"r8"},{"id":42,"cat":"management","sub":"サービスマネジメント","prompt":"サービスデスクに関する記述として、最も適切なものはどれか。","opts":["受入テストの段階で、利用者からの不具合の報告を受け付ける窓口","システム稼働後の段階で、利用者からの問合せを受け付ける窓口","プログラム開発の段階で、利用者からの質問を受け付ける窓口","要件定義の段階で、利用者からの要求を受け付ける窓口"],"ans":1,"why":"サービスデスクはITサービスマネジメント（運用フェーズ）の機能。本番稼働後、利用者との単一窓口（SPOC）として問合せ・障害報告を受け付ける。","wrong":"ア・ウ・エはいずれも開発フェーズ（受入テスト・開発・要件定義）の窓口。サービスデスクは『サービス』の名のとおり、運用中のサービスが対象。","tip":"ITILは運用の話、と一本線を引く。『開発中』『テスト中』とあればサービスデスクではない。SPOC＝Single Point Of Contact（単一窓口）も一緒に覚える。","year":"r8"},{"id":43,"cat":"management","sub":"開発技術","prompt":"ある企業でスマートフォン向けのアプリケーションソフトウェアの開発を計画しており、2週間ごとに新機能や不具合の修正を含めた新しいバージョンを繰り返しリリースすることにした。新機能の候補や不具合は一覧表で管理し、優先順位をつけて開発し、逐次リリースする方針にした。この開発に採用するソフトウェア開発モデルとして、最も適切なものはどれか。","opts":["DevOps","アジャイル","ウォーターフォール","リバースエンジニアリング"],"ans":1,"why":"『2週間ごとの反復』＝スプリント、『一覧表で管理し優先順位をつける』＝プロダクトバックログ。スクラム（アジャイル）の実践そのもの。","wrong":"アDevOpsは開発と運用の連携・文化の話で、開発モデルそのものではない（アジャイルと併用される概念）。ウは反復しない。エは既存製品から仕様を復元する技術で開発モデルではない。","tip":"数字が効く：『1〜4週間の反復』と書いてあればアジャイル確定。DevOpsは『Ops（運用）』の語が問題文にあるかで判別する。今回は運用の話が一切出ていない。","year":"r8"},{"id":44,"cat":"management","sub":"サービスマネジメント","prompt":"あるサービスデスクでは、電子メールによる問合せに対応しており、受付担当者がメールの内容を確認し、回答担当者の割当てをしていた。このたび、割当て業務の効率化を目的に、自動割当てツールを導入した。導入前及び導入半年後の状況が次のとき、割当ての時間はサービスデスク全体で何％削減できたか。\n\n【導入前】問合せ1,000件/日、割当ての時間 2分/件\n【導入半年後】問合せ1,000件/日\n・自動割当てができた割合 90%（割当ての時間 0分/件）\n・うち、割当てミスの割合 5%（割当ての時間 4分/件）\n・自動割当てができなかった割合 10%（割当ての時間 2分/件）","opts":["80","81","85","86"],"ans":1,"why":"導入前＝1,000件×2分＝2,000分。導入後は3つに分解：①自動成功かつミスなし＝900件の95%＝855件×0分＝0分、②割当てミス＝900件の5%＝45件×4分＝180分、③自動不可＝100件×2分＝200分。合計380分。削減率＝(2000-380)÷2000＝81%。","wrong":"ア80%は『5%』を1,000件に対してかけてしまうなどの計算ズレ。エ86%は割当てミスの180分を数え忘れた場合。『うち』という語を見落とすと母数を間違える。","tip":"この手の問題は『件数×時間』の表を自分で書き直すのが最短。特に『うち、〜の割合』は直前の項目に対する内訳を意味する（1,000件ではなく900件が母数）。ここだけ注意すれば落とさない。","year":"r8"},{"id":45,"cat":"management","sub":"プロジェクトマネジメント","prompt":"プロジェクトにおいて、新規プロジェクトを正式に認可する文書として、適切なものはどれか。","opts":["ステークホルダ登録簿","プロジェクト憲章","プロジェクトスコープ記述書","リスク登録簿"],"ans":1,"why":"プロジェクト憲章＝プロジェクトを正式に立ち上げ、プロジェクトマネージャに権限を与える公式文書。プロジェクトの出生証明書にあたる。","wrong":"アは利害関係者の一覧、ウは作業範囲の定義書、エはリスクの管理表。いずれも憲章の後に作られる管理文書で、『認可』の機能はない。","tip":"憲章＝Charter＝国の憲法と同じ語感。一番最初にあって、一番エラい文書。『正式に認可』『権限を与える』とあれば即プロジェクト憲章。","year":"r8"},{"id":46,"cat":"management","sub":"サービスマネジメント","prompt":"ITサービスマネジメントのプロセスである問題管理の説明として、適切なものはどれか。","opts":["ITサービスを提供するためのハードウェア、ソフトウェア、ドキュメントなどの構成情報を維持管理する。","計画外のITサービスの中断に対して、迅速にサービスを復旧する。","障害の根本原因を調査し、問題の解決策を提示する。","プログラム修正を実施するための計画を立て、確実に修正されるように管理する。"],"ans":2,"why":"問題管理は『なぜ起きたか』を掘り下げ、恒久的な再発防止策を出すプロセス。時間をかけてでも根本原因（Root Cause）を潰すのが役割。","wrong":"アは構成管理。イはインシデント管理（とにかく早く復旧＝原因は後回しでもよい）。エは変更管理・リリース管理。特にイとの区別が最頻出。","tip":"インシデント管理＝『止血』（速さ最優先）、問題管理＝『原因究明と根治』（正しさ優先）。救急外来と精密検査の関係で覚えると混同しない。","year":"r8"},{"id":47,"cat":"management","sub":"システム監査","prompt":"監査を会計監査、業務監査、情報セキュリティ監査、システム監査に分けたとき、システム監査に関する記述として、最も適切なものはどれか。","opts":["業務で使用している情報の漏えいに関するリスクマネジメントが効果的に実施されていることの検証","財務諸表の作成に至る業務全般に関して、不正や誤りがなく処理されていることの検証","情報システムに係るリスクに対して、組織において適切に対応していることの検証","情報システムの利用を含めた組織内の諸業務が組織の方針に従って、合理的かつ効率的に運用されていることの検証"],"ans":2,"why":"システム監査の対象は『情報システムに係るリスク』への対応が適切かどうか。ウがドンピシャの定義。","wrong":"アは情報セキュリティ監査（情報漏えいに限定）。イは会計監査（財務諸表）。エは業務監査（業務全般の合理性・効率性）。4つの監査が4つの選択肢に1つずつ配置された構成なので、キーワードで割り振れば確実に取れる。","tip":"キーワード対応表：財務諸表→会計監査／漏えい・機密→情報セキュリティ監査／情報システム全般のリスク→システム監査／業務の効率性→業務監査。","year":"r8"},{"id":48,"cat":"management","sub":"サービスマネジメント","prompt":"ある組織では、IT資産を管理しているグループが、共有ディスクの使用量を月次でチェックし、容量が不足しそうなときは、不要なファイルを消すよう呼び掛けたり、すぐに使わないファイルを別のメディアに退避したりして、容量が不足することを回避する対応を行っている。共有ディスクの増設の対応は、年単位で計画して実施している。ある日、共有ディスクの使用量が上限に達し、組織の業務に支障が出る事象が発生した。この事象への対応を、インシデント管理、問題管理、サービスマネジメントシステムの改善に分けて考えるとき、サービスマネジメントシステムの改善として、適切なものだけを全て挙げたものはどれか。\n\na 共有ディスクの使用量が大きいファイルを調べ、当面の業務に使用しないものを一時的に別のストレージに移動する。\nb 共有ディスクの使用量が上限に達した原因を特定し、再発防止策を検討する。\nc 共有ディスクの使用量をタイムリーに把握し、容量不足の兆候を早期に検知できるようにする。\nd すぐに共有ディスクの増設の手続を進める。","opts":["a, d","b, d","c","c, d"],"ans":2,"why":"cだけが『月次チェックという仕組み自体を、タイムリー検知の仕組みに変える』という管理プロセスの底上げ＝サービスマネジメントシステムの改善にあたる。","wrong":"aとdは今この場を凌ぐ応急処置＝インシデント管理。bは原因特定と再発防止＝問題管理。3分類のどれに当たるかを一つずつ仕分ける問題で、cだけが『仕組みそのものを変える』話。","tip":"3階層で仕分ける：今すぐ直す＝インシデント管理／原因を潰す＝問題管理／管理の仕組み自体を良くする＝SMS改善。『〜できるようにする』という仕組み化の語尾がSMS改善の目印。","year":"r8"},{"id":49,"cat":"management","sub":"プロジェクトマネジメント","prompt":"システム開発プロジェクトで開催するプロジェクト会議に関する記述のうち、最も適切なものはどれか。","opts":["会議で決まった内容を周知徹底するために、議事録を作成して必要な関係者と共有する。","議論が中途半端にならないように、会議の終了時刻は決めずに実施する。","効率よくシステム開発プロジェクトを遂行するために、全ての会議にステークホルダ全員が常に参加する。","様々な内容を会議で議論できるように、会議の開始直後に会議の議題を参加メンバーから募って確定する。"],"ans":0,"why":"決定事項を議事録化し、必要な関係者に共有するのは会議運営の基本中の基本。認識齟齬と言った言わないを防ぐ。","wrong":"イは終了時刻未定で参加者の時間を拘束し非効率。ウは全員参加で工数の無駄（必要な人だけ呼ぶのが正解）。エは議題を事前共有しないため準備ができず非効率。","tip":"会議運営の問題は『事前に議題、時間厳守、必要な人だけ、記録を残す』の4原則で判定。この4つに反する選択肢は全て不適切。","year":"r8"},{"id":50,"cat":"management","sub":"プロジェクトマネジメント","prompt":"次の表の作業を3名で実施するとき、全ての作業を終わらせるのに必要な最短の日数は何日か。ここで、複数要員が必要な作業は全員がそろわないと着手できず、指定された要員数以上の要員を充てても所要日数は短縮できない。また、着手した作業は作業が完了するまで中断できないものとする。\n\n作業名 前提作業 要員数 所要日数\n　A　　　-　　　1名　　3日\n　B　　　A　　　2名　　3日\n　C　　　A　　　2名　　3日\n　D　　　B　　　1名　　3日\n　E　　　C　　　2名　　3日\n　F　　 D,E　　 1名　　3日","opts":["9日","12日","15日","18日"],"ans":2,"why":"要員が3名しかいないのが最大の制約。BとCは各2名必要で計4名となり同時実行不可。A(3日)→B(3日)→この後Cを開始し、同時にDを走らせる(2名+1名=3名で成立、3日)→E(3日)→F(3日)＝合計15日。","wrong":"ア9日・イ12日は要員制約を無視して作業順序だけで計算した場合の答え。この問題の本質は『クリティカルパス』ではなく『リソース制約』にある点が引っかけ。","tip":"要員数が明記されている日程問題は、必ず『同時に何人必要か』を各時点で足し算して検算する。合計が要員数を超えたら、その並行実行は不可能。","year":"r8"},{"id":51,"cat":"management","sub":"システム監査","prompt":"システム監査において、各部署の外部媒体の管理状況について調査することにした。システム監査を、監査計画、予備調査、本調査、評価・結論のプロセスに分けて実施するとき、収集した結果に基づき、外部媒体の管理状況についての監査意見を検討するプロセスはどれか。","opts":["監査計画","予備調査","本調査","評価・結論"],"ans":3,"why":"監査の4フェーズは『計画→予備調査（下調べ）→本調査（証拠収集）→評価・結論（意見形成）』。集めた証拠をもとに意見を組み立てるのは最後の評価・結論フェーズ。","wrong":"ウの本調査は『収集する』段階であって『検討する』段階ではない。問題文の『収集した結果に基づき』という過去形が、既に本調査が終わっていることを示している。","tip":"『集める＝本調査』『判断する＝評価・結論』で二分する。問題文の動詞が『収集する』か『検討・判断する』かで即決できる。","year":"r8"},{"id":52,"cat":"management","sub":"開発技術","prompt":"業務システムの開発において、開発者がシステム要件定義を実施する場合、利用者の関わり方として、最も適切なものはどれか。","opts":["開発者が行うシステム要件のレビューに参加し、妥当性を確認する。","開発者に全て任せ、その決定に従う。","システムの保守が可能かどうかを見極める。","システム要件の技術的な実現性を検証する。"],"ans":0,"why":"要件が業務実態に合っているかを判断できるのは利用者だけ。レビューに参加して妥当性を確認するのが利用者の最重要の役割。","wrong":"イは丸投げで、後から『こんなはずじゃなかった』となる典型。ウ保守可能性とエ技術的実現性は、いずれも開発者側が担うべき技術的判断で、利用者の役割ではない。","tip":"役割分担の切り分け：『業務として正しいか』＝利用者、『技術として作れるか』＝開発者。ここでも『全て任せる』は即アウトのルールが効く。","year":"r8"},{"id":53,"cat":"management","sub":"サービスマネジメント","prompt":"SLAの計画立案、サービス内容の交渉、草案作成、合意、導入、測定などの活動を行うものはどれか。","opts":["アウトソーシング","サービスレベル管理","サービスレベル契約","リエンジニアリング"],"ans":1,"why":"SLM（サービスレベル管理）は、SLAを作り・合意し・運用し・測定し・改善するという一連のマネジメント活動そのもの。","wrong":"ウのサービスレベル契約＝SLAは『文書』であって『活動』ではない。ここが最大の引っかけ。問題文が『〜などの活動を行うもの』と聞いている以上、答えは管理プロセス側。","tip":"A＝Agreement（合意文書）、M＝Management（管理活動）。『紙か、動きか』で判別する。SLAを回すPDCAがSLM、と覚える。","year":"r8"},{"id":54,"cat":"management","sub":"サービスマネジメント","prompt":"ある組織では過去には全員出社して業務を遂行していたが、現在は出社とテレワークの両方を使い分けて業務を遂行している。この組織において、ファシリティマネジメントの観点で改善を図っている事例として、適切なものだけを全て挙げたものはどれか。\n\na 従業員のPCにインストールされたWeb会議用のソフトウェアを常に最新にし、Web会議における利便性及びセキュリティを向上させる。\nb 執務室のレイアウト変更や大画面のTV会議室の設置を行い、従業員間のコミュニケーションを取りやすくする。\nc 出社率を踏まえてフリーアドレスエリアの割合を増加させ、オフィスを縮小させる。\nd 短時間勤務や自宅外での業務を可能とする制度を導入し、様々な従業員が業務に参画しやすくする。","opts":["a, d","b","b, c","b, d"],"ans":2,"why":"ファシリティ（facility）＝施設・設備。bは執務室と会議室という物理空間の改善、cはオフィス面積の最適化で、どちらも建物・空間のマネジメント。","wrong":"aはソフトウェアの更新でIT運用管理の領域。dは勤務制度の話で人事・労務の領域。どちらも『建物・設備』ではないので対象外。","tip":"ファシリティ＝『不動産と設備』。判定は単純に『それ、建物の中の物理的な何かか？』。ソフトも制度もファシリティではない。","year":"r8"},{"id":55,"cat":"technology","sub":"セキュリティ","prompt":"IoTのセキュリティに関する次の記述中のa、bに入れる字句の適切な組合せはどれか。\n\nネットワークカメラの画像を盗み見される脅威のうち、ネットワークカメラへの[ a ]対策として、第三者がカメラにアクセスして映像を閲覧できないようにするためには、[ b ]で利用しない。","opts":["a:DDoS攻撃 / b:初期パスワード","a:DDoS攻撃 / b:有線回線","a:不正侵入 / b:初期パスワード","a:不正侵入 / b:有線回線"],"ans":2,"why":"『第三者がアクセスして映像を閲覧する』＝不正侵入。その最大の原因が工場出荷時の初期パスワードのまま使うこと。IoT機器乗っ取り事件の定番パターン。","wrong":"DDoS攻撃はサービスを止める攻撃であって、映像を盗み見る攻撃ではない。有線回線の利用はむしろセキュリティ的に有利で、『利用しない』対象にはならない。","tip":"IoTセキュリティの三大原則：①初期パスワードを変える ②ファームウェアを更新する ③不要なポートを閉じる。この3つで9割の問題が解ける。","year":"r8"},{"id":56,"cat":"technology","sub":"データベース","prompt":"DBMSにおけるチェックポイントの説明として、適切なものはどれか。","opts":["トランザクションが正常に処理されたときに、トランザクションの一連の処理を確定させること","トランザクションが何らかの理由で正常に処理されなかったときに、データベースをトランザクションの処理開始前の状態に戻すこと","複数のトランザクションを並列に処理しているときに、ロックの影響によってトランザクション同士が互いに相手のロックの解放を待つ状態になること","複数のトランザクションによるメモリ上のデータ更新の結果を、一度にまとめてHDDなどの外部記憶装置に書き込む操作や、操作が行われた時点のこと"],"ans":3,"why":"チェックポイントは、メモリ上（バッファ）の更新内容をまとめてディスクに書き出す操作、およびその時点のこと。障害時はこの地点まで戻れば復旧が速い。","wrong":"アはコミット、イはロールバック、ウはデッドロック。DB用語4連発を1問に詰め込んだ問題なので、それぞれの定義を切り分けられれば確実に取れる。","tip":"ゲームのセーブポイントと同じ。ここまでは確実にディスクに保存済み、という復旧の起点。コミット（確定）・ロールバック（巻き戻し）・デッドロック（にらみ合い）と4点セットで暗記。","year":"r8"},{"id":57,"cat":"technology","sub":"データベース","prompt":"関係データベースで管理している\"学生\"表、\"科目\"表、\"成績\"表がある。1人の学生は複数の科目を履修するものとし、\"学生\"表に登録されていない学生や、\"科目\"表に登録されていない科目は\"成績\"表に登録できないものとするとき、外部キーとして設定するのが適切なものはどれか。\n\n学生（学生番号[主]、学生名）\n科目（科目コード[主]、科目名）\n成績（学生番号、科目コード、成績）","opts":["\"学生\"表の学生番号、\"成績\"表の学生番号","\"学生\"表の学生名、\"科目\"表の科目名","\"成績\"表の学生番号と科目コード","\"成績\"表の成績"],"ans":2,"why":"外部キーは『参照する側（子）』に設定する。成績表の学生番号は学生表の主キーを、科目コードは科目表の主キーを参照するので、この2つが外部キー。","wrong":"アは学生表の学生番号を含んでいるが、これは参照される側の主キーであって外部キーではない。『参照する側だけ』が外部キーという原則を外すとアを選んでしまう。","tip":"矢印の向きで覚える：子表 →（参照）→ 親表の主キー。矢印の根元（子側）に付くのが外部キー。参照整合性制約＝『親にいない子は登録できない』。","year":"r8"},{"id":58,"cat":"technology","sub":"UI/UX","prompt":"UXデザインで用いられることがある構造化シナリオ法における、三つのシナリオはどれか。","opts":["アクティビティ、インタラクション、バリュー","アクティビティ、インタラクション、ペルソナ","アクティビティ、バリュー、ペルソナ","インタラクション、バリュー、ペルソナ"],"ans":0,"why":"構造化シナリオ法は抽象度の高い順に『バリューシナリオ（価値）→アクティビティシナリオ（行動）→インタラクションシナリオ（操作）』の3段階でユーザー体験を具体化していく手法。","wrong":"ペルソナは架空のユーザー像を作る別の手法で、3つのシナリオには含まれない。イ・ウ・エは全てペルソナを含んでおり誤り。ペルソナを外せば一発で正解が絞れる。","tip":"『なぜ（価値）→なにを（行動）→どうやって（操作）』と降りていく3段階。ペルソナは登場人物、シナリオは物語。役者と脚本を混ぜないのがコツ。","year":"r8"},{"id":59,"cat":"technology","sub":"ネットワーク","prompt":"無線LANで使用するWPA2の機能として、適切なものはどれか。","opts":["2本のアンテナを用いることによってデータの送受信を高速化する。","アクセスポイントをステルス化する。","通信データを暗号化する。","登録されたMACアドレスをもつ機器以外からのアクセスを拒否する。"],"ans":2,"why":"WPA2＝Wi-Fi Protected Access 2。無線区間の通信データを暗号化するセキュリティ規格（AES/CCMPを使用）。","wrong":"アはMIMOなどの高速化技術。イはSSIDステルス（隠蔽）。エはMACアドレスフィルタリング。イとエは無線LANのセキュリティ機能ではあるが暗号化ではない、という点が引っかけ。","tip":"無線LANセキュリティ3点セットの役割分担：WPA2/WPA3＝暗号化（本命）、SSIDステルス＝存在を隠す（気休め）、MACフィルタ＝端末を限定（偽装可能）。暗号化と聞かれたらWPA一択。","year":"r8"},{"id":60,"cat":"technology","sub":"UI/UX","prompt":"レスポンシブWebデザインに関する記述として、適切なものはどれか。","opts":["PC、スマートフォンなど、多くの種類の端末で、見やすく、かつ操作しやすくなるように、表示する端末の画面サイズなどに応じてWebサイトの画面レイアウトが変化する。","Webブラウザで動画コンテンツをストリーミング再生するとき、サーバやネットワークの負荷が軽減されるように、複数のコンテンツ配信サーバのうち、利用者に適したサーバに接続させてデータを取得する。","スマートフォンなどの端末向けのWebアプリケーションにおいて、歩数や移動速度などを計測できるように、端末に内蔵された加速度センサーやジャイロセンサーのデータを使用する。","操作説明書を読まなくてもWebサイトの使用方法を理解できるように、Webブラウザの利用者がマウスポインタをWebコンテンツに重ねたとき、ポップアップを用いて機能の説明、対象の状態などを表示する。"],"ans":0,"why":"レスポンシブ（responsive＝反応する）Webデザイン。画面サイズという環境に『反応して』レイアウトが可変する設計手法。","wrong":"イはCDN（コンテンツデリバリネットワーク）。ウはデバイスセンサーの活用。エはツールチップ。いずれも画面サイズへの適応とは無関係。","tip":"responsive＝反応がいい。何に反応するかといえば画面幅。スマホで見ると1カラムに折り返されるアレ。CSSのメディアクエリで実装する、まで覚えると盤石。","year":"r8"},{"id":61,"cat":"technology","sub":"コンピュータ構成","prompt":"PCの画面表示に必要なデータを保持するのに使われる、画面表示専用メモリはどれか。","opts":["EEPROM","VRAM","キャッシュメモリ","フラッシュメモリ"],"ans":1,"why":"VRAM＝Video RAM。ディスプレイに表示する画像データを一時的に保持する専用メモリ。解像度と色数が上がるほど大容量が必要になる。","wrong":"アEEPROMは電気的に書き換え可能なROM。ウキャッシュメモリはCPUと主記憶の速度差を埋める高速メモリ。エフラッシュメモリはSSDやUSBメモリに使う不揮発性メモリ。","tip":"頭にVが付いたらVideo。GPUに載っているのがVRAM。『専用メモリ』という語が出たら用途を表す接頭辞（V＝映像）を探すのが最速。","year":"r8"},{"id":62,"cat":"technology","sub":"システム構成","prompt":"システムの性能評価におけるベンチマークテストに関する記述として、適切なものはどれか。","opts":["評価対象のシステムで使われるものと同じデータ、同じプログラムを、ほかの疑似システム上で実行させて性能を評価する。","評価対象のシステムの動作特性を、取扱いの容易な形にモデル化したものを用いて、ほかの疑似システム上で実行させて性能を評価する。","評価対象のシステムのプログラムステップ数、ハードウェア性能、I/O回数の机上計算値などを基に処理時間を積算して性能を評価する。","標準的な処理を設定し、それを実行する評価用プログラムを、評価対象のシステム上で実際に実行させて性能を評価する。"],"ans":3,"why":"ベンチマークテストは『評価用プログラムを、評価対象システムの上で、実際に動かして』性能を測る手法。実測であることと、対象システム上で行うことの両方が要件。","wrong":"アとイは『ほかの疑似システム上』で実行しており、評価対象そのものを測っていない（シミュレーション）。ウは実行せず机上計算しているだけ。","tip":"benchmark＝基準となる目印。実際に走らせて出したタイムだから信頼できる。『実際に』『対象システム上で』の2語が揃っているかで判定する。","year":"r8"},{"id":63,"cat":"technology","sub":"セキュリティ","prompt":"PCに保存されたファイルを使用できなくするランサムウェアによる被害を低減させるための対策として、適切なものはどれか。","opts":["UPSの導入","データの暗号化","データのバックアップ","ログインパスワードの変更"],"ans":2,"why":"ランサムウェアはファイルを暗号化して人質に取る。バックアップさえ手元にあれば身代金を払わずに復元でき、被害を最小化できる。","wrong":"イのデータの暗号化は情報漏えい対策であって、ランサムウェア対策にはならない（自分で暗号化していても、攻撃者はその上からさらに暗号化する）。ここが最大の引っかけ。アUPSは停電対策。","tip":"ランサムウェア対策の本命はバックアップ一択。しかも『3-2-1ルール（3世代・2媒体・1つはオフライン）』が肝。ネットにつながったバックアップは一緒に暗号化されるので注意。","year":"r8"},{"id":64,"cat":"technology","sub":"ネットワーク","prompt":"キャリアアグリゲーションの説明として、適切なものはどれか。","opts":["移動中に携帯電話が接続する基地局を切り替える技術","携帯電話の通信のセキュリティ機能を高める技術","複数の異なる周波数の電波を束ねることによって、無線通信を高速化する技術","無線LANにおいて、アクセスポイントと呼ばれる基地局を経由して端末同士が通信を行う技術"],"ans":2,"why":"キャリア＝搬送波（周波数帯）、アグリゲーション＝集約。複数の周波数帯を束ねて1本の太い回線として使い、通信を高速化する技術。LTE-Advanced以降の標準機能。","wrong":"アはハンドオーバー。エはインフラストラクチャモード（無線LANの接続形態）。通信系用語の混同を狙った出題。","tip":"aggregation＝集約・束ねる。ネットワークでは『リンクアグリゲーション』も同じ発想で、複数のLANケーブルを束ねて帯域を増やす。束ねる＝速くなる、で統一。","year":"r8"},{"id":65,"cat":"technology","sub":"ネットワーク","prompt":"DNSサーバの役割に関する記述として、適切なものはどれか。","opts":["LAN上のPCからインターネット上のWebサーバへのリクエストを中継するものであり、PCの代理としてインターネット上のWebサーバへアクセスして、その応答をPCに返す。","PCからサーバへのファイルの送受信の要求を受け付け、ファイルを転送する。","PCに対してIPアドレスを自動で割り当て、サブネットマスクとデフォルトゲートウェイのIPアドレスの通知を行う。","ドメイン名をIPアドレスに変換する、又はIPアドレスをドメイン名に変換する。"],"ans":3,"why":"DNS＝Domain Name System。人間が読める名前（www.example.com）と機械が使うIPアドレス（192.0.2.1）を相互変換する電話帳の役割。","wrong":"アはプロキシサーバ。イはFTPサーバ。ウはDHCPサーバ。サーバ4種を1問に並べた構成で、それぞれの役割を切り分ければ確実に取れる。","tip":"サーバの役割対応表：DNS＝名前解決、DHCP＝IPアドレス配布、プロキシ＝代理アクセス、FTP＝ファイル転送。DNSとDHCPは頭文字が似ているので特に注意。","year":"r8"},{"id":66,"cat":"technology","sub":"ソフトウェア","prompt":"アプリケーションソフトウェアの操作を行うとき、質問に答えていく対話形式によって、煩雑な操作を簡単に行えるようにする機能はどれか。","opts":["アーカイブ","ウィザード","オートコンプリート","ポップアップウィンドウ"],"ans":1,"why":"ウィザード（wizard＝魔法使い）。次へ、次へ、と質問に答えるだけで複雑な設定が完了する対話型のガイド機能。","wrong":"アは複数ファイルの書庫化。ウは入力途中で候補を補完する機能。エは別ウィンドウの表示。『対話形式で手順を導く』のはウィザードだけ。","tip":"インストーラの『次へ＞』を連打するアレ。魔法使いが手を引いてくれるイメージ。オートコンプリート（入力補完）との区別は『手順を進めるか、文字を埋めるか』。","year":"r8"},{"id":67,"cat":"technology","sub":"アルゴリズム","prompt":"手続sortは、要素数が2以上の整数型の配列を引数numberArrayで受け取り、その要素を昇順に並べ替えた結果を出力する（選択ソート）。配列numberArrayを{3, 5, 1, 2, 4}とし、jの値が3と出力された直後のworkArrayの全ての要素の出力はどれか。ここで、配列の要素番号は1から始まる。\n\n※内側ループでj番目以降の最小値の位置minIndexを探し、workArray[j]とworkArray[minIndex]を入れ替えた後にjとworkArrayを出力する。","opts":["1, 2, 3, 4, 5","1, 2, 3, 5, 4","4, 5, 3, 2, 1","5, 4, 3, 2, 1"],"ans":1,"why":"初期{3,5,1,2,4}。j=1：2〜5番目含め最小は1（3番目）→1と3を交換し{1,5,3,2,4}。j=2：2番目以降の最小は2（4番目）→5と2を交換し{1,2,3,5,4}。j=3：3番目以降{3,5,4}の最小は3（自分自身）→交換なしで{1,2,3,5,4}。","wrong":"ア{1,2,3,4,5}は最後まで完走した結果（j=4まで進んだ状態）。j=3の直後という『途中経過』を問われている点を見落とすとアを選ぶ。","tip":"トレース問題は必ず紙に配列を1行ずつ書く。選択ソートは『j番目以降で最小を探して、j番目と交換』の一点だけ。左からじわじわ確定していくので、j回目終了時点で左j個が確定している、と覚えると検算が速い。","year":"r8"},{"id":68,"cat":"technology","sub":"ネットワーク","prompt":"メールソフトが電子メールの送受信に用いるプロトコルの組合せとして、適切なものはどれか。","opts":["送信:IMAP4 / 受信:POP3","送信:IMAP4 / 受信:SMTP","送信:POP3 / 受信:SMTP","送信:SMTP / 受信:IMAP4"],"ans":3,"why":"送信はSMTP（Simple Mail Transfer Protocol）の一択。受信はPOP3かIMAP4のどちらか。よって『SMTP／IMAP4』の組合せが正しい。","wrong":"ア・イ・ウはいずれも送信側にSMTP以外が入っているか、受信側にSMTPが来ている。送信＝SMTPさえ固定できれば、消去法で一発で決まる。","tip":"『送るのはSMTP、受けるのはPOPかIMAP』。SMTPのSはSend（送る）と語呂で結びつけると迷わない。POP3＝端末にダウンロード、IMAP4＝サーバに置いたまま参照、の違いも頻出。","year":"r8"},{"id":69,"cat":"technology","sub":"データベース","prompt":"関係データベースにおけるデータの正規化に関する次の記述中のa、bに入れる字句の適切な組合せはどれか。\n\n正規化の主な目的として、データの重複を排除し、[ a ]ことが挙げられる。正規化には複数の段階があり、これを進めていくと、[ b ]。","opts":["a:圧縮率を向上させる / b:一つの表が複数の表に分割される","a:圧縮率を向上させる / b:複数の表が一つの表に統合される","a:一貫性を保つ / b:一つの表が複数の表に分割される","a:一貫性を保つ / b:複数の表が一つの表に統合される"],"ans":2,"why":"正規化の目的はデータの重複排除による『一貫性（整合性）の維持』。そして正規化を進めると、1つの大きな表が関連ごとに複数の表へ分割されていく。","wrong":"『圧縮率の向上』は正規化の目的ではない（結果的に容量が減ることはあるが目的ではない）。また分割と統合を逆にした選択肢に注意。正規化＝分割、非正規化＝統合。","tip":"正規化は『表を割っていく』作業。第1正規形（繰り返しを排除）→第2（部分関数従属を排除）→第3（推移的関数従属を排除）と進むたび表が増える。逆に検索速度を優先してあえて統合するのが非正規化。","year":"r8"},{"id":70,"cat":"technology","sub":"セキュリティ","prompt":"ISMSにおける情報セキュリティインシデントの管理に関する記述のうち、適切なものはどれか。","opts":["情報セキュリティインシデントには臨機応変な対応が求められるので、あらかじめ対応手順を文書化しておくのではなく、実際の対応内容を記録する。","情報セキュリティインシデントから得られた知識は、模倣を防ぐために情報セキュリティの管理策の強化には用いない。","情報セキュリティ事象は、その評価を待つことなく、報告された時点で情報セキュリティインシデントに分類される。","情報セキュリティ事象は、適切な管理者へ速やかに報告するために、あらかじめその連絡経路と仕組みを用意しておく。"],"ans":3,"why":"インシデント対応は事前準備が命。誰に、どう報告するかの連絡経路（エスカレーションルート）を平時に決めておくのが基本。","wrong":"アは『手順を文書化しない』が誤り（手順書は必須）。イは『教訓を活かさない』が誤りで、PDCAのAct（改善）を否定している。ウは事象（event）と事件（incident）を評価せずに同一視しており誤り。","tip":"セキュリティ管理の問題は『事前に決めておく』『記録する』『改善に活かす』が正解、『その場で考える』『活かさない』は誤り、という一貫したルールで解ける。事象→評価→インシデント、の順序も押さえる。","year":"r8"},{"id":71,"cat":"technology","sub":"セキュリティ","prompt":"インターネットバンキングなどのWebサイトで利用されているリスクベース認証の例として、適切なものはどれか。","opts":["利用者がいつもログインに使っているPCとは異なるPCからのログインであったので、本人しか知らない秘密の質問による追加の認証を行った。","利用者がログインした後、画面操作が一定時間なかったので、自動的にログアウトして、再度ログインを求めた。","利用者がログインするときにパスワードを連続して複数回違って入力したので、アカウントをロックした。","利用者がログインに使っているパスワードが長期間変更されていなかったので、パスワードの変更を促した。"],"ans":0,"why":"リスクベース認証＝普段と違う状況（端末・場所・時間帯）を検知したときだけ追加認証を要求する仕組み。利便性とセキュリティを両立させるのが狙い。","wrong":"イはセッションタイムアウト。ウはアカウントロックアウト。エはパスワード有効期限。いずれも『いつもと違うかどうか』を判定していない点で、リスクベース認証ではない。","tip":"キーワードは『いつもと違う』。普段どおりなら素通し、怪しいときだけ追加で聞く。クレカの不正利用検知と同じ発想。『異なるPC』『海外からのアクセス』の語が出たらリスクベース認証。","year":"r8"},{"id":72,"cat":"technology","sub":"データベース","prompt":"関係データベースで管理している\"口座\"表、\"顧客\"表及び\"取引明細\"表がある。新たな顧客が口座の開設と同時に1万円を入金するとき、表にデータを追加する順序として、適切なものはどれか。\n\n口座（口座番号[主]、口座種別、残高、顧客番号[外]）\n顧客（顧客番号[主]、顧客名）\n取引明細（取引番号[主]、取引日時、取引種別、取引金額、口座番号[外]）","opts":["口座 → 顧客 → 取引明細","顧客 → 口座 → 取引明細","顧客 → 取引明細 → 口座","取引明細 → 口座 → 顧客"],"ans":1,"why":"参照整合性制約により、外部キーの参照先（親）が先に存在していないと子は登録できない。口座は顧客番号を参照するので顧客が先、取引明細は口座番号を参照するので口座が先。よって顧客→口座→取引明細。","wrong":"アは口座を先に入れようとするが、参照先の顧客がまだ存在せずエラーになる。エは完全に逆順。矢印をたどって『参照される側から順に』並べるのが鉄則。","tip":"『親が先、子が後』。外部キーの矢印の先（参照される側）が親。削除するときはこの逆順（子から消す）になる、まで対で覚えると応用が効く。","year":"r8"},{"id":73,"cat":"technology","sub":"法務・OSS","prompt":"OSS（Open Source Software）のライセンスにおけるコピーレフトに関する記述として、適切なものはどれか。","opts":["OSSの作成者が、ソフトウェアの著作権を放棄している。","OSSの著作権者は、利用者がソフトウェアを利用することに対して金銭的な対価を要求しなければならない。","OSSの利用者が改変して作成した派生ソフトウェアは、改変部分のソースコードを非公開としたまま、配布することができる。","OSSの利用者が改変して作成した派生ソフトウェアを配布する場合には、元のOSSのライセンスと同じライセンスを適用しなければならない。"],"ans":3,"why":"コピーレフト＝派生物にも同じ自由（同じライセンス）を継承させる考え方。GPLが代表例で、改変して配布するならソースも同じライセンスで公開する義務がある。","wrong":"アは著作権放棄ではない（著作権は保持したうえで利用を許諾する）。イは対価要求の義務はない。ウは非公開配布を認める記述でコピーレフトの真逆。","tip":"コピーライト（©著作権＝囲い込む）に対する言葉遊びでコピーレフト（自由を伝染させる）。『同じライセンスを引き継がせる』のが唯一の本質。MIT/BSDはコピーレフトではない（非公開OK）。","year":"r8"},{"id":74,"cat":"technology","sub":"表計算","prompt":"表計算ソフトを用いて、二つの2進数α、βの和を求める。α、βの桁数は2桁に限定し、2の位、1の位の順に各桁の値がセルB3、セルC3とセルB4、セルC4に入力されている。ワークシートは2進数α=10、β=11の例である。結果は、4の位、2の位、1の位の順にセルA5、セルB5、セルC5に表示したい。セルB2は1の位からの繰り上がりの情報を格納するために用いられ、式 IF(C3+C4=2,1,0) が入力されている。セルB5に入力する式はどれか。","opts":["IF(合計(B2:B4) < 2, 合計(B2:B4), IF(合計(B2:B4)=2, 0, 1))","IF(合計(B2:B4) < 2, 合計(B2:B4), IF(合計(B2:B4)=2, 1, 0))","IF(合計(B2:B4) > 2, 合計(B2:B4), IF(合計(B2:B4)=2, 0, 1))","IF(合計(B2:B4) > 2, 合計(B2:B4), IF(合計(B2:B4)=2, 1, 0))"],"ans":0,"why":"B5に必要なのは『合計(B2:B4)の1の位』つまり合計を2で割った余り。合計は0〜3を取り得るので、0→0、1→1、2→0、3→1を返す式が正解。アは合計<2ならそのまま（0→0、1→1）、そうでなければ=2のとき0、それ以外（=3）は1を返し、全パターン正しい。","wrong":"イは合計=2のとき1を返してしまい誤り（2進数の2は桁上がりして0になるべき）。ウ・エは条件が『>2』のため、合計=3のときに3という無効な値をそのまま出力してしまう。","tip":"この手の問題は『取り得る値を全部書き出して総当たり』が最短。合計は0/1/2/3の4通りしかないので、各選択肢に代入して4回検算すれば確実。2進数の1桁は必ず0か1しか出ないので、3が出た時点でその式は誤り、と即断できる。","year":"r8"},{"id":75,"cat":"technology","sub":"ネットワーク","prompt":"電子メールの宛先入力におけるBcc欄に関する記述のうち、適切なものはどれか。","opts":["Bcc欄に入力したメールアドレスには、To欄やCc欄に入力したメールアドレスは通知されない。","Bcc欄に入力したメールアドレスには、自動的に暗号化された電子メールが送信される。","Bcc欄に入力したメールアドレスには、添付ファイルが削除された電子メールが送信される。","To欄やCc欄に入力したメールアドレスには、Bcc欄に入力したメールアドレスは通知されない。"],"ans":3,"why":"Bcc＝Blind Carbon Copy。『Blind＝見えない』のはBccに入れたアドレスの方。To/Ccの受信者からはBccの宛先が見えない、これが唯一の機能。","wrong":"アが最大の引っかけ。Bcc受信者からはTo/Ccは普通に見える（隠されるのはBcc自身だけ）。イ暗号化・ウ添付削除といった機能はBccには一切ない。","tip":"『隠れるのはBccの人だけ、Bccの人は全部見える』と一方向で覚える。一斉送信で他人のアドレスを漏らさないためにBccを使う、という実務目的とセットで理解すると間違えない。","year":"r8"},{"id":76,"cat":"technology","sub":"ネットワーク","prompt":"IoTデバイスで用いられるLPWAに関する次の記述中のa、bに入れる字句の適切な組合せはどれか。\n\nLPWAに分類される無線通信方式の特徴は、通信可能な範囲が無線LANに比べて[ a ]、消費する電力が第4世代移動通信規格（4G）に比べて[ b ]。","opts":["a:狭く / b:多い","a:狭く / b:少ない","a:広く / b:多い","a:広く / b:少ない"],"ans":3,"why":"LPWA＝Low Power Wide Area。名前がそのまま答え。低消費電力（Low Power）で広域（Wide Area）をカバーする。電池1本で数年動き、数km届く。","wrong":"ア・イは『狭く』で誤り（Wide Areaと矛盾）。ウは『多い』で誤り（Low Powerと矛盾）。名称を英語に開けば即座に消去できる。","tip":"通信規格は名前がスペックそのもの。LPWA＝Low Power Wide Area。トレードオフとして通信速度は非常に遅い（数kbps）が、センサーの数値を飛ばすだけなら十分、という設計思想。","year":"r8"},{"id":77,"cat":"technology","sub":"セキュリティ","prompt":"ある企業では、サーバ室への入室管理を暗証番号で行っていたが、虹彩認証装置による本人確認を加えることによって、無許可の者の入室をより確実に防止する対策とした。これは、サーバ室における情報セキュリティ要素のうち、どれを高める対策に該当するか。","opts":["可用性","完全性","機密性","否認防止"],"ans":2,"why":"無許可の者を入れない＝認可された者だけが情報資産にアクセスできる状態を守ること。これは情報セキュリティのCIAのうち機密性（Confidentiality）。","wrong":"ア可用性は『使いたいときに使える』こと。イ完全性は『改ざんされていない』こと。エ否認防止は『やっていないと言い逃れさせない』こと。入室制限はどれにも該当しない。","tip":"CIAで覚える：C＝Confidentiality（機密性・見せない）、I＝Integrity（完全性・変えさせない）、A＝Availability（可用性・止めない）。入退室管理・アクセス権・暗号化は全て機密性。","year":"r8"},{"id":78,"cat":"technology","sub":"IoT","prompt":"IoTデバイスとIoTサーバで構成され、IoTデバイスが計測した外気温をIoTサーバへ送り、IoTサーバからの指示でIoTデバイスが窓を開閉するシステムがある。このシステムのIoTデバイスに搭載された、外気温を電気信号に変換する役割をもつものはどれか。","opts":["アクチュエーター","エッジコンピューティング","キャリアアグリゲーション","センサー"],"ans":3,"why":"センサーは物理量（温度・光・圧力など）を検知して電気信号に変換する入力デバイス。『外気温を電気信号に変換』はセンサーの定義そのもの。","wrong":"アのアクチュエーターは電気信号を物理的な動きに変換する出力デバイス。この問題では『窓を開閉する』側がアクチュエーター。入力と出力のペアを問う典型的な引っかけ。","tip":"IoTの入出力ペア：センサー＝外界を測る（入力・五感）、アクチュエーター＝外界を動かす（出力・手足）。今回のように1つの問題文に両方登場するので、どちらを聞かれているか読み違えないこと。","year":"r8"},{"id":79,"cat":"strategy","sub":"セキュリティ経営","prompt":"企業のリスクマネジメントの一環として行われるサイバーセキュリティリスク対策の推進において、経営者に求められる役割として、最も適切なものはどれか。","opts":["IT部門のセキュリティ担当者に、部門ごとのサイバーセキュリティリスク対応方針の策定と実行を全て任せる。","サイバーセキュリティ対策を実施する上での責任者となるCISOを任命し、実行や判断を全て任せる。","実施方針の検討、予算や人材の割当て、実施状況の確認や問題の把握と対応を通じて自らリーダーシップを発揮する。","専門家である外部の経営コンサルタントに、自社の組織や事業におけるリスクの分析と対策の推進に関する権限と責任を委譲する。"],"ans":2,"why":"サイバーセキュリティ経営ガイドラインの大原則。セキュリティは経営課題であり、経営者自らが方針・予算・人材に関与し、リーダーシップを発揮する必要がある。","wrong":"ア・イ・エはすべて『全て任せる』『委譲する』という丸投げ。CISOを任命すること自体は正しいが、任命した上で判断まで全部投げるのが誤り。","tip":"ここでもガバナンス系の一発ルールが効く：『全て任せる』『委譲する』が含まれたら即座に切る。残ったものが答え。問35・問41と全く同じ解き方で解ける。","year":"r8"},{"id":80,"cat":"technology","sub":"セキュリティ","prompt":"バイオメトリクス認証に関する次の記述中のa、bに入れる字句の適切な組合せはどれか。\n\nバイオメトリクス認証を利用したシステムの設計を始めるときには、システムの目的と認証の用途を明らかにし、認証精度の設定方針を策定することが必要である。他人受入率が[ a ]なるように設定した場合は、安全性を重視した認証になり、本人拒否率が[ b ]なるように設定した場合は、本人の利便性を重視した認証になるといえる。","opts":["a:高く / b:高く","a:高く / b:低く","a:低く / b:高く","a:低く / b:低く"],"ans":3,"why":"他人受入率（FAR）を低く＝他人を締め出す＝安全性重視。本人拒否率（FRR）を低く＝本人がすんなり通る＝利便性重視。よって a:低く、b:低く。","wrong":"aとbは別々の指標であり、それぞれ独立に『低く設定した場合』の効果を問われている。片方を高くする選択肢はいずれも記述と矛盾する。なお実際のシステムではFARとFRRはトレードオフの関係にある。","tip":"名前を素直に読む：他人受入率＝他人を受け入れてしまう率（低いほど安全）。本人拒否率＝本人を拒否してしまう率（低いほど便利）。どちらも『低いほど良い』が、閾値を動かすと一方が下がれば他方が上がる。","year":"r8"},{"id":81,"cat":"technology","sub":"ネットワーク","prompt":"Bluetoothの規格に含まれ、デバイス間の省電力通信を実現させるものはどれか。","opts":["BLE","LPWA","LTE","PLC"],"ans":0,"why":"BLE＝Bluetooth Low Energy。Bluetooth 4.0以降に含まれる省電力仕様で、ボタン電池で数年動く。ウェアラブル端末やビーコンで使われる。","wrong":"イLPWAも省電力だがBluetoothの規格ではない（独立した広域無線）。ウLTEは携帯電話の通信規格。エPLCは電力線通信。『Bluetoothの規格に含まれ』という条件でBLE以外は全て脱落。","tip":"問題文の限定条件を先に見るのがコツ。『Bluetoothの規格に含まれ』とあるので、名前にBluetoothが入っているBLE一択。LPWAとの引っかけは、届く距離で区別（BLE＝数十m、LPWA＝数km）。","year":"r8"},{"id":82,"cat":"technology","sub":"AI","prompt":"ニューラルネットワークの学習に用いられるバックプロパゲーションで行われていることはどれか。","opts":["各ノードの重みを調整して、誤差を小さくする。","各ノードの重みを調整して、最適な活性化関数を選択する。","ノードの数を変更して、誤差を小さくする。","ノードの数を変更して、処理速度を高める。"],"ans":0,"why":"バックプロパゲーション（誤差逆伝播法）は、出力の誤差を出力層から入力層へ逆向きに伝播させながら、各ノード間の『重み』を少しずつ修正して誤差を最小化する学習アルゴリズム。","wrong":"ウ・エの『ノードの数を変更』が誤り。ネットワークの構造（ノード数・層数）は学習前に人間が決めるハイパーパラメータであり、学習中に変わるのは重みだけ。","tip":"学習＝『重みの調整』だけ、と割り切る。back（後ろへ）propagation（伝播）＝誤差を後ろ向きに流す。構造をいじるのは学習ではなくチューニング（設計）の話。","year":"r8"},{"id":83,"cat":"technology","sub":"セキュリティ","prompt":"職場のPCに適用する情報セキュリティ対策a〜cのうち、マルウェア対策ソフトの導入のほかに、マルウェア感染を防止するための対策として、適切なものだけを全て挙げたものはどれか。\n\na OSのセキュリティパッチ（修正モジュール）の適用\nb 起動ドライブとなっているハードディスクに対するパスワード設定\nc 複雑かつ十分な長さをもつログインパスワードの導入","opts":["a","a, b","b","c"],"ans":0,"why":"マルウェアの主要な侵入経路はOSやソフトの脆弱性。セキュリティパッチを当てて穴をふさぐことが、感染防止の直接的な対策になる。","wrong":"bとcはいずれもパスワードによる『不正アクセス対策』であって、マルウェア感染防止ではない。メール添付やWeb閲覧から感染する場合、パスワードの強度は何の防御にもならない。","tip":"『何から守るか』で対策を仕分ける。マルウェア感染防止＝パッチ適用・対策ソフト・不審な添付を開かない。不正アクセス防止＝強いパスワード・多要素認証。この2つの混同を狙う問題が非常に多い。","year":"r8"},{"id":84,"cat":"technology","sub":"AI","prompt":"ある推論システムは、演繹推論、帰納推論、仮説形成などの推論が実行できる。この推論システムへの入力と得られた出力に関する記述のうち、演繹推論を実行した例として、適切なものはどれか。","opts":["\"HDDとSSDは記憶装置である\"と入力した後に、\"HDDの台数を増やすと記憶容量が増える\"と入力した。出力は、\"SSDの台数を増やすと記憶容量が増える\"となった。","\"HDDは台数を増やすと記憶容量が増える\"と入力した後に、\"記憶装置は台数を増やすと記憶容量が増える\"と入力した。出力は、\"HDDは記憶装置である\"となった。","\"記憶装置であるHDDは記憶容量をもつ\"と入力し、同時に\"記憶装置であるSSDは記憶容量をもつ\"と入力した。出力は、\"全ての記憶装置は記憶容量をもつ\"となった。","\"全ての記憶装置は記憶容量をもつ\"と入力した後に、\"HDDは記憶装置である\"と入力した。出力は、\"HDDは記憶容量をもつ\"となった。"],"ans":3,"why":"演繹推論は『一般的な法則→個別の結論』。エは「全ての記憶装置は容量をもつ（大前提）」＋「HDDは記憶装置（小前提）」→「HDDは容量をもつ（結論）」という三段論法そのもの。","wrong":"ウは個別事例（HDD、SSD）から一般法則を導いており帰納推論。イは結果から前提を推定する仮説形成（アブダクション）。アは類推に近い。3種類の推論を1問に詰め込んだ構成。","tip":"矢印の向きで判定：一般→個別が演繹（Deduction、確実）、個別→一般が帰納（Induction、確からしい）。ソクラテスの三段論法（人は死ぬ／ソクラテスは人／ゆえに死ぬ）が演繹の原型。","year":"r8"},{"id":85,"cat":"technology","sub":"アルゴリズム","prompt":"関数isPrimeは、引数として与えられた正の整数が、素数であればtrueを、素数でなければfalseを戻り値とする。プログラム中のa、bに入れる字句の適切な組合せはどれか。\n\n○論理型: isPrime(整数型: num)\n　整数型: div ← 2\n　if (num が 2 [ a ])\n　　return false\n　else\n　　while (num が div [ b ])\n　　　if (num ÷ div の余り が 0 と等しい)\n　　　　return false\n　　　else\n　　　　div ← div + 1\n　　　endif\n　　endwhile\n　　return true\n　endif","opts":["a:以下 / b:と等しい","a:以下 / b:より大きい","a:より小さい / b:と等しい","a:より小さい / b:より大きい"],"ans":3,"why":"素数の最小値は2なので、2未満（num<2）ならfalseを返すのが正しい。次にwhile条件は『num > div』の間、divで割り切れるか試す。num=2なら2>2が偽でループに入らずtrueを返し、正しく素数と判定できる。","wrong":"aを『以下』にすると num=2 のとき2≦2が真となりfalseになり、素数である2を誤判定する。bを『と等しい』にすると割り算の試行がまともに回らない。num=2で検算するのが最速の判別法。","tip":"擬似言語の穴埋めは『境界値を1つ代入して検算』が鉄則。この問題ならnum=2（最小の素数）を入れれば、aが即座に決まる。あとは残った選択肢を見れば消去法で終わる。全パターン追う必要はない。","year":"r8"},{"id":86,"cat":"technology","sub":"システム構成","prompt":"データベースの障害に備えて、毎日業務終了後にバックアップファイルを取得している。毎週土曜日にはフルバックアップファイルを取得し、日曜日から金曜日は差分バックアップファイルを取得する。差分バックアップファイルとは、最後のフルバックアップファイルから、差分バックアップファイルを取得する当日までの、全ての差分データのバックアップファイルである。水曜日にデータベースが破損したので、前日の火曜日の業務終了時点のデータベースに復旧することにした。このとき、データベースを復旧させるために最低限必要なバックアップファイルはどれか。","opts":["日曜日、月曜日及び火曜日の差分バックアップファイル","火曜日の差分バックアップファイル","土曜日のフルバックアップファイルと、日曜日、月曜日及び火曜日の差分バックアップファイル","土曜日のフルバックアップファイルと、火曜日の差分バックアップファイル"],"ans":3,"why":"差分バックアップは『最後のフルバックアップからの累積』。つまり火曜日の差分ファイルには日曜〜火曜の変更が全て含まれる。よって土曜のフル＋火曜の差分の2つだけで復旧できる。","wrong":"ウは日・月の差分まで持ってきているが、火曜の差分に全部含まれるので冗長（『最低限』の条件に反する）。ア・イはフルバックアップがなく、そもそも復元の土台がない。","tip":"差分と増分の違いが全て。差分（Differential）＝毎回フルからの累積なので復元はフル＋最新の1つ。増分（Incremental）＝前回からの変化分だけなのでフル＋間の全部が必要。『差分＝2個で済む、増分＝全部要る』で暗記。","year":"r8"},{"id":87,"cat":"technology","sub":"システム構成","prompt":"NASの説明として、適切なものはどれか。","opts":["PCやスマートフォンなどからネットワーク経由で利用できるように、ネットワークに直接接続して使用する外部記憶装置","記憶媒体上のデータの位置や書込み順序に関係なく、求めるデータに直接アクセスできるファイル形式","複数の記憶装置を1台の装置として管理し、データを分散して格納することによってアクセスの高速化や耐障害性の向上を図る技術","無線LANのネットワークを識別するために用いられる文字列"],"ans":0,"why":"NAS＝Network Attached Storage。ネットワークに直接つながる外付けストレージ。家庭や小規模オフィスの共有ファイルサーバとして使われる。","wrong":"イはランダムアクセス（直接編成ファイル）。ウはRAID。エはSSID。ウのRAIDとの区別が最頻出で、NASは『置き場所（ネット上）』、RAIDは『複数台を束ねる技術』と観点が違う。","tip":"Network Attached Storage＝ネットワークに貼り付いたストレージ。対義語はDAS（Direct Attached Storage＝PCに直結）。RAIDはNASの中でも使われる別レイヤの技術。","year":"r8"},{"id":88,"cat":"technology","sub":"アルゴリズム","prompt":"プログラミングすることによって、ペンの上げ下げ、直進及び右回りの方向転換が可能なロボットがある。このロボットに1辺が1mの正六角形を描画させるプログラムを作成した。次の正六角形描画プログラムのa、bに入れる字句の適切な組合せはどれか。\n\n(1) ペンを下ろす。\n(2) 処理回数のカウンタに [ a ] を設定する。\n(3) 次の処理を順に実行する。\n　・1m直進する。\n　・右回りに [ b ] 度方向転換する。\n　・処理回数のカウンタに1を加える。\n(4) 処理回数のカウンタが6未満の場合は、(3)に戻る。\n(5) ペンを上げる。","opts":["a:0 / b:60","a:0 / b:120","a:1 / b:60","a:1 / b:120"],"ans":0,"why":"カウンタを0から始めると、0→1→2→3→4→5と加算され6になった時点で(4)の『6未満』を満たさず終了。ちょうど6回描画される。方向転換は外角で、360度÷6＝60度。","wrong":"aを1にすると1〜5の5回しか回らず、正六角形にならない（五角形になる）。bの120度は内角の値で、ここが最大の引っかけ。ロボットが曲がる角度は内角ではなく外角。","tip":"多角形描画プログラムの鉄則：曲がる角度＝360÷辺の数（外角）。正三角形なら120度、正方形なら90度、正六角形なら60度。内角（正六角形なら120度）と混同させるのが定番の罠。","year":"r8"},{"id":89,"cat":"technology","sub":"セキュリティ","prompt":"情報セキュリティに関する次の記述中のa、bに入れる字句の適切な組合せはどれか。\n\n守るべき情報資産に対して望ましくない影響を及ぼす可能性のある原因のことを[ a ]といい、情報資産自身の価値を損なう可能性をもつ弱点のことを[ b ]という。","opts":["a:インシデント / b:リスク","a:脅威 / b:脆弱性","a:脆弱性 / b:インシデント","a:リスク / b:脅威"],"ans":1,"why":"脅威（Threat）＝損害を与える外的な原因（攻撃者、災害、故障など）。脆弱性（Vulnerability）＝それを許してしまう内側の弱点（設定不備、パッチ未適用など）。","wrong":"リスクは『脅威×脆弱性』で算出される、損害が起きる可能性そのもの。インシデントは実際に起きてしまった事件。原因（脅威）と弱点（脆弱性）と可能性（リスク）と発生（インシデント）を混同させる問題。","tip":"泥棒で例えると：脅威＝泥棒、脆弱性＝鍵の壊れた窓、リスク＝盗まれる可能性、インシデント＝実際に盗まれた事件。『外からの力が脅威、自分の弱さが脆弱性』。","year":"r8"},{"id":90,"cat":"technology","sub":"セキュリティ","prompt":"PKI（公開鍵基盤）の特徴として、適切なものはどれか。","opts":["共通鍵の所有者を確認する方法が提供されている。","知人が署名した鍵は信頼するという\"信頼の輪\"によって、公開鍵が正当であることを確認する。","電子証明書の正当性を認証局が保証する。","秘密鍵を安全に公開する方法が提供されている。"],"ans":2,"why":"PKIの中核は認証局（CA）。第三者機関であるCAが電子証明書に署名し、『この公開鍵は確かに本人のものだ』と保証する階層型の信頼モデル。","wrong":"イの『信頼の輪』はPGPが採用する分散型モデルで、PKIとは対照的な仕組み。エは『秘密鍵を公開』という時点で自己矛盾（秘密鍵は絶対に公開しない）。","tip":"PKI＝ピラミッド型（CAが頂点で保証）、PGP＝横のつながり型（知人同士で署名し合う）。この対比で出題される。『認証局』の語があればPKI、『信頼の輪』ならPGP。","year":"r8"},{"id":91,"cat":"technology","sub":"セキュリティ","prompt":"デジタル署名やブロックチェーンで用いられるハッシュ関数には、SHA-256、SHA-512などがある。このようなハッシュ関数に関する記述として、適切なものはどれか。","opts":["あるハッシュ関数を用いて得たハッシュ値を、そのハッシュ関数に入力することによって、元のデータを復元することができる。","同じデータを異なるハッシュ関数にそれぞれ入力したとき、得られるハッシュ値は全て同じになる。","同じハッシュ関数を用いる場合、入力したデータが同じであれば、得られるハッシュ値は常に同じになる。","どのハッシュ関数にもそれぞれの逆関数が存在し、ハッシュ値から元のデータを復元することができる。"],"ans":2,"why":"ハッシュ関数の3大性質は『①同じ入力からは常に同じ出力（決定性）』『②出力から入力を復元できない（一方向性）』『③わずかな入力の違いで出力が激変（雪崩効果）』。ウは①そのもの。","wrong":"ア・エは一方向性を否定しており誤り。ハッシュ値から元データは復元できない（だからパスワード保存に使える）。イは関数が違えば出力も違うので誤り。","tip":"ハッシュ＝『指紋』。同じ人なら何度取っても同じ指紋、でも指紋から人体は復元できない。改ざん検知に使えるのは①と③の性質のおかげ。","year":"r8"},{"id":92,"cat":"technology","sub":"セキュリティ","prompt":"ゼロトラストセキュリティの考え方に基づいた情報セキュリティ対策の例として、適切なものはどれか。","opts":["インターネットと内部ネットワークの境界にファイアウォールを配置し、インターネットからの脅威を境界で遮断する。","内部ネットワークからであっても外部ネットワークからであっても、ネットワーク上の情報資源へのアクセスには二要素認証を利用する。","内部ネットワークに接続するPCにインストールされたソフトウェアに脆弱性が発見されたときに、そのセキュリティパッチは公開後直ちに適用する。","内部ネットワークに接続するPCのうち、インターネットにアクセスするPCだけにマルウェア対策ソフトをインストールする。"],"ans":1,"why":"ゼロトラスト＝『何も信頼しない』。社内ネットワークだからといって信用せず、内部・外部を問わず全てのアクセスを都度検証する。イは内外を区別せず認証している点が完全一致。","wrong":"アは典型的な境界防御モデルで、ゼロトラストとは正反対の考え方（中は安全と信じている）。ウは正しい対策だがゼロトラスト固有ではない。エは内部PCを信頼しており、むしろ危険。","tip":"『社内だから安全』を捨てるのがゼロトラスト。判定は『内部と外部を区別しているか』の一点。区別していたら境界防御、区別せず全部疑っていたらゼロトラスト。","year":"r8"},{"id":93,"cat":"technology","sub":"セキュリティ","prompt":"次のISMSにおける実施項目のうち、最初に行うものはどれか。","opts":["ISMSの適用範囲の決定","情報セキュリティリスクアセスメント","情報セキュリティリスク対応","内部監査"],"ans":0,"why":"どこまでを守るのか（組織・拠点・情報資産の範囲）を決めなければ、リスクの洗い出しも対策もできない。適用範囲の決定が全ての出発点。","wrong":"順序はア（範囲決定）→イ（リスクアセスメント：特定・分析・評価）→ウ（リスク対応：低減・回避・移転・受容）→エ（内部監査：PDCAのCheck）。1つでも順序を入れ替えると成立しない。","tip":"『陣地を決めてから、敵を数えて、対策を打って、点検する』という流れで覚える。ISMSはPDCAで回るので、Plan段階の最初が範囲決定。","year":"r8"},{"id":94,"cat":"technology","sub":"セキュリティ","prompt":"情報セキュリティ対策を、\"技術的セキュリティ対策\"、\"人的セキュリティ対策\"及び\"物理的セキュリティ対策\"に分類したとき、\"物理的セキュリティ対策\"の例として、適切なものはどれか。","opts":["機密情報の取扱いに関して、罰則を含めた規則を制定し、これを遵守させるために、関係者に定期的な教育を実施する。","被災によるシステム障害が発生してもサービスを継続できるように、遠隔地にバックアップシステムを用意する。","ますます方法が巧妙化されるサイバー攻撃による被害を防ぐために、サイバー攻撃の方法や対策に関する情報を従業員に周知する。","マルウェアによる被害を防ぐために、マルウェア対策ソフトを導入し、定義ファイルを常に最新に保つ。"],"ans":1,"why":"遠隔地に物理的な設備（バックアップシステム）を配置するのは、建物・機器という物理的資産に関する対策なので物理的セキュリティ対策。","wrong":"アとウは教育・規則で人的セキュリティ対策。エはソフトウェアによる技術的セキュリティ対策。3分類が選択肢に振り分けられているので、キーワードで仕分ければ確実。","tip":"3分類の目印：『教育・規則・罰則』＝人的、『ソフト・暗号・認証』＝技術的、『施錠・入退室・耐震・遠隔地設備』＝物理的。モノと場所が出てきたら物理的。","year":"r8"},{"id":95,"cat":"technology","sub":"セキュリティ","prompt":"SQLインジェクションの対策などで用いられ、処理の誤動作を招かないように、利用者がWebサイトに入力した内容に含まれる有害な文字列を無害な文字列に置き換えることを何と呼ぶか。","opts":["MACアドレスフィルタリング","サニタイジング","ストライピング","ソーシャルエンジニアリング"],"ans":1,"why":"サニタイジング（sanitizing＝無害化・消毒）。入力値に含まれる特殊記号（'や<など）をエスケープして、SQL文やHTMLとして解釈されないようにする。","wrong":"アは無線LANの端末制限。ウはRAID0のデータ分散書き込み。エは人の心理を突いて情報を聞き出す攻撃手法。用語の意味さえ知っていれば即答できる。","tip":"sanitary＝衛生的（サニタリー用品と同じ語源）。危険な文字を消毒するイメージ。SQLインジェクション対策の本命はプレースホルダ（バインド機構）だが、試験ではサニタイジングが問われる。","year":"r8"},{"id":96,"cat":"technology","sub":"セキュリティ","prompt":"機密情報の取得などを目的として、特定の組織や個人に対して、複数の攻撃手法を使うなどして長期間にわたり継続的に攻撃を行うという特徴をもつ、サイバー攻撃はどれか。","opts":["APT攻撃","DDoS攻撃","ゼロデイ攻撃","パスワードリスト攻撃"],"ans":0,"why":"APT＝Advanced Persistent Threat（高度で持続的な脅威）。特定の標的に狙いを定め、時間をかけて潜伏しながら機密情報を盗み出す。国家関与型のスパイ活動でよく使われる。","wrong":"イDDoSは大量アクセスでサービスを停止させる攻撃（情報は盗まない）。ウゼロデイはパッチ未提供の脆弱性を突く攻撃（一撃型）。エは流出したID/PWの使い回しを狙う攻撃。","tip":"Persistent＝しつこい、が決め手。『長期間』『継続的』『特定の標的』の3語が揃ったらAPT。標的型攻撃メールはAPTの入口としてよく使われる。","year":"r8"},{"id":97,"cat":"technology","sub":"法務・OSS","prompt":"OSS（Open Source Software）の取扱いに関する記述のうち、適切なものだけを全て挙げたものはどれか。\n\na OSSを集めた記録媒体を、顧客に有償で提供する。\nb 改変したOSSを、特定の利用分野に制限してOSSとして提供する。\nc 不具合を発見して修正したOSSのソースコードを、自分のWebサイトで提供する。","opts":["a","a, c","b, c","c"],"ans":1,"why":"OSSの定義（OSD）では『再頒布の自由』が認められており、媒体代や配布手数料として有償で提供すること自体は禁止されていない（a）。また修正版のソース公開はコピーレフトの要請そのもの（c）。","wrong":"bが誤り。OSDには『使用する分野に対する差別の禁止』が明記されており、『特定の利用分野に制限する』のはOSSの要件に反する。ここを知らないとaかcの単独を選んでしまう。","tip":"OSDの禁止事項3つ：『人や集団を差別しない』『利用分野を制限しない』『再頒布を制限しない』。逆に『有償で売ってはいけない』という条項は存在しない。無料であることはOSSの条件ではない、が最大の盲点。","year":"r8"},{"id":98,"cat":"technology","sub":"AI","prompt":"AIにおけるプロンプトエンジニアリングの説明として、適切なものはどれか。","opts":["AIが、多数の事象やデータから普遍的なルールや知識を獲得すること","AIに対する質問や指示などが入力できる状態であることを、画面上に記号や文字列で示すこと","意図した回答を得るためにAIに対する質問や指示の内容、情報の提供、出力形式の指定などを工夫すること","神経細胞が作るネットワークをコンピュータで模した、AIで用いられる計算モデルのこと"],"ans":2,"why":"プロンプトエンジニアリング＝AIへの指示（プロンプト）の出し方を工夫して、望む出力を引き出す技術。前提情報の与え方や出力形式の指定も含む。","wrong":"アは機械学習そのもの。イはコマンドプロンプト（入力待ちの記号）の説明で、同じ『プロンプト』という語を使った引っかけ。エはニューラルネットワーク。","tip":"prompt＝促すもの。イのコマンドプロンプトとの混同が唯一の罠。『工夫する』という語があるかで判別できる。エンジニアリング＝工夫・設計。","year":"r8"},{"id":99,"cat":"technology","sub":"コンピュータ構成","prompt":"入力装置に関する次の記述中のa、bに入れる字句の適切な組合せはどれか。\n\n[ a ]は、紙などに光を当て、反射光を読み取り、文字や図形をデジタルデータに変換してPCに取り込む。[ a ]が文字や図形をどの程度細かく読み取れるかの性能を示す単位として[ b ]が使われる。","opts":["a:イメージスキャナー / b:bps","a:イメージスキャナー / b:dpi","a:スクリーンリーダー / b:bps","a:スクリーンリーダー / b:dpi"],"ans":1,"why":"紙に光を当てて読み取るのはイメージスキャナー。解像度の単位はdpi（dots per inch＝1インチあたりのドット数）で、数値が大きいほど細かく読み取れる。","wrong":"スクリーンリーダーは画面の文字を音声で読み上げる支援技術で、紙を読む装置ではない。bpsはbits per second＝通信速度の単位であり解像度ではない。","tip":"単位は必ず英語を展開する：dpi＝dots per inch（密度）、bps＝bits per second（速度）。per の前が『何を』、後ろが『何あたり』。ppi（pixels per inch）も同義で使われる。","year":"r8"},{"id":100,"cat":"technology","sub":"セキュリティ","prompt":"ISMSの活動に関する記述として、最も適切なものはどれか。","opts":["企業のコスト削減や製品の品質、サービスの改善などのために、業務プロセスを改善する。","顧客の満足度を高めるために、ITサービスの品質を継続的に改善する。","情報資産を洗い出し、リスクの特定と分析及び評価を行い、情報資産を管理する。","製品とサービスの開発プロセスの成熟度を評価し、改善する。"],"ans":2,"why":"ISMS＝Information Security Management System。守るべき情報資産を洗い出し、リスクアセスメントを行い、継続的に管理・改善する仕組み。","wrong":"アはBPR/BPM（業務改善）。イはITSM/ITIL（ITサービス管理）。エはCMMI（能力成熟度モデル）。マネジメントシステム系の用語を並べた問題で、『情報資産』という語があるのはウだけ。","tip":"マネジメントシステムの守備範囲：ISMS＝情報資産を守る、ITSM＝サービス品質を上げる、CMMI＝開発プロセスの成熟度を測る。『情報資産』『リスクアセスメント』が出たらISMS一択。","year":"r8"},{"id":1,"cat":"strategy","sub":"法務","prompt":"A社がB社に作業の一部を請負契約で委託している。作業形態a〜cのうち、いわゆる偽装請負とみなされる状態だけを全て挙げたものはどれか。\n\na B社の従業員が、A社内において、A社の責任者の指揮命令の下で、請負契約で取り決めた作業を行っている。\nb B社の従業員が、A社内において、B社の責任者の指揮命令の下で、請負契約で取り決めた作業を行っている。\nc B社の従業員が、B社内において、A社の責任者の指揮命令の下で、請負契約で取り決めた作業を行っている。","opts":["a","a, b","a, c","b, c"],"ans":2,"why":"請負契約では、発注者（A社）が受注者（B社）の従業員に直接指揮命令をしてはならない。判定基準は「場所」ではなく「誰が指揮命令しているか」の一点。a・cはいずれもA社の責任者が指揮命令しており偽装請負に当たる。","wrong":"bはB社の責任者が指揮命令しているため、A社内での作業であっても正しい請負の形。よってbを含むイ・エは誤り。アはcを見落とした答えで、「自社内だから偽装、他社内なら安全」と場所で判断してしまった典型的なミス。","tip":"偽装請負の判定は『場所を見るな、指示の矢印を見ろ』。発注者→受注者従業員の矢印が直接引かれていたらアウト。派遣ならこの矢印が合法になる、という対比で覚える。","year":"r7"},{"id":2,"cat":"strategy","sub":"法務","prompt":"従来の情報セキュリティマネジメントシステム規格を基礎に追加で制定されたもので、クラウドサービスに対応した情報セキュリティ管理体制を構築するためのガイドライン規格として、最も適切なものはどれか。","opts":["ISO 14001","JIS Q 15001","ISO/IEC 27017","ISO 9001"],"ans":2,"why":"27000シリーズが情報セキュリティの系統。その中でISO/IEC 27017はクラウドサービス向けの管理策ガイドラインとして追加制定された規格である。","wrong":"ISO 14001は環境マネジメント、JIS Q 15001は個人情報保護マネジメント（プライバシーマークの基準）、ISO 9001は品質マネジメント。いずれも情報セキュリティの系統ではない。","tip":"番号で覚える。9001＝品質、14001＝環境、27001＝情報セキュリティ、27017＝クラウド、27018＝クラウド上の個人情報。27000番台を見たらセキュリティと即断してよい。","year":"r7"},{"id":3,"cat":"strategy","sub":"法務","prompt":"政府は、官民データ活用推進基本法に定められた\"官民データ活用推進基本計画\"を策定し、官民データの公開や活用の促進に取り組んでいる。次の組織体のうち、官民データを所有しているものだけを全て挙げたものはどれか。\n\na 県庁　b 大学　c 電力事業者　d 独立行政法人","opts":["a, b, c","a, b, c, d","a, b, d","a, c, d"],"ans":1,"why":"官民データとは、国・地方公共団体・独立行政法人および事業者が業務上作成・取得する電磁的記録を指す。「官」だけでなく「民」も含むのが法律名のとおりで、a〜dは全て該当する。","wrong":"ア・ウ・エはいずれも一部を除外した答え。大学（私立含む）や電力事業者を「民間だから対象外」と考えると誤る。法の目的は官民双方のデータを流通させることにあり、除外の理由がない。","tip":"『官民』と名前に書いてある時点で、官も民も全部入る。全部入りの選択肢がある問題は、除外する明確な根拠を1つも挙げられなければ全部入りが正解。","year":"r7"},{"id":4,"cat":"strategy","sub":"経営戦略手法","prompt":"投資の優先度などの経営の戦略を策定するために、経済価値、希少性、模倣困難性及び組織の四つの要素で評価することによって、自社のもつ資源を分析する手法として、最も適切なものはどれか。","opts":["4P","PPM","SWOT分析","VRIO分析"],"ans":3,"why":"VRIOはValue（経済価値）、Rarity（希少性）、Inimitability（模倣困難性）、Organization（組織）の頭文字。問題文の四要素がそのまま名称になっている。","wrong":"4Pはマーケティングミックス（Product/Price/Place/Promotion）。PPMは製品を市場成長率と占有率で4象限に分ける手法。SWOT分析は強み・弱み・機会・脅威の4区分で、内部要因だけを見るVRIOとは対象が異なる。","tip":"四要素の頭文字がそのまま略語になっている問題は、選択肢の綴りを分解すれば即答できる。V・R・I・Oを日本語に戻せる状態にしておけばよい。","year":"r7"},{"id":5,"cat":"strategy","sub":"会計・財務","prompt":"A社ではB商品の仕入れと販売を行っている。ある期のB商品の仕入単価は期首から上昇し続け、期末が最も高くなった。当該期の売上原価を\"期首棚卸高＋当期商品仕入高－期末棚卸高\"で計算するとき、期末棚卸高の計算に期末の仕入単価を用いると、B商品の期末棚卸高及び売上原価は、期中の仕入単価の平均値を用いる場合に比べてどのようになるか。","opts":["期末棚卸高、売上原価ともに上がる。","期末棚卸高、売上原価ともに変わらない。","期末棚卸高は上がり、売上原価は下がる。","期末棚卸高は下がり、売上原価は上がる。"],"ans":2,"why":"期末単価は平均単価より高いので、同じ在庫数量でも期末棚卸高は大きくなる。売上原価の式では期末棚卸高が引かれる側にあるため、引く額が増えれば売上原価は小さくなる。","wrong":"アとエは棚卸高と売上原価が同じ方向に動くとした答えだが、式の中で期末棚卸高はマイナス項なので必ず逆方向に動く。イは単価差を無視した答え。","tip":"式を見て符号だけ追えば解ける。売上原価＝期首＋仕入－期末。期末はマイナスなので『期末在庫が増えれば原価は減り、利益は増える』。在庫評価が利益操作につながる理屈もこれ。","year":"r7"},{"id":6,"cat":"strategy","sub":"法務","prompt":"特定電子メール法は、電子メールによる一方的な広告宣伝メールの送信を規制する法律である。企業担当者が行った次の電子メールの送信事例のうち、特定電子メール法の規制対象となり得るものはどれか。","opts":["広告宣伝メールの受信を拒否する旨の意思表示がないことを確認したのち、公表されている企業のメールアドレス宛てに広告宣伝メールを送信した。","受信者から拒否通知があった場合には、それ以降の送信を禁止すればよいと考え、広告宣伝メールを送信した。","内容は事務連絡と料金請求なので問題ないと考え、受信者本人の同意なく、メールを送信した。","長年の取引関係にある企業担当者に対して、これまで納入してきた製品の新バージョンが完成したので、その製品に関する広告宣伝メールを送信した。"],"ans":1,"why":"同法はオプトイン方式を採る。すなわち事前に同意を得た相手にしか広告宣伝メールを送れない。イは「送ってから拒否されたら止める」というオプトアウト的発想であり、事前同意がないため規制対象となる。","wrong":"アは公表されている企業アドレスへの送信で、通知拒否の意思表示がない場合の例外に当たる。ウは広告宣伝ではなく事務連絡・請求なのでそもそも特定電子メールに該当しない。エは既存の取引関係がある相手への通知で例外に当たる。","tip":"オプトイン＝先に許可、オプトアウト＝後から拒否。日本の特定電子メール法は『先に許可』が原則。選択肢の中で「送ってから考える」姿勢のものを探せばよい。","year":"r7"},{"id":7,"cat":"strategy","sub":"システム戦略","prompt":"新しい概念やアイディアの実証を目的とした、開発の前段階における検証を表す用語はどれか。","opts":["CRM","PoC","RAS","SLA"],"ans":1,"why":"PoCはProof of Concept（概念実証）の略。本格開発に投資する前に「そもそも実現できるか」を小さく試す工程を指す。","wrong":"CRMは顧客関係管理、RASは信頼性・可用性・保守性を表す指標、SLAはサービス品質に関する合意書。いずれも開発前検証とは無関係。","tip":"Proof of Concept＝コンセプトの証明。試作品を作るプロトタイピングが『動くもので要件を確認』なのに対し、PoCは『そもそも成立するかの確認』。段階がひとつ手前と覚える。","year":"r7"},{"id":8,"cat":"strategy","sub":"AI","prompt":"AIの機械学習で利用するデータの取扱いに関する記述のうち、バイアスの低減やデータの品質を確保するために考えられる対策として、適切なものだけを全て挙げたものはどれか。\n\na 学習の目的に適したデータであることを確認する。\nb データの入手元・作成来歴を確認する。\nc データへのアノテーションの付与は学習目的に合わせて実施する。\nd 人間の目でも同定が困難と考えられる画像認識用のデータは除外する。","opts":["a, b","a, b, c, d","a, d","b, c, d"],"ans":1,"why":"a〜dはいずれも学習データの品質確保の基本動作。目的適合性の確認、来歴（プロベナンス）の確認、目的に沿ったアノテーション、判別不能なノイズデータの除外は、どれもバイアス低減と品質確保に資する。","wrong":"ア・ウ・エはいずれも一部を除外した答え。特にdを「データは多いほどよい」と考えて除外してしまいがちだが、人間でも判別できないデータはラベルの正しさを担保できず、かえって精度を下げる。","tip":"学習データの問題は『量より質』が一貫した方針。「確認する」「目的に合わせる」「怪しいものは除く」という慎重な選択肢は基本的に全て正しい、と割り切ってよい。","year":"r7"},{"id":9,"cat":"strategy","sub":"技術戦略","prompt":"ハッカソンに関する記述として、最も適切なものはどれか。","opts":["定められたルールの下、ある主題について、肯定派と否定派といった異なる立場に分かれて議論する。","情報セキュリティ分野で活躍したいという意志をもった若者が、合宿形式で情報セキュリティに関する実践的な知識を学ぶ。","プログラマーやデザイナーなどから成る複数の参加チームが、与えられたテーマに関するプロトタイプを短期間で作成し、その成果を発表して競い合う。","問題解決や利用者獲得などゲーム的な要素のない分野に、デジタル技術を活用したゲームの要素を取り入れることによって、利用者の参加を動機づける。"],"ans":2,"why":"ハッカソンはHack（作る）＋Marathon（マラソン）の造語で、チームが短期集中でプロトタイプを作り成果を競うイベント。「作る」「短期集中」「競う」の三点が揃うのがウだけ。","wrong":"アはディベート。イはセキュリティ・キャンプに代表される合宿型の人材育成。エはゲーミフィケーション。いずれも手を動かしてプロトタイプを作る要素がない。","tip":"語尾の-athon（マラソン）が『長時間ぶっ通しで何かをやる』のサイン。アイデア出しに特化した派生語がアイデアソン。イベント系用語は語源で分解すれば取り違えない。","year":"r7"},{"id":10,"cat":"strategy","sub":"AI","prompt":"生成AIにおいて、もっともらしいが事実とは異なる内容が出力されることを表す用語として、最も適切なものはどれか。","opts":["エコーチェンバー","シンギュラリティ","ディープフェイク","ハルシネーション"],"ans":3,"why":"ハルシネーション（hallucination＝幻覚）は、生成AIが学習データにない、あるいは事実と異なる内容を自信ありげに出力する現象を指す。","wrong":"エコーチェンバーはSNSなどで同じ意見ばかりが反響し増幅される現象。シンギュラリティはAIが人間の知能を超える技術的特異点。ディープフェイクはAIで作られた偽の画像・動画で、こちらは意図的な偽造である点がハルシネーションと決定的に異なる。","tip":"ディープフェイクは『人が騙そうとして作る』、ハルシネーションは『AIが勝手に間違える』。悪意の有無で切り分けると混同しない。","year":"r7"},{"id":11,"cat":"strategy","sub":"エンジニアリング","prompt":"スマートファクトリーにおいても使用されている、FMS（Flexible Manufacturing System）に関する記述として、最も適切なものはどれか。","opts":["技術革新を効果的に自社の経営に取り入れることによって、企業の成長を図る。","生産工程の各段階で、原材料から完成製品までの資材の流れを適時・適量に管理する。","生産時に必要となる部品などを必要な分だけ供給することによって、生産リードタイムを短縮する。","複数の工作機械や産業用ロボットなどを有機的に結合し、生産プロセス全体を統括的に制御・管理する。"],"ans":3,"why":"FMSは複数の工作機械・搬送装置・ロボットをコンピュータで統合制御し、多品種少量生産に柔軟（Flexible）に対応する生産システムである。","wrong":"アはMOT（技術経営）。イはMRP的な資材所要量管理。ウはJIT（ジャストインタイム）方式。いずれも「機械を有機的に結合して制御する」という設備統合の話ではない。","tip":"Manufacturing System＝製造の仕組みそのもの。Flexibleは『段取り替えなしで多品種に対応できる』の意。設備の話か、資材の話か、経営の話かで選択肢を三分すれば残るのは一つ。","year":"r7"},{"id":12,"cat":"strategy","sub":"法務","prompt":"商標法におけるサービスマークを説明したものはどれか。","opts":["企業が、企業そのものを他社と区別するために表示する商標である。","製造業者、販売業者が提供する商品を、他社の商品と区別するために表示する商標である。","大規模小売業者が開発したプライベートブランドの商品を、他社の商品と区別するために表示する商標である。","輸送業者、金融業者などが提供する役務を、他社の役務と区別するために表示する商標である。"],"ans":3,"why":"サービスマークは役務（サービス）についての商標。輸送・金融・飲食など、形のないサービスを識別するために用いられる。","wrong":"アはハウスマーク（企業標章）。イは商品商標（トレードマーク）。ウはプライベートブランドの商品商標で、これも商品に付くもの。いずれも対象が「商品」であり「役務」ではない。","tip":"サービス＝役務＝形のないもの。商標法の問題は『商品か役務か』の二択に落とし込めば、選択肢の中で役務と書いてあるものを選ぶだけになる。","year":"r7"},{"id":13,"cat":"strategy","sub":"システム戦略","prompt":"新しいITソリューションの活用の是非を判断するために、そのITソリューションの提供者に、活用事例や技術情報などの提供を依頼する文書として、最も適切なものはどれか。","opts":["EDI","KPI","RFI","RFP"],"ans":2,"why":"RFIはRequest For Information（情報提供依頼書）。提案を求める前段階で、市場にどんな技術や事例があるかを集めるために出す。","wrong":"EDIは企業間の電子データ交換。KPIは重要業績評価指標。RFPはRequest For Proposal（提案依頼書）で、要件を示して具体的な提案・見積りを求める段階の文書。本問は「是非を判断するため」の情報収集なので、まだRFPの段階ではない。","tip":"順番はRFI→RFP→見積り→契約。Information（情報）が先、Proposal（提案）が後。『まず知りたい』のか『もう頼みたい』のかで見分ける。","year":"r7"},{"id":14,"cat":"strategy","sub":"技術戦略","prompt":"事業、経営情報に知財情報を組み込んで分析し、現状の俯瞰や将来展望などの分析結果を事業責任者、経営者と共有し、事業戦略又は経営戦略に反映させることを表す用語として、最も適切なものはどれか。","opts":["CVC（Corporate Venture Capital）","IPランドスケープ（Intellectual Property Landscape）","MOT（Management of Technology）","SWOT分析"],"ans":1,"why":"IPランドスケープは、特許などの知財情報（IP）と経営情報を組み合わせて事業環境を俯瞰（landscape＝景観）し、経営層と共有して戦略に反映させる活動を指す。","wrong":"CVCは事業会社によるベンチャー投資。MOTは技術を経営に生かす技術経営全般。SWOT分析は強み・弱み・機会・脅威の整理で、知財情報を軸に据える手法ではない。","tip":"IP＝Intellectual Property（知財）、Landscape＝見晴らし。『知財の眺望図を経営に見せる』と直訳すればそのまま定義になる。","year":"r7"},{"id":15,"cat":"strategy","sub":"経営・組織","prompt":"事業運営における意思決定の迅速化、組織の独立採算の推進を目的とし、一つの企業の中に事業領域ごとに独立した組織を設置する組織形態はどれか。","opts":["カンパニー制組織","機能別組織","プロジェクト組織","マトリックス組織"],"ans":0,"why":"カンパニー制は社内の各事業を独立した会社（カンパニー）に見立て、権限と責任、そして採算を分離する組織形態。意思決定の迅速化と独立採算がまさに狙いである。","wrong":"機能別組織は開発・製造・営業など職能で分ける形で、独立採算にはならない。プロジェクト組織は特定目的のために期限付きで編成される。マトリックス組織は事業軸と機能軸を掛け合わせる形で、指揮命令が二重になるため意思決定はむしろ複雑になる。","tip":"キーワードは『独立採算』。事業部制よりさらに権限を強めたのがカンパニー制。分社化の一歩手前、と位置づけて覚える。","year":"r7"},{"id":16,"cat":"strategy","sub":"法務","prompt":"他人の電子メールの利用者IDとパスワードの取扱いに関する記述のうち、不正アクセス禁止法で規制されている行為だけを全て挙げたものはどれか。\n\na 正当な理由なく本人に無断で第三者に提供する。\nb 他人の電子メールの利用者IDとパスワードを無効にするマルウェアを作成する。\nc 本人に無断で使用して、メールサーバ上の電子メールを閲覧する。","opts":["a, b, c","a, c","b, c","c"],"ans":1,"why":"不正アクセス禁止法は、不正アクセス行為そのもの（c）に加えて、識別符号の不正取得・不正保管・不正提供（a）も禁止している。","wrong":"bのマルウェア作成は不正指令電磁的記録に関する罪（いわゆるウイルス作成罪）として刑法で規制されるもので、不正アクセス禁止法の対象ではない。よってbを含むア・ウは誤り。エはaを見落とした答え。","tip":"不正アクセス禁止法の守備範囲は『IDとパスワードをめぐる行為』。作る・壊すプログラムの話が出てきたら刑法（ウイルス罪）に振り分ける、と法律ごとに担当を決めておく。","year":"r7"},{"id":17,"cat":"strategy","sub":"システム戦略","prompt":"プロセスマイニングに関する記述として、最も適切なものはどれか。","opts":["一連の業務で実際に遂行したシステムの操作ログなどを収集し、現行の業務プロセスの可視化、分析、モニタリングによって業務の課題を特定して改善を図る手法やツールである。","業務プロセスをそれまでの習慣などにとらわれず、抜本的に再構築して業務効率の改善を図る手法である。","コンタクトセンターへの問合せ内容やSNSの投稿内容の分析などの業務プロセスで用いられる、膨大な文章データから必要な情報を抽出して分析する手法である。","大量の計算処理で正しい値を算出する一連のプロセスを通じて、暗号資産を取得する手段である。"],"ans":0,"why":"プロセスマイニングは、システムに残る操作ログ（イベントログ）を掘り起こして実際の業務の流れを可視化し、想定との差異やボトルネックを見つける手法である。","wrong":"イはBPR（業務プロセス再構築）。ウはテキストマイニング。エはマイニング（採掘）という語が共通するだけの暗号資産のマイニング。「マイニング」という語に引きずられると取り違える。","tip":"マイニング＝掘る。何を掘るかで区別する。プロセスマイニング＝ログを掘る、テキストマイニング＝文章を掘る、データマイニング＝数値データを掘る、暗号資産のマイニング＝計算で通貨を掘る。","year":"r7"},{"id":18,"cat":"strategy","sub":"システム戦略","prompt":"ITにおけるアクセシビリティに関する記述として、最も適切なものはどれか。","opts":["高齢者や障害者などを含め、様々な能力や特性をもつ幅広い層の人が等しく利用できるように配慮したソフトウェア製品の設計","顧客データを基に顧客を識別し、コールセンターやインターネットなどの様々なチャネルを用いて顧客との関係を深める手法","製品、システム、サービスなどにおいて、それらを使用する場面をイメージしたり実際に利用したりすることで得られる人の感じ方や反応","特定のファイルやデータベースなどの情報資産に対し、参照や更新などの権限の認可や制限を確実にする手段"],"ans":0,"why":"アクセシビリティはaccess＋abilityで「近づける度合い」。誰もが等しく利用できるかを表す概念であり、高齢者や障害者への配慮がその中心にある。","wrong":"イはCRM。ウはUX（ユーザエクスペリエンス）。エはアクセス制御。特にエは「アクセス」という語が共通するため引っ掛かりやすいが、アクセス制御は逆に利用を制限する仕組みである。","tip":"アクセシビリティ＝誰でも使えるか、ユーザビリティ＝使いやすいか、アクセス制御＝使わせないか。三つを『誰が・どれだけ快適に・使わせるか』の軸で並べて整理する。","year":"r7"},{"id":19,"cat":"strategy","sub":"ビジネスインダストリ","prompt":"仮想環境を用いた技術であるAR又はVRの活用事例のうち、VRの活用事例として、最も適切なものはどれか。","opts":["顔を覆うように頭部にゴーグルを装着し、そのゴーグル内に投影された仮想空間に広がる火災や地震の映像を見ながら避難方法をイメージすることによって、防災訓練が行える。","家具をオンラインで購入するときに、スマートフォンのカメラを通して画面に映っている現実の自分の部屋に、購入したい家具をリアルタイムに重ねて試し置きできる。","史跡などにスマートフォンを向けることによって、昔あった建物の画像や説明情報が現実の風景と重なって画面に表示される。","図鑑にスマートフォンをかざすことによって、図鑑の絵や写真に重なって生物の動画が見られる。"],"ans":0,"why":"VR（仮想現実）は現実を遮断して仮想空間に没入させる技術。ゴーグルで視界を覆い、仮想空間の映像だけを見ているアが該当する。","wrong":"イ・ウ・エはいずれも現実の映像に情報を重ねる形で、AR（拡張現実）の例。「カメラを通して現実に重ねる」という記述が出てきたら全てARと判断してよい。","tip":"VRは現実を『置き換える』、ARは現実に『足す』。選択肢に現実の風景が映っていればAR、映っていなければVR、という一点で切れる。","year":"r7"},{"id":20,"cat":"strategy","sub":"システム戦略","prompt":"ソフトウェアライフサイクルを企画プロセス、要件定義プロセス、開発プロセス、保守プロセスに分けたとき、企画プロセスのシステム化構想の立案時にベンダー企業から収集する情報として、最も適切なものはどれか。","opts":["システム化計画に基づいた開発コストの見積り","システム化する業務の分野に関する情報技術動向","システム構築を進めるに当たっての発注元企業の役割","ベンダー企業の技術者が保有している技術資格"],"ans":1,"why":"システム化構想の立案は最上流であり、「そもそもどんな技術で何ができるのか」という方向性を探る段階。したがってベンダーから集めるべきは業務分野に関する情報技術動向である。","wrong":"アの開発コスト見積りはシステム化計画が固まった後の話で、段階が先すぎる。ウの発注元企業の役割は自社で決めることでありベンダーから収集する情報ではない。エの技術資格はベンダー選定の評価材料であって、構想立案の材料ではない。","tip":"上流工程の問題は『段階が早すぎないか』で切る。構想の段階では、まだ金額も体制も決まっていない。決まっていないはずのものが選択肢にあれば、それは誤り。","year":"r7"},{"id":21,"cat":"strategy","sub":"ビジネスインダストリ","prompt":"基本的な機能やサービスは無償で提供し、追加の機能やサービスを有償で提供することで利益を上げるビジネスモデルを表す用語として、最も適切なものはどれか。","opts":["フリーウェア","フリーミアム","フリーライド","フリーランス"],"ans":1,"why":"フリーミアムはFree（無料）＋Premium（割増）の造語。無料版で利用者を集め、上位機能を有料化して収益を得るモデルを指す。","wrong":"フリーウェアは単に無償で配布されるソフトウェア。フリーライドはただ乗り。フリーランスは特定企業に属さない働き方。いずれも「無料と有料の二段構え」という収益構造を表していない。","tip":"Free＋Premiumの合成語だと分かれば即答。スマホゲームの基本無料＋課金アイテムがまさにこれ、と具体例で紐づけておく。","year":"r7"},{"id":22,"cat":"strategy","sub":"システム戦略","prompt":"営業部のAさんは、営業担当者10人の営業成績が一目で分かるように、各営業担当者が提出する営業見込みと実績を毎月集約してグラフ化したいと考えている。この問題を解決するために適用する技術やツールとして、最も適切なものはどれか。","opts":["データを学習し、分析するAI","データを自動収集し、データベースに蓄積するIoT","入力したデータを、加工して見せるオフィスツール","ビッグデータを、様々な手法で分析するデータサイエンス"],"ans":2,"why":"対象は10人分の月次データという小規模な定型集計であり、表計算ソフトなどのオフィスツールで十分に実現できる。目的に対して最小限の手段を選ぶのが適切。","wrong":"アのAIは学習させるほどのデータ量も予測要件もない。イのIoTはセンサーからの自動収集の話で、人が提出するデータには当たらない。エのデータサイエンスはビッグデータ前提で、10人分の月次データは該当しない。","tip":"この手の問題は『流行りの用語を選ばない』のが鉄則。データ量と目的を読んで、過剰な手段を除いていけば地味な選択肢が残る。","year":"r7"},{"id":23,"cat":"strategy","sub":"経営・組織","prompt":"コーポレートガバナンスの強化に有効な施策だけを全て挙げたものはどれか。\n\na 株式公開買付けによる企業の買収\nb 執行役員制度の導入による経営と執行の分離\nc 独立性の高い社外取締役の選任","opts":["a, b","a, b, c","b, c","c"],"ans":2,"why":"コーポレートガバナンスは経営を監視・牽制する仕組み。bの経営と執行の分離、cの独立社外取締役の選任は、いずれも監督機能を強める代表的な施策である。","wrong":"aの株式公開買付け（TOB）による買収は事業拡大や支配権取得のための行為であり、自社の統治機構を強化する施策ではない。よってaを含むア・イは誤り。エはbを見落とした答え。","tip":"ガバナンス＝監視の目を増やすこと。『誰かがチェックする体制になるか』を各選択肢に当てはめる。買収はチェックではなく取得なので外れる。","year":"r7"},{"id":24,"cat":"strategy","sub":"システム戦略","prompt":"RPAに関する記述として、最も適切なものはどれか。","opts":["企業の一部の業務を外部の組織に委託することによって、自社のリソースを重要な領域に集中したり、コストの最適化や業務の高効率化などを実現したりする。","組立てや搬送などにハードウェアのロボットを用いることによって、工場の生産活動の自動化を実現する。","システムの利用者が、主体的にシステム管理や運用を行うことによって、利用者のITリテラシーの向上や、システムベンダーへの依存の軽減などを実現する。","ホワイトカラーの定型的な事務作業を、ソフトウェアのロボットに代替させることによって、自動化や効率化を図る。"],"ans":3,"why":"RPAはRobotic Process Automation。ここでいうロボットはソフトウェアのロボットであり、事務職（ホワイトカラー）の定型作業を代行させるのが本質である。","wrong":"アはアウトソーシング。イは物理的な産業用ロボットで、RPAの「ロボット」とは別物。ウはエンドユーザコンピューティング（EUC）。","tip":"RPAのRは『ソフトのロボット』。工場の腕が動くロボットとは無関係。事務所の中で、人がやっていたクリック作業を肩代わりする、と場面で覚える。","year":"r7"},{"id":25,"cat":"strategy","sub":"ビジネスインダストリ","prompt":"ブロックチェーンを適用した事例として、最も適切なものはどれか。","opts":["証券会社が、取引の改ざんや不整合の発生を防止することを目的として、従来の社債に代わり電子的手段を用いたデジタル社債を発行した。","商品先物取引所を運営する認可法人が、取引量を拡大することを目的として、現在およそ1秒以上要している注文受付の応答時間を、1秒未満に改善した。","ビジネス路線を中心に運航する航空会社が、顧客の利便性向上と競合他社に対する競争力強化を目的として、出発1時間前まで何回でも予約の変更を可能とする新しいサービスを開始した。","服飾雑貨製造会社が、自社の商品企画に活用することを
