目的として、過去の全ての自社商品に関する大量の画像及び社内会議の音声データをデータベースに保存し、従業員がいつでも検索できるようにした。"],"ans":0,"why":"ブロックチェーンの最大の特徴は、取引記録を連鎖的に保持し改ざんを極めて困難にする点。「改ざんや不整合の防止」を目的に掲げているアが該当する。","wrong":"イは単なる応答性能の改善で、ブロックチェーンはむしろ処理速度が遅い傾向にある。ウは予約システムの業務ルール変更。エは大容量データの蓄積・検索で、データベースやビッグデータの話。","tip":"ブロックチェーンのキーワードは『改ざん困難』『分散台帳』『取引履歴』。速さや検索性を売りにした事例が出てきたら、それはブロックチェーンではない。","year":"r7"},{"id":26,"cat":"strategy","sub":"会計・財務","prompt":"4月1日から5月31日までに、取引①から取引⑤があった。各取引の受注、売上計上、現金回収の状況が次のとおりであるとき、この取引先に対する5月31日時点の売掛金は何万円か。ここで、4月1日時点で売掛金残高はないものとする。\n\n取引①　4/2受注800、4/10売上計上800、4/30現金回収800\n取引②　4/5受注500、4/15売上計上500、4/30現金回収500\n取引③　5/1受注1,300、5/10売上計上1,300（6/30回収予定）\n取引④　5/6受注1,000、5/15売上計上1,000（回収予定日未定）\n取引⑤　5/20受注400","opts":["1,000","1,400","2,300","2,700"],"ans":2,"why":"売掛金は「売上計上済みだが未回収の金額」。取引①②は回収済みで残高ゼロ。取引③1,300と取引④1,000が売上計上済み未回収なので合計2,300万円。","wrong":"アは取引③を数え落とした答え。エは受注のみの取引⑤400を加えてしまった答えで、受注しただけでは売上計上されておらず売掛金は発生しない。イは取引④のみを数えた誤り。","tip":"売掛金の判定は二段チェック。①売上計上したか（受注だけはダメ）②回収したか（済みなら消える）。『計上した、まだもらってない』だけを足す。","year":"r7"},{"id":27,"cat":"strategy","sub":"システム戦略","prompt":"業務と情報システムを最適にすることを目的として、業務と情報システムの現状の把握と目標とする理想像の設定から現状と理想との乖離を明確にし、目標に向けた改善活動を移行計画として定義したい。このときに用いられる手法として、最も適切なものはどれか。","opts":["BI（Business Intelligence）","EA（Enterprise Architecture）","MOT（Management of Technology）","SOA（Service Oriented Architecture）"],"ans":1,"why":"EAは組織全体の業務とシステムの構造を、現状（As-Is）と理想（To-Be）の両面で体系化し、その差分から移行計画を作る手法である。","wrong":"BIは蓄積データを分析して意思決定を支援する仕組み。MOTは技術経営。SOAはシステムを部品化したサービスの組合せで構築する設計思想で、全社の移行計画を作る手法ではない。","tip":"EAのキーワードは『As-Is と To-Be、そしてギャップ』。この三点セットが問題文に出てきたら迷わずEA。","year":"r7"},{"id":28,"cat":"strategy","sub":"AI","prompt":"生成AIに関する記述として、最も適切なものはどれか。","opts":["一切の学習を必要とせずに、新しいコンテンツを生成する。","過去のデータから項目間の相関などを学習したモデルを用いて、現在のデータから将来の値を予測して出力する。","作成したシナリオに基づいて動作するソフトウェアロボットによって、業務を自動化する。","自然言語で指示された内容に従って、事前に学習したデータを基に、新しいコンテンツを生成する。"],"ans":3,"why":"生成AIは大量のデータを事前学習し、自然言語による指示（プロンプト）に応じて文章や画像などの新しいコンテンツを生成する。エがこの定義そのもの。","wrong":"アは「一切の学習を必要とせず」が誤り。生成AIは事前学習が前提である。イは予測モデル（回帰などの識別・予測AI）の説明で、生成ではない。ウはRPAの説明。","tip":"生成AIの三要素は『事前学習』『自然言語の指示』『新しいコンテンツ』。学習を否定する選択肢は無条件で切ってよい。","year":"r7"},{"id":29,"cat":"strategy","sub":"経営・組織","prompt":"企業経営の中核となる考え方を、ミッション、ビジョン、バリューの三つに分けて示す場合、ビジョンとして示すものとして、最も適切なものはどれか。","opts":["企業の存在意義や使命","企業の存在意義や使命をふまえた、ある時点でのありたい姿","戦略を実現するために重要となる業績管理指標","戦略を実現するために重要となる成功要因"],"ans":1,"why":"ミッションが存在意義・使命、ビジョンがそれを踏まえた将来のありたい姿、バリューが行動基準となる価値観。ビジョンは「いつか到達したい状態」を描くものである。","wrong":"アはミッションの説明。ウはKPI（重要業績評価指標）。エはCSF（重要成功要因）。ウ・エは戦略実行の管理指標であり、企業理念の三層とは別の枠組み。","tip":"ミッション＝なぜやるか、ビジョン＝どうなりたいか、バリュー＝どう振る舞うか。Why／Where／Howの順で並べると混ざらない。","year":"r7"},{"id":30,"cat":"strategy","sub":"法務","prompt":"著作権に関して、次の記述中のa、bに入れる字句の適切な組合せはどれか。\n\n［　a　］は著作権法による保護の対象になるが、［　b　］は対象にならない。","opts":["a：アルゴリズム／b：操作マニュアル","a：アルゴリズム／b：通信プロトコル","a：ソースプログラム／b：操作マニュアル","a：ソースプログラム／b：通信プロトコル"],"ans":3,"why":"著作権は「表現」を保護し「アイデア」は保護しない。ソースプログラムは具体的な表現なので保護対象、通信プロトコルは規約・アイデアに当たるため保護対象外である。","wrong":"アルゴリズムは解法という考え方＝アイデアなので保護対象外。よってア・イは誤り。操作マニュアルは文章表現なので著作物として保護される。よってウも誤り。","tip":"著作権法の除外三点セットは『プログラム言語・規約（プロトコル）・解法（アルゴリズム）』。この三つが出てきたら保護されない側、と暗記してしまうのが早い。","year":"r7"},{"id":31,"cat":"strategy","sub":"経営・組織","prompt":"ERPシステムの説明として、適切なものはどれか。","opts":["企業内の個人がもつ営業に関する知識やノウハウを収集し、共有することによって、効率的、効果的な営業活動を支援するシステム","経理や人事、生産、販売などの基幹業務と関連する情報を一元管理し、経営資源を最適配分することによって、効率的な経営の実現を支援するシステム","原材料の調達から生産、販売に関する情報を、企業間で共有・管理することによって、ビジネスプロセスの全体最適を目指すシステム","個々の顧客に関する情報や対応履歴などを管理することによって、きめ細かい顧客対応を実施し、顧客満足度の向上を支援するシステム"],"ans":1,"why":"ERPはEnterprise Resource Planning。会計・人事・生産・販売といった基幹業務の情報を一元管理し、経営資源を最適に配分する統合システムである。","wrong":"アはSFA（営業支援システム）。ウはSCM（供給連鎖管理）で、対象が企業「間」である点がERPと異なる。エはCRM（顧客関係管理）。","tip":"範囲で区別する。ERP＝社内全体、SCM＝企業をまたぐ流れ、CRM＝顧客との関係、SFA＝営業担当者。『どこまでを面倒みるか』の広さで並べる。","year":"r7"},{"id":32,"cat":"strategy","sub":"ビジネスインダストリ","prompt":"公共交通機関での移動履歴、Webサイトでの商品検索履歴、SNSやブログで発信したデータなど、個人の活動を記録する技術、又は記録そのものを表す用語として、最も適切なものはどれか。","opts":["アクティビティ","トランザクション","ライフログ","レコードキーピング"],"ans":2,"why":"ライフログは、個人の日常行動をデジタルに記録したもの、またはその記録技術を指す。移動履歴・検索履歴・SNS投稿はいずれもその典型例。","wrong":"アクティビティは単に活動を指す一般語で用語として定義されていない。トランザクションはデータベース上の一連の処理単位。レコードキーピングは文書記録管理一般を指し、個人の生活記録を表す専門用語ではない。","tip":"ライフ（生活）のログ（記録）。そのまま。似た用語が並んだら、問題文のキーワード『個人の活動』と直結する語を選ぶ。","year":"r7"},{"id":33,"cat":"strategy","sub":"ビジネスインダストリ","prompt":"自動運転の水準は、一般的に\"レベル1\"から\"レベル5\"に分けられている。\"条件付運転自動化\"と呼ばれる\"レベル3\"が示す自動運転の水準に関する記述として、最も適切なものはどれか。","opts":["運転の主体はシステムであり、人間が運転する必要はないが、システムによる自動運転の継続が難しい場合は、人間が運転しなければならない。","運転の主体はシステムであり、人間が運転する必要はないので、ハンドルやペダルなどの運転装置は不要だが、自動運転できる地域は限られる。","運転の主体は人間であり、高速道路で車線を維持しながら前の自動車に付いて走る機能のように、ハンドルと加減速の操作をシステムが支援する。","運転の主体は人間であり、自動ブレーキや急発進防止システムのように、前方又は後方の状況によって、システムが運転の一部を支援する。"],"ans":0,"why":"レベル3は運転主体がシステムに移る最初の段階。ただし限定条件下のみで、システムが継続困難と判断した場合は人間が運転を引き継ぐ必要がある。","wrong":"イは運転装置が不要でエリア限定＝レベル4。ウはハンドルと加減速の両方を支援するがドライバーが主体＝レベル2。エは運転の一部支援＝レベル1。","tip":"レベル3が分かれ目。1・2は人間が主体、3以上はシステムが主体。3だけ『いざとなったら人間が代わる』という但し書きが付く、と境界線で覚える。","year":"r7"},{"id":34,"cat":"strategy","sub":"会計・財務","prompt":"ある商品を5,000個販売したところ、売上げが6,000万円、利益が400万円となった。商品1個当たりの変動費が7,000円であるとき、利益を1,000万円以上にするためには、少なくともあと何個販売すればよいか。","opts":["500","1,200","6,200","7,500"],"ans":1,"why":"販売単価は6,000万円÷5,000個＝12,000円。1個当たりの限界利益は12,000－7,000＝5,000円。利益を400万円から1,000万円へ、600万円増やすには600万円÷5,000円＝1,200個の追加販売が必要。","wrong":"ウの6,200は利益1,000万円を達成する総販売個数（固定費2,100万円から逆算した5,000＋1,200）で、「あと何個」ではない。エの7,500は変動費や固定費の扱いを取り違えた値。アの500は限界利益の計算を誤ったもの。","tip":"損益分岐の問題は『1個売ると利益がいくら増えるか（限界利益）』を最初に出す。あとは必要な利益増÷限界利益で終わり。固定費を求める必要すらない。","year":"r7"},{"id":35,"cat":"strategy","sub":"マーケティング","prompt":"マーケティング戦略の策定プロセスのうち、自社製品の差別化ポイントを明確化するものはどれか。","opts":["セグメンテーション","ターゲティング","プロモーション","ポジショニング"],"ans":3,"why":"STP分析のうち、ポジショニングは競合と比較して自社製品をどう位置づけるか、すなわち差別化ポイントを定める工程である。","wrong":"セグメンテーションは市場の細分化、ターゲティングは狙う層の選定で、いずれも差別化そのものではない。プロモーションは4Pの一要素で販売促進活動を指す。","tip":"S→T→Pの順。切る（Segmentation）→狙う（Targeting）→位置取る（Positioning）。差別化は最後の『位置取り』の段階。","year":"r7"},{"id":36,"cat":"management","sub":"サービスマネジメント","prompt":"合意したサービス提供時間帯のうち、実際に顧客がITサービスを利用できた時間の割合で表されるものはどれか。","opts":["可用性","機能性","効率性","使用性"],"ans":0,"why":"可用性（Availability）は「使いたいときに使える度合い」。合意されたサービス時間に対する実際の稼働時間の割合として測られる。","wrong":"機能性は必要な機能を備えているか、効率性は資源に対する性能、使用性は使いやすさ。いずれも「時間の割合」で測る指標ではない。","tip":"可用性は情報セキュリティのCIAの一角でもある。『使える／使えない』の時間比率と直結するのは可用性だけ、と割り切ってよい。","year":"r7"},{"id":37,"cat":"management","sub":"サービスマネジメント","prompt":"ITサービスマネジメントに関して、次の記述中のa、bに入れる字句の適切な組合せはどれか。\n\n［　a　］はサービス提供者と顧客との間で合意されたサービス品質に関する合意書である。［　a　］の遵守状況を確認し、ITサービスの品質を維持・改善させるための活動が［　b　］である。","opts":["a：NDA／b：SCM","a：NDA／b：SLM","a：SLA／b：SCM","a：SLA／b：SLM"],"ans":3,"why":"SLA（Service Level Agreement）がサービス品質に関する合意書、SLM（Service Level Management）がその遵守を確認し維持・改善する管理活動である。","wrong":"NDAは秘密保持契約で、品質水準の合意ではない。SCMは供給連鎖管理（サプライチェーンマネジメント）で、ITサービス品質の管理活動ではない。","tip":"AがAgreement（合意書という文書）、MがManagement（回す活動）。文書と活動がセットで問われるパターンは、末尾の1文字で判定できる。","year":"r7"},{"id":38,"cat":"management","sub":"システム監査","prompt":"情報セキュリティ監査の説明として、最も適切なものはどれか。","opts":["一定の基準に基づいてITシステムの利活用に係る検証・評価を行い、ガバナンスの適切性などに対する保証や改善のための助言を行うもの","コンピュータの盗難や不正な持出しを物理的に防止し、情報セキュリティを確保するためのツール","組織体の価値及び組織体への信頼を向上させるために、組織体におけるITシステムの利活用のあるべき姿を示すIT戦略と方針の策定及びその実現のための活動","組織の情報資産に関わるリスクマネジメントが効果的に実施されているかどうかの検証又は評価"],"ans":3,"why":"情報セキュリティ監査は、情報資産に関するリスクマネジメントが有効に機能しているかを、独立した立場で検証・評価する活動である。","wrong":"アはシステム監査全般の説明で、対象がIT利活用全体でありセキュリティに限定されていない。イは物理的セキュリティ対策のツール。ウはITガバナンスの説明。","tip":"監査は必ず『検証・評価』で終わる。方針を作る（ガバナンス）、守る（対策）、確かめる（監査）の三役を混ぜないこと。","year":"r7"},{"id":39,"cat":"management","sub":"開発技術","prompt":"ソフトウェア開発モデルであるアジャイルモデルの特徴に関して、次の記述中のa、bに入れる字句の適切な組合せはどれか。\n\nアジャイルモデルとは、要件を確定してから開発を実施するウォーターフォールモデルの［　a　］する形で提唱された、［　b　］できるようにソフトウェアを開発するための手法の総称である。","opts":["a：課題を改善／b：開発工程で生じる種々の変更に迅速に対応","a：課題を改善／b：開発工程を順に実施","a：特徴を継承／b：開発工程で生じる種々の変更に迅速に対応","a：特徴を継承／b：開発工程を順に実施"],"ans":0,"why":"アジャイルは、要件を先に固めるウォーターフォールでは変更に対応しづらいという課題を改善する形で生まれ、短い反復によって変更へ迅速に対応することを狙う手法群である。","wrong":"「特徴を継承」とするウ・エは誤り。アジャイルはウォーターフォールの前提を覆す発想であって継承ではない。また「開発工程を順に実施」はウォーターフォールそのものの説明なので、イ・エも誤り。","tip":"aとbの二枠問題は、片方を先に確定させて選択肢を半分に減らす。ここではbの『変更に迅速に対応』がアジャイルだと即断でき、残るア・ウからaを判定すれば済む。","year":"r7"},{"id":40,"cat":"management","sub":"プロジェクトマネジメント","prompt":"変更管理委員会が設置されているプロジェクトで変更要求が発生した場合の記述として、最も適切なものはどれか。","opts":["変更管理委員会では、プロジェクトに関わるステークホルダ以外の第三者によって変更要求が審議される。","変更管理委員会は、コストの増加や期日の延期を理由に変更要求を却下してよい。","変更管理委員会は、スコープに変更が発生しない範囲で変更要求を受け付けなければならない。","変更要求は、全てプロジェクトマネージャが承認した後に変更管理委員会で審議される。"],"ans":1,"why":"変更管理委員会は変更要求がプロジェクトに与える影響を評価し、承認・却下を判断する。コスト増加や納期遅延といった影響が受容できないと判断すれば却下できる。","wrong":"アは審議するのはステークホルダを含む関係者であり「第三者」ではない。ウはスコープ変更を伴う要求こそ審議対象であり、受付範囲を限定する記述は誤り。エはプロジェクトマネージャの承認を経ずとも変更要求は提出・審議されるため誤り。","tip":"変更管理委員会は『門番』。通すか止めるかを決める権限を持つ。権限を狭める方向の記述（〜しかできない、〜しなければならない）は基本的に誤り。","year":"r7"},{"id":41,"cat":"management","sub":"プロジェクトマネジメント","prompt":"システム開発プロジェクトで使用される技法のうち、スケジュール作成に用いる技法として、適切なものだけを全て挙げたものはどれか。\n\na DFD（Data Flow Diagram）\nb 回帰分析\nc クリティカルパス法\nd プレシデンスダイアグラム法","opts":["a, b","a, d","b, c","c, d"],"ans":3,"why":"クリティカルパス法は最長経路から全体所要期間を求める技法、プレシデンスダイアグラム法は作業の先行後続関係を図示する技法で、どちらもスケジュール作成の代表技法である。","wrong":"DFDはデータの流れを表す業務分析・設計の図法。回帰分析は数値の相関から予測を行う統計手法。いずれも日程計画とは無関係。","tip":"スケジュール技法は『矢印で作業をつなぐ図』が特徴。アローダイアグラム、PDM、クリティカルパスは同じ仲間。データの流れの図（DFD）と取り違えないよう、矢印が『作業の順序』か『データの流れ』かで区別する。","year":"r7"},{"id":42,"cat":"management","sub":"サービスマネジメント","prompt":"床下にネットワーク配線などのために一定の高さの空間をとり、容易に取り外しが可能なパネルを床板として並べたものはどれか。","opts":["フリーアクセスフロア","フリーアドレス","フリースペース","フリースポット"],"ans":0,"why":"フリーアクセスフロア（二重床）は床板の下に配線用の空間を確保し、パネルを外して自由に配線にアクセスできる構造。サーバ室やオフィスで用いられる。","wrong":"フリーアドレスは座席を固定しない働き方。フリースペースは自由に使える空間の一般語。フリースポットは公衆無線LANの接続場所。いずれも床構造の話ではない。","tip":"Access＝配線にアクセスできる床。Address＝住所（座席）が決まっていない。同じ「フリー」でも後半の語が示す対象が全く違うので、後半で判断する。","year":"r7"},{"id":43,"cat":"management","sub":"システム監査","prompt":"営業部門の営業員が出張する際の出張旅費の手続に関して、組織間でけん制を日常的に実施している状況の記述として、最も適切なものはどれか。","opts":["営業員が出張後に経理部門に提出した旅費精算の書類と証票類について、経理担当者が適切な内容であることを審査し、経理課長が承認する。","営業員が出張後に旅費の精算を行い、上長が承認を行う。経理部門では承認済みであるので支払を行う。","営業員は出張の事前申請を行って上長の承認を得た後に、切符や宿泊施設の手配を旅行会社に依頼する。","会計年度における営業部門の旅費精算の書類と証票類から、監査人がサンプリングして営業員の処理内容の適切性を確認する。"],"ans":0,"why":"けん制とは、ある部門の処理を別の組織が独立してチェックすること。アは営業部門が作成した書類を経理部門が審査・承認しており、組織をまたいだ相互けん制が日常的に働いている。","wrong":"イは営業部門内の上長承認だけで経理は素通りしており、組織間のけん制がない。ウは同一部門内の事前承認にとどまる。エは監査人による事後の抽出検査であり、日常業務としてのけん制ではない。","tip":"けん制の判定は『部門をまたいでいるか』『日常的に全件行われているか』の二点。同じ部門内の上長承認や、後からの抜き取り監査は該当しない。","year":"r7"},{"id":44,"cat":"management","sub":"開発技術","prompt":"システム開発の早い段階で、目に見える形で利用者の要求が確認できるように確認用のソフトウェアを作成するソフトウェア開発モデルとして、最も適切なものはどれか。","opts":["アジャイル","ウォーターフォール","スパイラル","プロトタイピング"],"ans":3,"why":"プロトタイピングは試作品（プロトタイプ）を早期に作り、利用者に実際に見て触ってもらうことで要求の認識違いを防ぐ開発モデルである。","wrong":"アジャイルは短い反復で動くソフトを継続的に届ける手法群。ウォーターフォールは工程を順に進める方式で、早期の試作という発想がない。スパイラルは設計・実装・評価の反復でリスクを減らす方式で、試作品による要求確認に特化した名称ではない。","tip":"『目に見える形で』『確認用の』ときたら試作品＝プロトタイプ。プロトタイピングは要求のズレ潰しが目的、と用途で覚える。","year":"r7"},{"id":45,"cat":"management","sub":"プロジェクトマネジメント","prompt":"計画時の予算が2,000万円で、40日間で100本のプログラムを作成するプロジェクトがある。プロジェクトが20日経過した時点で全体の40%である40本のプログラムが完成し、1,000万円のコストが掛かった。次の評価式で算出する場合、プロジェクトの指標として適切な組合せはどれか。\n\nスケジュール（%）＝（完成したプログラム本数÷評価時点での完成見込みプログラム本数）×100\nコスト（%）＝（完成したプログラムに掛かったコスト÷完成したプログラム分として計画したコスト）×100","opts":["スケジュール80／コスト125","スケジュール80／コスト100","スケジュール90／コスト125","スケジュール90／コスト100"],"ans":0,"why":"20日経過時点の完成見込みは100本×(20/40)＝50本。実績40本なので40÷50×100＝80%。40本分の計画コストは2,000万円×0.4＝800万円で、実績1,000万円なので1,000÷800×100＝125%。","wrong":"コスト100%とするイ・エは、実績1,000万円を予算全体2,000万円の半分と比べてしまった誤り。比較すべきは「完成した40本分の計画コスト800万円」である。スケジュール90%とするウ・エは分母の取り方を誤ったもの。","tip":"EVMの考え方。スケジュールは100%未満なら遅れ、コストは100%超なら超過。分母を『時点の計画値』に揃えるのが唯一のコツ。","year":"r7"},{"id":46,"cat":"management","sub":"開発技術","prompt":"開発が完了したソフトウェアを本番環境にインストールする手順を明確にし、それを実施する工程として、適切なものはどれか。","opts":["ソフトウェア統合","ソフトウェア導入","妥当性確認","利用者教育"],"ans":1,"why":"ソフトウェア導入は、完成したソフトウェアを本番環境に組み込み、稼働させるための計画立案と実施を行う工程である。","wrong":"ソフトウェア統合は部品を結合してテストする工程で、本番環境への設置ではない。妥当性確認は要求どおりかを確かめる活動。利用者教育は使い方の習得支援であり、インストール作業ではない。","tip":"導入＝Installation。工程名がそのまま作業内容を表している。作る（統合）→確かめる（妥当性確認）→入れる（導入）→教える（教育）の順序で並べて覚える。","year":"r7"},{"id":47,"cat":"management","sub":"開発技術","prompt":"利用者が銀行のATMのパネルを操作して入金処理を行う。この操作の要件を定義するときに、ソフトウェア開発の品質特性である使用性を考慮すべきインタフェースとして、最も適切なものはどれか。","opts":["OSとパネルのインタフェース","ソフトウェア間のインタフェース","ハードウェアとOSのインタフェース","利用者とパネルのインタフェース"],"ans":3,"why":"使用性（ユーザビリティ）は人が使いやすいかどうかの品質特性。したがって考慮すべきは人間である利用者と画面パネルとの接点である。","wrong":"ア・イ・ウはいずれも機械同士・ソフトウェア同士の接点であり、人が介在しない。人が関わらないインタフェースに使用性という概念は適用されない。","tip":"使用性の主語は必ず人間。選択肢の中で『人』が登場するものを探せば一発で終わる。","year":"r7"},{"id":48,"cat":"management","sub":"プロジェクトマネジメント","prompt":"顧客から委託されたシステム開発プロジェクトのスコープの対象として、適切なものだけを全て挙げたものはどれか。\n\na プロジェクトで作成する成果物\nb プロジェクトで使用する市販のスケジュール管理ツール\nc プロジェクトの要求事項を顧客が記載した文書","opts":["a","a, b","b, c","c"],"ans":0,"why":"スコープはプロジェクトが提供する成果物と、それを生み出すために必要な作業の範囲を指す。aの成果物がこれに当たる。","wrong":"bの市販ツールはプロジェクトを進めるための道具であって、提供する成果物ではない。cの要求事項文書は顧客が作成したインプットであり、プロジェクトが作り出す成果物ではない。","tip":"スコープの判定は『このプロジェクトが作って納めるものか』。買ってきた道具や、もらった資料は成果物ではない。作るのか、使うのか、もらうのかで仕分ける。","year":"r7"},{"id":49,"cat":"management","sub":"サービスマネジメント","prompt":"クラウドサービスを提供するA社では、操作に関する質問に対して、サービスデスクのオペレーターが電話で対応するだけでなく、ホームページ上にFAQを公開している。サービスデスクの受付時間は午前9時から午後6時までである。このたびサービスデスクのサービスレベルを向上させるために、顧客向けのチャットボットを導入することにした。チャットボット導入の効果として、最も適切なものはどれか。","opts":["オペレーターのチャットのスキルが向上する。","オペレーターの電話対応のスキルが向上する。","問合せの受付時間を拡大することが可能になる。","ホームページ上に掲載しているFAQの内容が充実する。"],"ans":2,"why":"チャットボットはソフトウェアが自動応答するため、オペレーターの勤務時間に縛られない。結果として24時間の受付が可能になり、受付時間の拡大という効果が得られる。","wrong":"ア・イはオペレーター個人のスキルの話で、ボット導入によって自動的に向上するものではない。エのFAQ充実はボットの応答内容を整備する過程で起こり得るが、導入そのものの効果ではない。","tip":"自動化ツールの効果は『人がいない時間帯をどうするか』に現れる。受付時間、待ち時間、対応件数のいずれかに効く、と当たりを付けて選択肢を見る。","year":"r7"},{"id":50,"cat":"management","sub":"サービスマネジメント","prompt":"チャットボットの説明として、最も適切なものはどれか。","opts":["質問に対して、ソフトウェアがリアルタイムで自動応答する仕組み","センサーを搭載した機器や制御装置が直接インターネットにつながり、お互いに情報をやり取りする仕組み","人間に代わって荷物を運ぶなどの作業を行う機械的な仕組み","ルール化された定型的な操作を人間の代わりにソフトウェアが自動で行う仕組み"],"ans":0,"why":"チャットボットはChat（会話）＋Bot（ロボット）。利用者の質問に対してソフトウェアが即座に自動で応答する仕組みである。","wrong":"イはIoT。ウは物理的な搬送ロボット。エはRPAで、こちらは会話ではなく事務作業の代行である点が異なる。","tip":"同じ「ボット」でも、会話するのがチャットボット、事務作業をするのがRPA、物を運ぶのが産業用ロボット。何を代わりにやるかで三分する。","year":"r7"},{"id":51,"cat":"management","sub":"システム監査","prompt":"社内で開発及び運用を行っている経理システムの内部監査を実施するとき、システム監査人として、最も適切なものはどれか。","opts":["経理システムの運用担当者","経理システムの開発を担当した委託会社の従業員","経理システムの利用者である経理担当者","経理とITの知識を有する経営者直轄組織の従業員"],"ans":3,"why":"システム監査人には監査対象からの独立性が求められる。経営者直轄組織の従業員は開発・運用・利用のいずれにも関与しておらず、かつ必要な知識も備えているため適任である。","wrong":"ア・イ・ウはいずれも当該システムの運用・開発・利用の当事者であり、自分の仕事を自分で評価することになるため独立性を欠く。","tip":"監査人選定の問題は『その人は対象に関わっているか』の一問一答。関わっていたら全て不適格。残った一人が答えになる。","year":"r7"},{"id":52,"cat":"management","sub":"システム監査","prompt":"A社は会計システムの再構築のプロジェクトを立ち上げ、システム開発をB社に外部委託している。B社から納品される成果物の検収において、プロジェクトの品質管理に係る手続を遵守しているかどうかのシステム監査を行う監査人として、適切な者は誰か。","opts":["会計システムの再構築に関与しないA社の管理部門のリーダー","会計システムの再構築を担当するA社のプロジェクトマネージャ","会計システムの再構築を担当するB社のシステム開発リーダー","会計システムの再構築を担当するB社の品質管理責任者"],"ans":0,"why":"監査対象はA社側の検収手続であり、監査人には対象から独立した立場が必要。再構築に関与していないA社管理部門のリーダーがこれを満たす。","wrong":"イは検収手続の当事者であり自己監査になる。ウ・エはいずれも被監査側であるB社の人間で、独立性以前に立場が逆である。","tip":"監査人は『発注側の、無関係な人』。受注側（B社）を選んだ時点で誤り、発注側でも担当者を選べば誤り。二段階で絞る。","year":"r7"},{"id":53,"cat":"management","sub":"ITガバナンス","prompt":"内部統制の基本的要素の一つである\"ITへの対応\"に関する記述として、最も適切なものはどれか。","opts":["ITを活用すると業務処理を迅速化でき、不注意によるミスを全て防止できる。","既存のITの利用者の拡大や、使い方の変更などで組織目標を達成できるのであれば、新たなITシステムの導入やITシステムの更新を強いるものではない。","全ての業務プロセスをITで自動化することによって、業務プロセスを大幅に修正することが容易になる。","組織の業務がITに大きく依存すると、内部統制の目的を達成することが難しくなる。"],"ans":1,"why":"「ITへの対応」は、組織目標の達成に向けて適切にITを利用・統制することを求めるものであり、新規導入や更新を義務づけるものではない。既存のITの活用で足りるならそれでよい。","wrong":"アは「全て防止できる」が言い過ぎ。ウは全自動化が修正を容易にするとは限らず、むしろ硬直化する。エはITへの依存が内部統制を困難にするという逆向きの記述で、適切に統制すれば依存は問題にならない。","tip":"内部統制の選択肢は『全て』『必ず』『できない』といった断定表現が誤りの目印。控えめで条件付きの記述が正解になりやすい。","year":"r7"},{"id":54,"cat":"management","sub":"サービスマネジメント","prompt":"あるコールセンターでは、顧客からの電話による問合せに対応するオペレーターを支援するシステムに、顧客とオペレーターの会話の音声を認識し、顧客の問合せに対する回答の候補をオペレーターのPCの画面に表示するAIを導入した。1日の対応件数は1,000件であり、問合せ内容によって二つのグループA、Bに分けた。AI導入前後の各グループの対応件数、対応時間が次のとおりであるとき、AI導入後に、1,000件の問合せに対応する時間は何%短縮できたか。\n\nAI導入前　グループA：800件・全体の60%／グループB：200件・全体の40%\nAI導入後　グループA：800件・導入前と比べて50%短縮／グループB：200件・導入前と同じ時間","opts":["30","40","50","60"],"ans":0,"why":"導入前の全体を100とすると、Aが60、Bが40。Aが50%短縮で30になり、Bは40のまま。合計70となるので、全体では30%の短縮である。","wrong":"ウの50はグループAの短縮率をそのまま全体の短縮率としてしまった誤り。イ・エは件数比（800件＝80%）で計算してしまった誤り。短縮率は件数ではなく時間の割合で計算する。","tip":"全体を100と置いて、変わる部分だけ動かす。ここでは件数800件という数字は完全な撹乱材料で、使うのは60%と50%だけ。","year":"r7"},{"id":55,"cat":"management","sub":"プロジェクトマネジメント","prompt":"システム開発プロジェクトの開始に当たり、人的資源に関する計画書を作成することにした。この計画において、要員を適切に配置し、より良いパフォーマンスを得るために考慮すべき事項として、適切なものだけを全て挙げたものはどれか。\n\na プロジェクトに必要なスキルが要員に不足している場合は、トレーニングを計画する。\nb プロジェクトに必要なスキルよりも、要員の確保を常に優先するように計画する。\nc 要員をフレキシブルに配置するために、要員の役割と責任は、プロジェクトの計画段階では明確にせず、プロジェクトの開始後に定める。","opts":["a","a, b, c","a, c","c"],"ans":0,"why":"aのスキル不足に対するトレーニング計画は、人的資源マネジメントの基本的な施策として適切である。","wrong":"bは頭数の確保をスキルより「常に」優先するもので、必要な能力を欠いた体制ではパフォーマンスが出ない。cは役割と責任を計画段階で明確にしないという記述だが、これらは計画段階で定義するのが原則であり、曖昧なままの開始は混乱を招く。","tip":"プロジェクト計画の問題は『曖昧にする』『後で決める』『とにかく人を集める』といった記述が誤り。計画段階で明確化するのが常に正解方向。","year":"r7"},{"id":56,"cat":"technology","sub":"ネットワーク","prompt":"Bluetoothに追加された仕様の一つであり、省電力性に優れているので、IoTシステムを長期間運用でき、送受信デバイス間の距離を知ることにも使われているものはどれか。","opts":["BLE","IrDA","NFC","PLC"],"ans":0,"why":"BLEはBluetooth Low Energyの略。低消費電力で長期間の運用ができ、電波強度から距離を推定できるためビーコンなどIoT用途に広く使われる。","wrong":"IrDAは赤外線通信、NFCは数センチの近距離無線通信（交通系ICなど）、PLCは電力線を通信路として使う技術。いずれもBluetoothの仕様ではない。","tip":"Low Energy＝省電力。名前に答えが書いてある。Bluetoothの派生を問われたら、頭にBが付いているものを選ぶ。","year":"r7"},{"id":57,"cat":"technology","sub":"ネットワーク","prompt":"HTTPプロキシサーバの機能に関する記述として、適切なものはどれか。","opts":["IPアドレス割当て要求をPCから受け付けて、割り当てるグローバルIPアドレスを返す。","PCから、インターネット上のWebサーバへの接続要求を中継役として受けて、PCに代わって当該Webサーバに接続し、送受信データを中継する。","WebサーバのURLに対応するIPアドレスを求める要求をPCから受け付けて、そのIPアドレスを返す。","Webサーバのコンテンツが検索結果の上位に表示されるように、そのWebサーバが管理するコンテンツを書き換える。"],"ans":1,"why":"プロキシ（proxy）は「代理」の意。クライアントに代わってWebサーバへ接続し、通信を中継する。アクセス制御やログ取得、キャッシュにも使われる。","wrong":"アはDHCPサーバ。ウはDNSサーバ。エはSEO（検索エンジン最適化）の話で、サーバの機能ですらない。","tip":"proxy＝代理人。『代わりに行ってくる』のがプロキシ、『住所を教える』のがDNS、『住所を配る』のがDHCP。役割を一言に圧縮しておく。","year":"r7"},{"id":58,"cat":"technology","sub":"ネットワーク","prompt":"DNSの説明として、適切なものはどれか。","opts":["IPネットワークに接続しようとするコンピュータに、IPアドレスなどを自動的に割り当てるプロトコルである。","ブラウザとWebサーバ間の通信を暗号化して、セキュリティを高めるために利用されるプロトコルである。","ホスト名やドメイン名と、IPアドレスを対応付ける仕組みである。","ホスト名やドメイン名と、MACアドレスを対応付ける仕組みである。"],"ans":2,"why":"DNSはDomain Name System。人間が読めるドメイン名と、通信で使うIPアドレスとを相互に対応付ける仕組みである。","wrong":"アはDHCP。イはHTTPS（TLS）。エはIPアドレスではなくMACアドレスとしている点が誤りで、IPアドレスとMACアドレスの対応付けはARPが担う。","tip":"エのようにIPをMACに置き換えただけの引っ掛けは頻出。DNSは『名前↔IP』、ARPは『IP↔MAC』。階層が一段違う、と覚える。","year":"r7"},{"id":59,"cat":"technology","sub":"セキュリティ","prompt":"ISMSにおける内部監査に関する記述のうち、適切なものはどれか。","opts":["JIS Q 27001の要求事項及び組織自体が規定した要求事項によって定める監査基準への適合性だけでなく、ISMS活動の組織に対する有効性も判定する。","JIS Q 27001の要求事項ではなく、組織自体が規定した要求事項を監査基準とする。","内部監査の実施のためのプログラムを確立するときには、前回の内部監査の結果は考慮しない。","不定期かつ抜き打ちでの実施を原則とする。"],"ans":0,"why":"ISMSの内部監査は、規格および組織自身が定めた要求事項への「適合性」に加え、ISMSが有効に機能しているかという「有効性」も判定対象とする。","wrong":"イは規格要求事項を除外している点が誤り。ウは前回結果を考慮しないとしているが、監査プログラムの策定では前回結果や対象の重要性を考慮するのが原則。エは計画的な実施が原則であり、抜き打ちが原則ではない。","tip":"ISMSの内部監査は『適合性＋有効性』の二本立て。片方だけの選択肢は誤り。また「考慮しない」「〜だけ」といった限定表現も誤りの目印。","year":"r7"},{"id":60,"cat":"technology","sub":"ネットワーク","prompt":"TCP/IPネットワークで用いられるプロトコルであるFTPの役割として、適切なものはどれか。","opts":["正確な現在時刻を取得する。","電子メールを転送する。","ネットワーク接続に必要なIPアドレスなどの情報を自動的に割り当てる。","ファイルをPC間で転送する。"],"ans":3,"why":"FTPはFile Transfer Protocol。その名のとおりファイルを転送するためのプロトコルである。","wrong":"アはNTP、イはSMTP、ウはDHCPの役割。いずれも略語の先頭文字が対象を表しているので、綴りを展開すれば取り違えない。","tip":"プロトコル名は頭文字が全て。F＝File、S＝Simple Mail、N＝Network Time、D＝Dynamic Host。展開して日本語にすれば選択肢と一対一で対応する。","year":"r7"},{"id":61,"cat":"technology","sub":"データベース","prompt":"DBMSのトランザクションに関する記述として、適切なものはどれか。","opts":["あるデータベースの内容を他のデータベースに複製し、内容の同期をとる。","データベースに対して行った操作を、順次記録する。","データベースに対する一連の処理が全て成功したら変更結果を確定し、途中で失敗したら処理前の状態に戻す。","データベースの表の索引を作成し、検索時には索引を使用する。"],"ans":2,"why":"トランザクションは分割できない一連の処理単位。全て成功すればコミットして確定し、途中で失敗すればロールバックして処理前に戻す（原子性）。","wrong":"アはレプリケーション。イはログ（ジャーナル）の取得。エはインデックスの説明。いずれもトランザクションそのものの定義ではない。","tip":"トランザクションのキーワードは『全部やるか、全部やらないか』。銀行振込で「引き落としだけ成功して入金は失敗」が起きないようにする仕組み、と例で押さえる。","year":"r7"},{"id":62,"cat":"technology","sub":"ソフトウェア","prompt":"OSの仮想記憶方式に関する次の記述中のa〜cに入れる字句の適切な組合せはどれか。\n\nプログラムの実行時に、コンピュータの［　a　］装置の［　b　］な容量に制約されない、［　c　］なアドレス空間を提供する。","opts":["a：主記憶／b：物理的／c：論理的","a：主記憶／b：論理的／c：物理的","a：補助記憶／b：物理的／c：論理的","a：補助記憶／b：論理的／c：物理的"],"ans":0,"why":"仮想記憶は、主記憶（メモリ）の物理的な容量の制約を超えて、大きな論理的アドレス空間をプログラムに見せる方式である。足りない分は補助記憶で補う。","wrong":"制約になっているのは主記憶の容量なので、aを補助記憶とするウ・エは誤り。また実際の制約が「物理的」、提供されるのが「論理的」なので、bとcを入れ替えたイも誤り。","tip":"仮想＝論理＝見かけ、実物＝物理。『物理的な制約を、論理的な見かけで超える』という一文にまとめれば穴埋めの向きを間違えない。","year":"r7"},{"id":63,"cat":"technology","sub":"基礎理論","prompt":"データの尺度を名義尺度、順序尺度、間隔尺度、比例尺度の四つに分類したとき、間隔尺度に該当するものはどれか。","opts":["学年","血液型","時刻","睡眠時間"],"ans":2,"why":"間隔尺度は目盛りの間隔が等しく差に意味があるが、原点（ゼロ）が絶対的でないもの。時刻は差（経過時間）に意味があるが、0時は「時間がない」ことを意味しないため間隔尺度に当たる。","wrong":"血液型は分類のみの名義尺度。学年は順序に意味はあるが間隔が等しいとは限らない順序尺度。睡眠時間はゼロが「まったく寝ていない」という絶対原点を持ち、倍という比較も成り立つので比例尺度である。","tip":"間隔尺度と比例尺度の分かれ目は『ゼロが無を意味するか』。温度の摂氏や時刻はゼロでも無ではないので間隔尺度、長さ・重さ・時間の長さは比例尺度。","year":"r7"},{"id":64,"cat":"technology","sub":"ネットワーク","prompt":"WebサイトなどでRSSの表記を見かけることがある。このRSSの説明として、適切なものはどれか。","opts":["Webページの統一的なデザインやレイアウトを定義するための規格","Webページの見出しやリンク、要約などを記述するフォーマット","ネットワーク上にブックマークを登録することによって、利用価値の高いWebサイト情報を他の利用者と共有するサービス","ブラウザとWebサーバ間で、データを暗号化して安全に送受信するためのプロトコル"],"ans":1,"why":"RSSはWebサイトの更新情報（見出し・リンク・要約など）を構造化して配信するためのXMLベースのフォーマットである。","wrong":"アはCSS（スタイルシート）。ウはソーシャルブックマーク。エはHTTPS／TLS。特にアはRSSとCSSの綴りが似ているため混同しやすい。","tip":"RSSは更新情報の『お知らせ配信』、CSSは見た目の『装飾指定』。Rはリッチ／リアルタイム系、Cはカスケード＝見た目、と頭文字で分ける。","year":"r7"},{"id":65,"cat":"technology","sub":"データベース","prompt":"DBMSにおいて、データの検索を高速に行う目的で、必要に応じて設定して利用する情報はどれか。","opts":["インデックス","外部キー","主キー","スキーマ"],"ans":0,"why":"インデックス（索引）は、特定の列の値と格納位置を対応付けた情報。全件を走査せずに目的の行へ到達できるため検索が高速化する。","wrong":"外部キーは表と表を関連付けて整合性を保つための項目。主キーは行を一意に識別する項目。スキーマはデータベースの構造定義。いずれも検索高速化を目的として任意に設定するものではない。","tip":"本の巻末索引と同じ発想。『必要に応じて設定する』『高速化が目的』という二語が揃えばインデックス。主キーは高速化が目的ではなく一意性の確保が目的、と目的で切り分ける。","year":"r7"},{"id":66,"cat":"technology","sub":"データベース","prompt":"関係データベースで管理している\"ログイン記録\"表及び\"部署\"表において、ログイン結果が失敗となったことのある、又は、2022年4月10日09:00:00以前にログイン結果が成功となったことのある従業員が所属する部署名だけを全て挙げたものはどれか。\n\nログイン記録（日時／従業員番号／部署番号／結果）\n08:50:42 10004 003 失敗\n08:53:15 10004 003 成功\n08:55:48 10002 002 成功\n09:00:15 10001 001 成功\n09:01:05 10012 002 成功\n09:03:01 10008 003 成功\n09:10:28 10007 001 成功\n09:32:19 10002 002 成功\n09:39:22 10005 003 失敗\n10:00:02 10011 001 失敗\n10:05:51 10011 001 成功\n10:30:45 10009 002 成功\n\n部署　001：営業部／002：システム部／003：人事部","opts":["営業部、システム部","営業部、システム部、人事部","営業部、人事部","システム部、人事部"],"ans":1,"why":"失敗があるのは10004（003人事部）、10005（003人事部）、10011（001営業部）。09:00:00以前に成功したのは10004（003）と10002（002システム部）。合わせると001・002・003の全部署が該当する。","wrong":"ア・ウ・エはいずれも一部の条件を拾い落とした答え。特に「又は」を「かつ」と読み違えると該当が激減して誤る。09:00:15は09:00:00より後である点にも注意が必要。","tip":"条件が二つある抽出問題は、条件ごとに該当従業員を書き出してから合成する。『又は』は足し算、『かつ』は掛け算。時刻の境界（以前／より前）も必ず確認する。","year":"r7"},{"id":67,"cat":"technology","sub":"コンピュータ構成","prompt":"3次元画像処理の高速化や、動画をなめらかにするなどの機能をもつ、描画処理のためのハードウェアはどれか。","opts":["CGI","GPU","GUI","UPS"],"ans":1,"why":"GPUはGraphics Processing Unit。画像描画に特化した演算装置で、単純な並列計算が得意なため3D処理や動画処理を高速化する。","wrong":"CGIはWebサーバが外部プログラムを呼び出す仕組み。GUIはアイコンやウィンドウによる操作方式。UPSは無停電電源装置。いずれもハードウェアの描画処理装置ではない。","tip":"末尾のUがUnit＝装置。GPU、CPU、UPSのようにUで終わるものは装置、UIで終わるものは操作方式。語尾で分類できる。","year":"r7"},{"id":68,"cat":"technology","sub":"セキュリティ","prompt":"CSIRTとして行う活動の例として、最も適切なものはどれか。","opts":["OSやアプリケーションソフトウェアのセキュリティパッチを定期的に適用する。","地震や洪水などの自然災害を想定し、情報資産を守るために全社的な事業継続計画を策定する。","セキュリティ事故の発生時に影響範囲を調査して、被害拡大を防止するための対策実施を支援する。","保守業者がサーバ室で作業した日に、作業員の入退出が適切に記録されていたことを監査する。"],"ans":2,"why":"CSIRTはComputer Security Incident Response Team。名前のとおりインシデント（事故）発生時の対応が主任務で、影響範囲の調査や被害拡大防止の支援を担う。","wrong":"アは日常のシステム運用・脆弱性管理。イはBCP策定。エはシステム監査。いずれも事故発生時の対応チームの活動ではない。","tip":"CSIRTのキーワードはIncident Response＝事故対応。『起きてから動く』のがCSIRT、『起きる前に整える』のが運用や監査。時間軸で切る。","year":"r7"},{"id":69,"cat":"technology","sub":"セキュリティ","prompt":"バイオメトリクス認証の他人受入率と本人拒否率に関する次の記述中のa、bに入れる字句の適切な組合せはどれか。\n\nバイオメトリクス認証の認証精度において、他人受入率を低く抑えようとすると［　a　］が高くなり、本人拒否率を低く抑えようとすると［　b　]が高くなる。","opts":["a：安全性／b：可用性","a：安全性／b：利便性","a：利便性／b：安全性","a：利便性／b：可用性"],"ans":1,"why":"他人受入率を下げる＝判定を厳しくすることなので安全性が高まる。逆に本人拒否率を下げる＝判定を緩めることなので、本人がスムーズに通れる利便性が高まる。","wrong":"アとエは可用性としているが、ここで問われているのは使い勝手であり利便性が適切。ウはaとbを逆にした答えで、厳しくすれば安全、緩くすれば便利という関係を取り違えている。","tip":"厳しくすれば安全だが不便、緩くすれば便利だが危険。このトレードオフは全てのセキュリティ問題に共通する。二つの率のどちらを下げようとしているかだけ見ればよい。","year":"r7"},{"id":70,"cat":"technology","sub":"セキュリティ","prompt":"情報セキュリティにおける脅威のうち、脆弱性を是正するセキュリティパッチをソフトウェアに適用することが最も有効な対策になるものはどれか。","opts":["総当たり攻撃","ソーシャルエンジニアリング","パスワードリスト攻撃","バッファオーバーフロー"],"ans":3,"why":"バッファオーバーフローはプログラムの実装上の欠陥（脆弱性）を突く攻撃であり、修正プログラムを適用してその欠陥を塞ぐことが最も直接的な対策になる。","wrong":"総当たり攻撃とパスワードリスト攻撃はいずれもパスワードを狙うもので、対策はアカウントロックや多要素認証。ソーシャルエンジニアリングは人を騙す手口で、対策は教育や運用ルール。どれもソフトウェアの修正では防げない。","tip":"パッチが効くのは『プログラムのバグが原因の攻撃』だけ。パスワード狙いや人間狙いの攻撃は、いくらパッチを当てても防げない。原因がどこにあるかで判断する。","year":"r7"},{"id":71,"cat":"technology","sub":"ネットワーク","prompt":"携帯電話で用いられる電波に関する次の記述中のa、bに入れる字句の適切な組合せはどれか。\n\n電波には、周波数が［　a　］ほど回り込みやすくなり障害物の裏にも届きやすいという性質がある。日本国内の携帯電話で使用される周波数のうち、700［　b　］帯〜900［　b　］帯の周波数帯域はこの性質をもちつながりやすいことなどから、プラチナバンドと呼ばれている。","opts":["a：高い／b：GHz","a：高い／b：MHz","a：低い／b：GHz","a：低い／b：MHz"],"ans":3,"why":"周波数が低いほど波長が長く、障害物を回り込む回折が起きやすい。700〜900の単位はMHzであり、この帯域がプラチナバンドと呼ばれる。","wrong":"aを「高い」とするア・イは物理的性質を逆に取っている。bをGHzとするア・ウは単位が三桁ずれており、700GHzは携帯電話の帯域として現実的でない。","tip":"低い周波数＝波長が長い＝回り込む＝遠くまで届く。高い周波数＝直進性が強い＝速いが届きにくい。5Gが高速だが電波が届きにくいのはこの性質による。","year":"r7"},{"id":72,"cat":"technology","sub":"UI/UX","prompt":"見る人に意図が伝わりやすいデザインにするための四つの原則に関する次の記述中のa、bに入れる字句の適切な組合せはどれか。\n\n近接：互いに関連する要素は近づけてグループにする。\n［　a　］：要素を意図したルールに基づき配置する。\n反復：要素ごとにデザインルールを繰り返す。\n［　b　］：要素ごとの大小や強弱などの違いを明確にする。","opts":["a：整列／b：価値","a：整列／b：対比","a：操作／b：価値","a：操作／b：対比"],"ans":1,"why":"デザインの四原則は近接・整列・反復・対比。「ルールに基づき配置する」が整列、「大小や強弱の違いを明確にする」が対比に対応する。","wrong":"「操作」「価値」はいずれも四原則に含まれない語。四原則を暗記していれば、選択肢に混ざった余計な語をその場で排除できる。","tip":"四原則は近接・整列・反復・対比。頭文字で『きん・せい・はん・たい』と唱えて覚える。整列は位置、対比は目立ち方、と担当を分ける。","year":"r7"},{"id":73,"cat":"technology","sub":"セキュリティ","prompt":"Webサービスを狙った攻撃に関する記述と攻撃の名称の適切な組合せはどれか。\n\na Webサービスが利用しているソフトウェアに脆弱性の存在が判明したとき、その修正プログラムが提供される前に、この脆弱性を突いて攻撃する。\nb 複数のコンピュータから大量のパケットを一斉に送り付けることによって、Webサービスを正常に提供できなくさせる。\nc 理論的にあり得るパスワードのパターンを順次試すことによって、正しいパスワードを見つけ、攻撃対象のWebサービスに侵入する。","opts":["a：DDoS攻撃／b：ゼロデイ攻撃／c：ブルートフォース攻撃","a：DDoS攻撃／b：ブルートフォース攻撃／c：ゼロデイ攻撃","a：ゼロデイ攻撃／b：DDoS攻撃／c：ブルートフォース攻撃","a：ゼロデイ攻撃／b：ブルートフォース攻撃／c：DDoS攻撃"],"ans":2,"why":"aは修正プログラム提供前を突くゼロデイ攻撃、bは複数拠点からの大量パケットによるDDoS攻撃、cはパスワードの総当たりであるブルートフォース攻撃。","wrong":"ア・イ・エはいずれも組合せが入れ替わっている。「複数のコンピュータから」という記述はDDoSの決定的な特徴（単一ならDoS）なので、bさえ確定できれば選択肢は絞れる。","tip":"組合せ問題は一番自信のあるものから確定させる。bの『複数から大量パケット』＝DDoSは判別しやすいので、ここを起点に消去すれば残るのは一つ。","year":"r7"},{"id":74,"cat":"technology","sub":"セキュリティ","prompt":"デジタルフォレンジックスの説明として、適切なものはどれか。","opts":["コンピュータに関する犯罪や法的紛争が生じた際に、コンピュータから削除された電子メールを復元するなどして、証拠を収集し保全すること","システムを実際に攻撃して脆弱性の有無を調べること","通信経路を暗号化するなどして、公衆回線をあたかも専用回線であるかのように利用すること","電子メールやファイルなどのハッシュデータを本人の秘密鍵で暗号化すること"],"ans":0,"why":"フォレンジックス（forensics）は法科学・鑑識の意。デジタルフォレンジックスは、法的手続で用いるためにデジタル証拠を収集・保全・分析する活動を指す。","wrong":"イはペネトレーションテスト。ウはVPN。エはデジタル署名の生成手順。いずれも証拠の収集・保全とは目的が異なる。","tip":"forensic＝法廷の。海外ドラマの『科学捜査』がそのままデジタル版になったもの、と結び付けると忘れない。キーワードは『証拠』『保全』。","year":"r7"},{"id":75,"cat":"technology","sub":"コンピュータ構成","prompt":"次の記憶媒体のうち、記憶素子として半導体メモリを用いているものだけを全て挙げたものはどれか。\n\na CD-ROM　b DVD-RAM　c RAM　d SSD　e USBメモリ","opts":["a, b, c","a, b, e","c, d, e","c, e"],"ans":2,"why":"RAM、SSD、USBメモリはいずれも半導体（フラッシュメモリやDRAM）を記憶素子とする。SSDが半導体である点がHDDとの決定的な違いである。","wrong":"CD-ROMとDVD-RAMは光学ディスクで、レーザ光による読み書きを行う光記憶媒体。名称にRAMが付くDVD-RAMは紛らわしいが、これは書き換え可能という意味であり半導体ではない。","tip":"媒体は三分類。半導体（RAM・SSD・USBメモリ・SDカード）、磁気（HDD・磁気テープ）、光（CD・DVD・BD）。DVD-RAMの『RAM』に釣られないこと。","year":"r7"},{"id":76,"cat":"technology","sub":"表計算","prompt":"商品の税込価格を計算する表計算のワークシートがある。セルB1には消費税率が入力されており、セルB4〜B6には税抜価格が入力されている。セルC4〜C6に税込価格を表示するために、セルC4に式を入力し、セルC5、C6に複写する。セルC4に入力する式はどれか。ここで、セルB1は、パーセント形式で表示している。\n\nB1：消費税率10%\nB4：200（商品X）／B5：500（商品Y）／B6：100（商品Z）","opts":["B$4＊(1＋B$1)","B$4＊(1＋B1)","B4＊(1＋B$1)","B4＊(1＋B1)"],"ans":2,"why":"税抜価格B4は下方向の複写に合わせてB5、B6へずれる必要があるので相対参照。消費税率B1は常に同じセルを参照するため行を固定した絶対参照B$1にする。","wrong":"ア・イはB$4として税抜価格まで固定しているため、複写しても全て商品Xの価格を参照してしまう。エはB1を相対参照にしているため、複写するとB2、B3という空白セルを参照してしまう。","tip":"複写の問題は『動いてほしいセル』と『動いてほしくないセル』を先に仕分ける。動かしたくない方だけに＄を付ける。縦に複写するなら行番号側に＄。","year":"r7"},{"id":77,"cat":"technology","sub":"セキュリティ","prompt":"ネットワークやホストを監視することによって、不正アクセスや不審な通信を発見し、報告する仕組みはどれか。","opts":["DMZ","IDS","アンチパスバック","ボット"],"ans":1,"why":"IDSはIntrusion Detection System（侵入検知システム）。通信を監視して不正を検知し管理者に通知するが、遮断までは行わない。","wrong":"DMZは外部公開サーバを置く緩衝領域。アンチパスバックは入退室管理で共連れを防ぐ仕組み。ボットは遠隔操作される不正プログラム。いずれも通信監視・検知の仕組みではない。","tip":"Dが検知（Detection）でIDS、Pが防御（Prevention）でIPS。問題文に『発見し、報告する』とあれば検知どまりのIDS、『遮断する』とあればIPS。","year":"r7"},{"id":78,"cat":"technology","sub":"アルゴリズム","prompt":"手続calcMod3を呼び出したときの出力はどれか。\n\n○calcMod3()\n　整数型: totalValue, i\n　totalValue ← 0\n　for (i を 1 から 7 まで 1 ずつ増やす)\n　　if (i ÷ 3 の余り が 0 と等しい)\n　　　totalValue ← totalValue + i\n　　endif\n　endfor\n　totalValue を出力する","opts":["2","3","7","9"],"ans":3,"why":"1〜7のうち3で割った余りが0になるのは3と6。totalValueは3＋6＝9となる。","wrong":"アの2は該当する個数（2個）を答えてしまった誤り。イの3は最初に見つかった3だけを答えたもの。ウの7はループの上限値をそのまま答えたもの。何を出力しているかを取り違えるのが典型ミス。","tip":"擬似言語は必ず表を書いて追う。iを1から順に並べ、条件を満たすかと変数の値を書き込むだけ。ここでは3と6に丸を付けて足せば終わり。","year":"r7"},{"id":79,"cat":"technology","sub":"UI/UX","prompt":"サムネイルの説明として、適切なものはどれか。","opts":["画像や文書ファイルの内容を縮小して表示したもの","処理の内容や対象が分かる小さな絵や記号のこと","ネット上で利用者の分身として動作するキャラクターのこと","複数のファイルを一つのファイルにまとめたもの"],"ans":0,"why":"サムネイル（thumbnail＝親指の爪）は、画像や文書の内容が一目で分かるよう縮小表示したもの。一覧性を高める目的で用いられる。","wrong":"イはアイコン。ウはアバター。エはアーカイブ。特にアイコンとの違いは、サムネイルが「中身そのものを縮小したもの」であるのに対し、アイコンは「中身を象徴する記号」である点。","tip":"thumb＝親指、nail＝爪。親指の爪ほどの大きさ、が語源。中身が見えるのがサムネイル、中身を表す絵がアイコン、と『実物か記号か』で分ける。","year":"r7"},{"id":80,"cat":"technology","sub":"AI","prompt":"AIにおいて、広範囲かつ大量のデータで訓練されたものであり、ファインチューニングなどによって文章生成AIのような様々な用途に適応できる特徴をもつものを何というか。","opts":["アノテーション","エキスパートシステム","基盤モデル","畳み込みニューラルネットワーク"],"ans":2,"why":"基盤モデル（Foundation Model）は大規模データで事前学習された汎用モデルで、微調整（ファインチューニング）によって多様な用途へ転用できる。","wrong":"アノテーションは学習データへのラベル付け作業。エキスパートシステムはルールベースの古典的AI。畳み込みニューラルネットワークは画像認識に強い特定のネットワーク構造で、汎用の土台という位置づけではない。","tip":"Foundation＝土台。土台を一つ作って、用途ごとに上物を建てる。生成AIの多くがこの構造、という理解で十分。","year":"r7"},{"id":81,"cat":"technology","sub":"コンピュータ構成","prompt":"イメージスキャナーで読み取った紙の書類の画像から、印刷文字や手書きの文字を読み取り、テキストデータに変換する技術を何と呼ぶか。","opts":["CCD","DVI","GPU","OCR"],"ans":3,"why":"OCRはOptical Character Recognition（光学的文字認識）。画像中の文字を読み取ってテキストデータに変換する技術である。","wrong":"CCDはスキャナーやカメラで光を電気信号に変える撮像素子で、画像を取り込むところまでが役割。DVIは映像出力の接続規格。GPUは描画用の演算装置。","tip":"Character Recognition＝文字認識。似た略語にOMR（マークシート読取）がある。Cが文字、Mがマーク、と真ん中の1文字で区別する。","year":"r7"},{"id":82,"cat":"technology","sub":"データベース","prompt":"あるコンピュータのデータベースの内容を他のコンピュータのデータベースに複製して、両者の内容が一致するように同期させるDBMSの機能はどれか。","opts":["アーカイブ","バックアップ","レプリケーション","ロールバック"],"ans":2,"why":"レプリケーション（replication＝複製）は、複数のデータベース間で内容を複製し同期を保つ機能。負荷分散や可用性向上に用いられる。","wrong":"アーカイブは長期保存のための書庫化。バックアップは障害に備えた退避コピーで、常時同期させる仕組みではない。ロールバックはトランザクション失敗時に処理前へ戻す操作。","tip":"バックアップは『過去の一時点を保存』、レプリケーションは『今この瞬間を同期』。時間軸で切ると混同しない。","year":"r7"},{"id":83,"cat":"technology","sub":"セキュリティ","prompt":"ISMSの運用にPDCAモデルを採用している組織において、サーバ監視に関する次の作業を実施する。各作業とPDCAモデルの各フェーズの組合せとして、適切なものはどれか。\n\n(1) サーバ監視の具体的な目的及び手順を定める。\n(2) サーバ監視の作業内容を第三者が客観的に評価する。\n(3) 定められている手順に従ってサーバを監視する。\n(4) 発見された問題点の是正処置として、サーバの監視方法を変更する。","opts":["P:(1) D:(2) C:(3) A:(4)","P:(1) D:(2) C:(4) A:(3)","P:(1) D:(3) C:(2) A:(4)","P:(1) D:(3) C:(4) A:(2)"],"ans":2,"why":"目的と手順を定める(1)がPlan、手順に従って実行する(3)がDo、第三者が客観的に評価する(2)がCheck、是正処置として方法を変更する(4)がActとなる。","wrong":"ア・イは(2)の評価をDoに置いている点が誤り。エは(4)の是正処置をCheckに、(2)の評価をActに置いており、評価と改善が逆転している。","tip":"PDCAの判定語は決まっている。Plan＝定める、Do＝実施する、Check＝評価する・確認する、Act＝改善する・変更する。動詞だけ見れば割り振れる。","year":"r7"},{"id":84,"cat":"technology","sub":"セキュリティ","prompt":"ISMSにおける情報セキュリティ方針に関する記述として、適切なものはどれか。","opts":["機密事項が記載されているので、伝達する範囲を社内に限定する必要がある。","情報セキュリティ対策は一度実施したら終わりではないので、ISMSを継続的に改善するコミットメントを含める必要がある。","部門の特性に応じて最適化するので、ISMSを適用する組織全体ではなく、部門ごとに定める必要がある。","ボトムアップを前提としているので、各職場の管理者によって承認される必要がある。"],"ans":1,"why":"情報セキュリティ方針には、要求事項を満たすこと、およびISMSを継続的に改善することへのコミットメント（約束）を含めることが求められる。","wrong":"アは方針自体は具体的な機密を書くものではなく、必要に応じて外部にも公開される。ウは組織全体で一貫した方針を定めるのが原則。エは経営陣がトップダウンで承認・表明するものであり、ボトムアップではない。","tip":"ISMSの方針はトップマネジメントが定めて周知するもの。『経営者が決める』『組織全体』『継続的改善』の三点が揃うものが正解になる。","year":"r7"},{"id":85,"cat":"technology","sub":"AI","prompt":"問題を解いて解答群の中から正解を選ぶ、あるAIシステムがある。このシステムは、1回の学習の過程を経るごとに、学習の過程の前後の比較において、誤り率が5%低下する（前回の誤り率の95%になる）。現在の正解率が30%であるとき、正解率が35%を超えるためには、少なくともあと何回の学習の過程が必要か。","opts":["1","2","3","4"],"ans":1,"why":"現在の誤り率は70%。1回目は70×0.95＝66.5%で正解率33.5%、まだ35%に届かない。2回目は66.5×0.95＝63.175%で正解率36.825%となり35%を超える。したがって2回。","wrong":"アの1回では正解率33.5%で条件を満たさない。ウ・エは必要以上の回数。なお「正解率が5%上がる」と読み違えると1回で35%に達すると誤答する。低下するのは誤り率である点が要点。","tip":"『誤り率が5%低下』は『誤り率が0.95倍になる』という意味。正解率ではなく誤り率に掛け算する、という一点さえ外さなければ電卓なしで解ける。","year":"r7"},{"id":86,"cat":"technology","sub":"AI","prompt":"動物が写っている大量の画像から犬や猫などの特徴を自動的に抽出して、動物の種類を識別できるようにするAIの技術はどれか。","opts":["e-ラーニング","アクティブラーニング","アダプティブラーニング","ディープラーニング"],"ans":3,"why":"ディープラーニングは多層ニューラルネットワークにより、人が特徴を指定しなくてもデータから特徴量を自動的に抽出できる点が最大の特徴である。","wrong":"e-ラーニング、アクティブラーニング、アダプティブラーニングはいずれも人間の学習方法に関する用語であり、AIの技術ではない。","tip":"『特徴を自動的に抽出』はディープラーニングの決め台詞。従来の機械学習は人が特徴を指定していた、という対比で覚えると効く。","year":"r7"},{"id":87,"cat":"technology","sub":"セキュリティ","prompt":"PKIにおいて、ある条件に当てはまるデジタル証明書の情報が公開されているリストとしてCRLがある。このリストに掲載される条件として、適切なものはどれか。","opts":["有効期間が満了している。","有効期間が無期限である。","有効期間内に失効している。","有効期間を延長している。"],"ans":2,"why":"CRLはCertificate Revocation List（証明書失効リスト）。秘密鍵の漏えいなどにより、有効期間内であるにもかかわらず失効させられた証明書が掲載される。","wrong":"アの有効期間満了はそもそも期限切れとして無効と判断できるため、わざわざリストに載せる必要がない。イ・エのような証明書は運用上存在しない。","tip":"Revocation＝取消し。『期限切れ』ではなく『期限内なのに取り消された』ものを載せるのがCRL。期限切れは日付を見れば分かるから載せない、という理屈で押さえる。","year":"r7"},{"id":88,"cat":"technology","sub":"セキュリティ","prompt":"情報セキュリティ対策を、\"技術的セキュリティ対策\"、\"人的セキュリティ対策\"及び\"物理的セキュリティ対策\"に分類したとき、\"物理的セキュリティ対策\"の例として、適切なものはどれか。","opts":["業務に関係のない掲示板やSNSなどへの従業員による書込み、閲覧を防止するために、Webサーバへのアクセスログを取得し、必要に応じて通信を遮断する。","サーバ室、執務室などの場所ごとにセキュリティレベルを設定し、従業員ごとのアクセス権が付与されたICカードで入退室管理を行う。","従業員の採用時には、守秘義務に関する契約書を取り交わし、在籍中は機密情報の取扱いに関する教育、啓発を実施する。","退職者が、在籍中のアカウントを用いた不正アクセスを行わないように、従業員の退職時にアカウントを削除する。"],"ans":1,"why":"物理的対策は建物・設備・機器といった実体を対象とする。ICカードによる入退室管理は、人の物理的な出入りを制御する典型例である。","wrong":"アはログ取得と通信遮断で技術的対策。ウは契約と教育で人的対策。エはアカウント削除というシステム上の操作で技術的対策に当たる。","tip":"三分類の判定は『何を触っているか』。扉や鍵や部屋なら物理的、設定やソフトなら技術的、人の意識やルールなら人的。","year":"r7"},{"id":89,"cat":"technology","sub":"セキュリティ","prompt":"Aさんは、Bさんから次の4種類のメッセージを受け取った。Aさんが、受け取ったメッセージを復号して読むことができるものだけを全て挙げたものはどれか。\n\na AさんとBさんとの共通鍵で暗号化したメッセージ\nb Aさんの公開鍵で暗号化したメッセージ\nc Bさんの公開鍵で暗号化したメッセージ\nd Bさんの秘密鍵で暗号化したメッセージ","opts":["a, b, d","a, c, d","b, d","c, d"],"ans":0,"why":"aは共通鍵をAさんも持つので復号できる。bはAさんの公開鍵で暗号化されており、対になるAさんの秘密鍵で復号できる。dはBさんの秘密鍵で暗号化されており、公開されているBさんの公開鍵で復号できる。","wrong":"cはBさんの公開鍵で暗号化されているため、復号にはBさんの秘密鍵が必要。AさんはBさんの秘密鍵を持たないので読めない。よってcを含むイ・エは誤り。ウはaとbを落とした答え。","tip":"公開鍵暗号の鉄則は『対になる鍵でしか開かない』。まず暗号化に使った鍵の持ち主を確認し、その相方の鍵をAさんが持っているかを一件ずつ判定する。","year":"r7"},{"id":90,"cat":"technology","sub":"セキュリティ","prompt":"無線LANのセキュリティ対策に関する記述として、適切なものはどれか。","opts":["APIは、複数のアクセスポイントをグループ化して管理するIDである。","SSHは、アクセスポイントをステルス化することで無線LANネットワークを隠蔽する機能である。","VPNは、アクセスポイントに登録したMACアドレスをもつ機器以外からの接続を拒否する機能である。","WPA2は、WEPよりも高い信頼性をもつ、無線通信の暗号化技術である。"],"ans":3,"why":"WPA2は無線LANの暗号化規格で、脆弱性が判明した旧規格WEPを置き換えるものとして高い安全性をもつ。","wrong":"アはESSIDの説明にAPIという別の語を当てたもの（APIはソフトウェア間の接続仕様）。イはSSHの説明ではなくSSIDステルスの説明。ウはVPNではなくMACアドレスフィルタリングの説明。","tip":"無線LANの略語は綴りが似ていて紛らわしい。SSIDは名前、SSHは遠隔操作、WEP／WPA／WPA2は暗号化、と役割ごとに分類しておく。暗号化の強さはWEP＜WPA＜WPA2＜WPA3。","year":"r7"},{"id":91,"cat":"technology","sub":"セキュリティ","prompt":"情報セキュリティのリスクマネジメントにおけるリスク対応を、リスク移転、リスク回避、リスク低減及びリスク保有の四つに分けて実施することにしたとき、これらに関する記述として、適切なものはどれか。","opts":["リスク対応の実施手順であり、リスク回避、リスク移転、リスク低減、リスク保有の順番で進める。","リスク対応の実施手順であり、リスク保有、リスク低減、リスク移転、リスク回避の順番で進める。","リスク対応の選択肢であり、管理対象としたリスクの顕在化に備えて保険を掛けておくことは、リスク回避に該当する。","リスク対応の選択肢であり、ノートPCの紛失や盗難に備えて社外への持出しをより厳重に管理することは、リスク低減に該当する。"],"ans":3,"why":"リスク低減は、対策を講じて発生確率や影響度を下げること。持出しの管理を厳しくすることで紛失・盗難の発生可能性を下げるので、リスク低減に該当する。","wrong":"ア・イは四つを実施手順（順番）としている点が誤りで、これらは並列の選択肢である。ウの保険を掛ける行為は損失を保険会社に移すのでリスク移転（共有）に当たり、リスク回避ではない。","tip":"四つの区別は一言で。回避＝やめる、移転＝他人に預ける、低減＝小さくする、保有＝受け入れる。保険は必ず移転、と結び付けておく。","year":"r7"},{"id":92,"cat":"technology","sub":"セキュリティ","prompt":"従業員が使用するPCがランサムウェアに感染した場合の損害を軽減する対策例として、適切なものはどれか。","opts":["PCが接続するファイルサーバのHDDのバックアップデータを定期的に取得し、ネットワークから切り離して保管する。","PCに多要素認証の仕組みを導入する。","PCのHDDを暗号化する。","PCへのログイン時に、パスワードを複数回間違えたら、当該IDをロックする。"],"ans":0,"why":"ランサムウェアはデータを暗号化して身代金を要求する。バックアップをネットワークから切り離して保管しておけば、暗号化の被害を免れて復旧でき、損害を軽減できる。","wrong":"イ・エは不正ログイン対策であり、感染後の被害軽減にはならない。ウのHDD暗号化は紛失・盗難時の情報漏えい対策で、ランサムウェアによる暗号化を防ぐものではない。","tip":"ランサムウェア対策の答えはほぼ常にバックアップ。しかも『ネットワークから切り離す』が付いていることが要点。つながったままだとバックアップごと暗号化される。","year":"r7"},{"id":93,"cat":"technology","sub":"セキュリティ","prompt":"情報セキュリティにおける脅威の説明として、適切なものはどれか。","opts":["攻撃者が付け込むことのできる情報システムの弱点","情報資産が被害に遭う確率と被害規模の組合せ","情報資産に損害を与える原因となるもの","情報システムの弱点を利用した攻撃によって被害を受ける可能性"],"ans":2,"why":"脅威は、情報資産に損害を与える原因となる事象や存在そのものを指す。マルウェア、不正アクセス、自然災害、人的ミスなどが該当する。","wrong":"アは脆弱性の説明。イとエはリスクの説明で、リスクは脅威が脆弱性を突いて損害が生じる可能性の大きさを表す。","tip":"三語の関係を一文で。『脅威が脆弱性を突くと、リスクが顕在化する』。原因が脅威、弱点が脆弱性、起こりうる度合いがリスク。","year":"r7"},{"id":94,"cat":"technology","sub":"システム構成","prompt":"稼働率0.9の装置で並列システムを構成したい。このシステムの稼働率を0.999とするためには、最低何台の装置で並列システムを構成する必要があるか。ここで、並列システムを構成したときに、少なくとも1台の装置が稼働していればシステムは正常に稼働しているものとする。","opts":["2","3","4","5"],"ans":1,"why":"並列システムが停止するのは全台が同時に故障したときだけ。1台の故障率は0.1なので、n台なら停止確率は0.1のn乗。稼働率0.999は停止確率0.001＝0.1の3乗に相当するため3台。","wrong":"アの2台では停止確率0.01となり稼働率0.99にしかならず不足。ウ・エは要求を満たすが「最低何台」という条件に対して過剰である。","tip":"並列は『全部壊れたら終わり』なので故障率を掛け算する。0.1を掛けるたびに9が一つ増える、と覚えれば桁数を数えるだけで答えが出る。","year":"r7"},{"id":95,"cat":"technology","sub":"データベース","prompt":"データベース設計におけるデータ分析で行うこととして、適切なものはどれか。","opts":["データウェアハウスから業務ごとに必要な情報を抽出する。","データ項目の内容が、指定された条件を満足する行だけを抽出する。","必要なデータ項目を洗い出し、項目間の関連を整理する。","膨大な情報から統計的手法などを用いて、ビジネスに活用できる情報を探索する。"],"ans":2,"why":"データベース設計におけるデータ分析は、業務に必要なデータ項目を洗い出し、項目同士の関連（リレーション）を整理してデータモデルを作る作業を指す。","wrong":"アはデータマート作成。イは関係演算の選択（selection）操作。エはデータマイニング。いずれも既にデータベースがある前提の運用・活用の話であり、設計工程ではない。","tip":"『設計』の工程なのか『運用・活用』の段階なのかで切る。まだ箱がない段階の作業は、項目の洗い出しと関連の整理しかありえない。","year":"r7"},{"id":96,"cat":"technology","sub":"法務・OSS","prompt":"OSS（Open Source Software）に関する次の記述のうち、適切なものだけを全て挙げたものはどれか。\n\na 個人だけではなく、企業や団体が開発したソフトウェアもある。\nb 著作権が放棄されている。\nc 入手したソフトウェアは、自由に再配布してもよい。","opts":["a, b","a, b, c","a, c","b, c"],"ans":2,"why":"aは正しく、企業や団体が主導するOSSは数多い。cも正しく、再配布の自由はOSSの定義に含まれる。","wrong":"bが誤り。OSSは著作権を放棄しているのではなく、著作権を保持したうえでライセンスによって利用・改変・再配布を許諾している。放棄していないからこそライセンス条件に従う義務が生じる。よってbを含むア・イ・エは誤り。","tip":"OSSは『著作権あり、ただし条件付きで自由』。著作権放棄（パブリックドメイン）とは別物。この一点だけで大半のOSS問題が解ける。","year":"r7"},{"id":97,"cat":"technology","sub":"セキュリティ","prompt":"情報セキュリティにおいて、可用性が損なわれた事象だけを全て挙げたものはどれか。\n\na 関連取引先との電子決済システムがDoS攻撃を受け、処理ができなくなった。\nb 顧客情報管理システムの顧客情報が誤った内容のまま運用されていた。\nc 社内のサーバに不正侵入されて、社外秘の情報が漏えいした。","opts":["a","a, b","b, c","c"],"ans":0,"why":"可用性は「使いたいときに使える」性質。DoS攻撃で処理ができなくなったaは、まさに可用性が損なわれた事象である。","wrong":"bは情報の内容が正しくない状態なので完全性の侵害。cは機密情報が外部に漏れたので機密性の侵害。CIAのどれに当たるかを取り違えるのが典型ミス。","tip":"CIAの判定は結果で。使えなくなった→可用性、書き換わった／間違っている→完全性、見られた／漏れた→機密性。動詞で振り分ける。","year":"r7"},{"id":98,"cat":"technology","sub":"アルゴリズム","prompt":"4個の要素から成るデータの並びを、次の手順を繰り返して昇順に整列するとき、整列が終了するまでに(1)から(3)の一連の手順は、何回実行されるか。ここで、最初はデータの並び全体を整列対象とする。\n\nデータの並び：[27, 42, 33, 12]\n\n(1) 整列対象中の要素の最大の値を選び、最後の要素と入れ替える。\n(2) 最後の要素を整列対象から外す。\n(3) 整列対象に要素が1個以上残っていれば、(1)から(3)の一連の手順を実行する。残っていなければ、整列完了なので終了する。","opts":["2","3","4","5"],"ans":2,"why":"1回目：対象4個で42を最後と交換し外す（残3個）。2回目：33を交換し外す（残2個）。3回目：27を交換し外す（残1個）。1個以上残っているので4回目を実行し、12を外して残0個となり終了。よって4回。","wrong":"イの3回は、残り1個になった時点で終了と判断した誤り。手順(3)は「1個以上残っていれば実行する」なので、最後の1個についても手順を実行する必要がある。","tip":"終了条件の文言を必ず読む。『1個以上残っていれば』なのか『2個以上残っていれば』なのかで答えが1回変わる。要素数が少ないので、実際に並びを書き出して数えるのが確実。","year":"r7"},{"id":99,"cat":"technology","sub":"アルゴリズム","prompt":"関数calculateAmountOfPrizeは、業務改善の効果における改善額と短縮期間を、それぞれimprovementとperiodで受け取り、賞金額を戻り値とする。改善額が20万円で短縮期間が3日の業務改善と、改善額が5万円で短縮期間が14日の業務改善があった。この二つの賞金額の合計は何円か。\n\n○整数型: calculateAmountOfPrize(整数型: improvement, 整数型: period)\n　整数型: prize\n　if (improvement が 100000 より小さい)\n　　if (period が 7 より小さい)\n　　　prize ← 500\n　　else\n　　　prize ← 1000\n　　endif\n　else\n　　if (period が 7 より小さい)\n　　　prize ← 2000\n　　else\n　　　prize ← 5000\n　　endif\n　endif\n　return prize","opts":["1,000","1,500","3,000","5,500"],"ans":2,"why":"1件目は改善額200,000（100,000以上）かつ期間3日（7未満）なので2,000円。2件目は改善額50,000（100,000未満）かつ期間14日（7以上）なので1,000円。合計3,000円。","wrong":"アの1,000は2件目だけを答えたもの。イの1,500は分岐を取り違えて500＋1,000としたもの。エの5,500は最も内側の分岐を誤って5,000＋500としたもの。","tip":"二重の分岐は2×2の表を書く。縦に改善額の大小、横に期間の長短を取り、4マスに500／1000／2000／5000を埋めてから該当マスを読む方が速くて安全。","year":"r7"},{"id":100,"cat":"technology","sub":"セキュリティ","prompt":"個人の認証に用いる要素を、知識、所有物及びバイオメトリクスの三つに分類したとき、所有物を要素として用いた認証の例はどれか。","opts":["SMSを用いた認証","虹彩の特徴を用いた認証","筆跡や筆圧、スピードなど、文字を書くときの特徴を用いた認証","本人が事前に設定した質問とそれに対する答えを用いた認証"],"ans":0,"why":"SMS認証は本人が所持するスマートフォンにコードを送る方式であり、「持っているもの」を根拠とする所有物認証に当たる。","wrong":"イの虹彩とウの筆跡はいずれも身体的・行動的特徴によるバイオメトリクス認証。エの秘密の質問は本人しか知らない情報なので知識認証。","tip":"三要素は『知っているもの・持っているもの・その人自身』。スマホやICカード、トークンが出てきたら所有物、体の特徴やクセなら生体、頭の中の情報なら知識。","year":"r7"},{"id": 1, "cat": "strategy", "sub": "マーケティング", "prompt": "マーケティングオートメーション（MA）に関する記述として、最も適切なものはどれか。", "opts": ["企業内に蓄積された大量のデータを分析して、事業戦略などに有効活用する。", "小売業やサービス業において、販売した商品単位の情報の収集・蓄積及び分析を行う。", "これまで人間が手作業で行っていた定型業務を、AIや機械学習などを取り入れたソフトウェアのロボットが代行することによって自動化や効率化を図る。", "見込み顧客の抽出、獲得、育成などの営業活動を効率化する。"], "ans": 3, "tip": "Marketing Automation＝マーケティング活動の自動化。キーワードは「見込み顧客（リード）」。この語が出たらMA。アはBI、イはPOS、ウはRPA。「自動化」という言葉だけでRPAに引っ張られないこと。", "year": "r6"}, {"id": 2, "cat": "strategy", "sub": "法務", "prompt": "情報システムに不正に侵入し、サービスを停止させて社会的混乱を生じさせるような行為に対して、国全体で体系的に防御施策を講じるための基本理念を定め、国の責務などを明らかにした法律はどれか。", "opts": ["公益通報者保護法", "サイバーセキュリティ基本法", "不正アクセス禁止法", "プロバイダ責任制限法"], "ans": 1, "tip": "法律名に「基本法」が付いたら、中身は必ず「理念・国の責務・施策推進」の3点セット。個別の行為を罰する話が出てきたらそれは基本法ではない（不正アクセス禁止法の側）。", "year": "r6"}, {"id": 3, "cat": "strategy", "sub": "経営戦略手法", "prompt": "未来のある時点に目標を設定し、そこを起点に現在を振り返り、目標実現のために現在すべきことを考える方法を表す用語として、最も適切なものはどれか。", "opts": ["PoC（Proof of Concept）", "PoV（Proof of Value）", "バックキャスティング", "フォアキャスティング"], "ans": 2, "tip": "casting＝投げる。back＝未来から今へ投げ返す、fore＝今から先へ投げる。「未来を先に決める」のがバックキャスティング。SDGsの目標設定がまさにこの発想。", "year": "r6"}, {"id": 4, "cat": "strategy", "sub": "ビジネスインダストリ", "prompt": "従来の金融情報システムは堅ろう性が高い一方、柔軟性に欠け、モバイル技術などの情報革新に追従したサービスの迅速な提供が難しかった。これを踏まえて、インターネット関連技術の取込みやそれらを活用するベンチャー企業と組むなどして、新たな価値や革新的なサービスを提供していく潮流を表す用語として、最も適切なものはどれか。", "opts": ["オムニチャネル", "フィンテック", "ブロックチェーン", "ワントゥワンマーケティング"], "ans": 1, "tip": "Finance＋Technologyの合成語。問題文に「金融」と「IT」の両方が出てきたらフィンテック。ブロックチェーンはフィンテックを支える一技術であって、潮流全体を指す言葉ではない、という粒度の違いで切る。", "year": "r6"}, {"id": 5, "cat": "strategy", "sub": "経営・組織", "prompt": "ベンチャーキャピタルに関する記述として、最も適切なものはどれか。", "opts": ["新しい技術の獲得や、規模の経済性の追求などを目的に、他の企業と共同出資会社を設立する手法", "株式売却による利益獲得などを目的に、新しい製品やサービスを武器に市場に参入しようとする企業に対して出資などを行う企業", "新サービスや技術革新などの創出を目的に、国や学術機関、他の企業など外部の組織と共創関係を結び、積極的に技術や資源を交換し、自社に取り込む手法", "特定された課題の解決を目的に、一定の期間を定めて企業内に立ち上げられ、構成員を関連部門から招集し、目的が達成された時点で解散する組織"], "ans": 1, "tip": "Capital＝資本。つまり「金を出す側」。選択肢の中で主語が「出資する企業」になっているものを選ぶだけ。アはジョイントベンチャー、ウはオープンイノベーション、エはプロジェクト組織。", "year": "r6"}, {"id": 6, "cat": "strategy", "sub": "経営・組織", "prompt": "技術戦略の策定や技術開発の推進といった技術経営に直接の責任をもつ役職はどれか。", "opts": ["CEO", "CFO", "COO", "CTO"], "ans": 3, "tip": "真ん中の1文字が担当分野。E＝Executive（全体）、F＝Financial（金）、O＝Operating（現場運営）、T＝Technology（技術）。CIO（Information＝情報システム）とCTOの違いは、社内ITを見るか技術戦略を見るか。", "year": "r6"}, {"id": 7, "cat": "strategy", "sub": "システム戦略", "prompt": "システム開発の上流工程において、業務プロセスのモデリングを行う目的として、最も適切なものはどれか。", "opts": ["業務プロセスで取り扱う大量のデータを、統計的手法やAI手法などを用いて分析し、データ間の相関関係や隠れたパターンなどを見いだすため", "業務プロセスを可視化することによって、適切なシステム設計のベースとなる情報を整備し、関係者間で解釈を共有できるようにするため", "個々の従業員がもっている業務に関する知識・経験やノウハウを社内全体で共有し、創造的なアイディアを生み出すため", "プロジェクトに必要な要員を調達し、チームとして組織化して、プロジェクトの目的の達成に向けて一致団結させるため"], "ans": 1, "tip": "モデリング＝図にすること。図にする目的は常に「見えるようにして、認識を揃える」。可視化・共有という語が入った選択肢を選べば外さない。", "year": "r6"}, {"id": 8, "cat": "strategy", "sub": "会計・財務", "prompt": "表はA社の期末の損益計算書から抜粋した資料である。当期純利益が800百万円であるとき、販売費及び一般管理費は何百万円か。\n\n売上高 8,000／売上原価 6,000／販売費及び一般管理費 ?／営業外収益 150／営業外費用 50／特別利益 60／特別損失 10／法人税等 350（単位 百万円）", "opts": ["850", "900", "1,000", "1,200"], "ans": 2, "how": "下から逆算する。当期純利益800＋法人税350＝税引前1,150。税引前から特別利益60を引き特別損失10を戻すと経常1,100。経常から営業外収益150を引き営業外費用50を戻すと営業利益1,000。売上総利益は8,000－6,000＝2,000なので、販管費＝2,000－1,000＝1,000。", "tip": "利益は5段階（売上総利益→営業利益→経常利益→税引前当期純利益→当期純利益）。上から順に足し引きする順番さえ覚えておけば、下から逆算もできる。営業外は経常段階、特別損益は税引前段階で入る、という位置関係が要点。", "year": "r6"}, {"id": 9, "cat": "strategy", "sub": "経営戦略手法", "prompt": "企業の戦略立案やマーケティングなどで使用されるフェルミ推定に関する記述として、最も適切なものはどれか。", "opts": ["正確に算出することが極めて難しい数量に対して、把握している情報と論理的な思考プロセスによって概数を求める手法である。", "特定の集団と活動を共にしたり、人々の動きを観察したりすることによって、慣習や嗜好、地域や組織を取り巻く文化を類推する手法である。", "入力データと出力データから、その因果関係を統計的に推定する手法である。", "有識者のグループに繰り返し同一のアンケート調査とその結果のフィードバックを行うことによって、ある分野の将来予測に関する総意を得る手法である。"], "ans": 0, "tip": "「日本に電柱は何本あるか」を筋道立てて概算するアレ。キーワードは「概数」と「論理的思考」。イはエスノグラフィ、エはデルファイ法。デルファイ法は「専門家に何度も聞く」が目印。", "year": "r6"}, {"id": 10, "cat": "strategy", "sub": "法務", "prompt": "不正競争防止法で規定されている限定提供データに関する記述として、最も適切なものはどれか。", "opts": ["特定の第三者に対し、1回に限定して提供する前提で保管されている技術上又は営業上の情報は限定提供データである。", "特定の第三者に提供する情報として電磁的方法によって相当量蓄積され管理されている技術上又は営業上の情報（秘密として管理されているものを除く）は限定提供データである。", "特定の第三者に提供するために、金庫などで物理的に管理されている技術上又は営業上の情報は限定提供データである。", "不正競争防止法に定めのある営業秘密は限定提供データである。"], "ans": 1, "tip": "限定提供データの3要件は「限定提供性・相当量蓄積・電磁的管理」。ポイントは電磁的、つまりデータであること。紙や金庫の話が出たら違う。営業秘密（秘密管理されているもの）とは別枠で、むしろ営業秘密は除外される、という関係で覚える。", "year": "r6"}, {"id": 11, "cat": "strategy", "sub": "経営・組織", "prompt": "品質に関する組織やプロセスの運営管理を標準化し、マネジメントの質や効率の向上を目的とした方策として、適切なものはどれか。", "opts": ["ISMSの導入", "ISO 9001の導入", "ITILの導入", "プライバシーマークの取得"], "ans": 1, "tip": "ISO番号の暗記が最短。9001＝品質、14001＝環境、27001＝情報セキュリティ。「品質」と来たら9001の一択。", "year": "r6"}, {"id": 12, "cat": "strategy", "sub": "法務", "prompt": "AIに関するガイドラインの一つである「人間中心のAI社会原則」に定められている七つの「AI社会原則」のうち、「イノベーションの原則」に関する記述として、最も適切なものはどれか。", "opts": ["AIの発展によって人も併せて進化するように、国際化や多様化を推進し、大学、研究機関、企業など、官民における連携と、柔軟な人材の移動を促進する。", "AIの利用がもたらす結果については、問題の特性に応じて、AIの開発、提供、利用に携わった関係者が分担して責任を負う。", "サービスの提供者は、AIを利用している事実やデータの取得方法や使用方法、結果の適切性について、利用者に対する適切な説明を行う。", "情報弱者を生み出さないために、幼児教育や初等中等教育において、AI活用や情報リテラシーに関する教育を行う。"], "ans": 0, "tip": "イノベーション＝新しいものを生み出す土壌づくり。「連携」「人材の流動」「国際化」といった前に進める系の語が入っているものを選ぶ。イは公平性・説明責任、ウは透明性、エは教育・リテラシーの原則。", "year": "r6"}, {"id": 13, "cat": "strategy", "sub": "ビジネスインダストリ", "prompt": "金融機関では、同一の顧客で複数の口座をもつ個人や法人について、氏名又は法人名、生年月日又は設立年月日、電話番号、住所又は所在地などを手掛かりに集約し、顧客ごとの預金の総額を正確に把握する作業が行われる。このように顧客がもつ複数の口座を、顧客ごとに取りまとめて一元管理する手続を表す用語として、最も適切なものはどれか。", "opts": ["アカウントアグリゲーション", "キーマッピング", "垂直統合", "名寄せ"], "ans": 3, "tip": "「名前を寄せる」でそのまま。紛らわしいアカウントアグリゲーションは、複数の金融機関の口座を利用者が一画面で見るサービスで、主語が利用者側。名寄せは金融機関側が同一人物を突き合わせる作業、と主語で区別する。", "year": "r6"}, {"id": 14, "cat": "strategy", "sub": "経営戦略手法", "prompt": "ある商品の販売量と気温の関係が一次式で近似できるとき、予測した気温から商品の販売量を推定する手法として、適切なものはどれか。", "opts": ["回帰分析", "線形計画法", "デルファイ法", "パレート分析"], "ans": 0, "tip": "「一次式で近似」＝直線を引く＝回帰分析。散布図に引く近似直線をイメージすればよい。線形計画法は制約条件下で最大・最小を求める最適化なので、目的が予測ではなく最適解である点が違う。", "year": "r6"}, {"id": 15, "cat": "strategy", "sub": "エンジニアリング", "prompt": "必要な時期に必要な量の原材料や部品を調達することによって、工程間の在庫をできるだけもたないようにする生産方式はどれか。", "opts": ["BPO", "CIM", "JIT", "OEM"], "ans": 2, "tip": "Just In Time＝ちょうど間に合う。在庫を持たない＝トヨタ生産方式。OEMは他社ブランドでの製造受託、BPOは業務の外部委託。「在庫」の語が出たらJIT。", "year": "r6"}, {"id": 16, "cat": "strategy", "sub": "システム戦略", "prompt": "RPAが適用できる業務として、最も適切なものはどれか。", "opts": ["ゲームソフトのベンダーが、ゲームソフトのプログラムを自動で改善する業務", "従業員の交通費精算で、交通機関利用区間情報と領収書データから精算伝票を作成する業務", "食品加工工場で、産業用ロボットを用いて冷凍食品を自動で製造する業務", "通信販売業で、膨大な顧客の購買データから顧客の購買行動に関する新たな法則を見つける業務"], "ans": 1, "tip": "RPAが得意なのは「ルールが決まっていて、判断が要らない、PC上の事務作業」。工場の物理作業（FA）と、法則を発見する分析（AI・データマイニング）は守備範囲外。この3つの切り分けが毎回問われる。", "year": "r6"}, {"id": 17, "cat": "strategy", "sub": "技術戦略", "prompt": "技術開発戦略において作成されるロードマップを説明しているものはどれか。", "opts": ["技術の競争力レベルと技術のライフサイクルを2軸としたマトリックス上に、自社の技術や新しい技術をプロットする。", "研究開発への投資とその成果を2軸とした座標上に、技術の成長過程をグラフ化し、旧技術から新技術への転換状況を表す。", "市場面からの有望度と技術面からの有望度を2軸としたマトリックス上に、技術開発プロジェクトをプロットする。", "横軸に時間、縦軸に市場、商品、技術などを示し、研究開発成果の商品化、事業化の方向性をそれらの要素間の関係で表す。"], "ans": 3, "tip": "ロードマップ＝道のり。道のりを描く以上、横軸は必ず時間になる。選択肢の中で「時間」が軸に入っているものを探せば一発。時間軸のないものはマトリックス分析であってロードマップではない。", "year": "r6"}, {"id": 18, "cat": "strategy", "sub": "経営・組織", "prompt": "コーポレートガバナンスを強化した事例として、最も適切なものはどれか。", "opts": ["女性が活躍しやすくするために労務制度を拡充した。", "迅速な事業展開のために、他社の事業を買収した。", "独立性の高い社外取締役の人数を増やした。", "利益が得られにくい事業から撤退した。"], "ans": 2, "tip": "ガバナンス＝統治＝経営者を監視する仕組み。判定は「監視の目が増えるか」の一点。社外取締役はまさに外からの目。買収も撤退も経営判断であって監視ではない。", "year": "r6"}, {"id": 19, "cat": "strategy", "sub": "ビジネスインダストリ", "prompt": "ある銀行では、システムの接続仕様を外部に公開し、あらかじめ契約を結んだ外部事業者のアクセスを認めることによって、利便性の高い、高度なサービスを展開しやすくしている。このような取組を表す用語として、最も適切なものはどれか。", "opts": ["BPO", "RPA", "オープンAPI", "技術経営"], "ans": 2, "tip": "API＝ソフト同士の接続口。それを外部に開放するからオープンAPI。「接続仕様を公開」という表現が出たらAPI以外にない。フィンテックが成り立つ土台がこれ、とセットで押さえる。", "year": "r6"}, {"id": 20, "cat": "strategy", "sub": "会計・財務", "prompt": "A社では、1千万円を投資して営業支援システムを再構築することを検討している。現状の営業支援システムの運用費が5百万円／年、再構築後の営業支援システムの運用費が4百万円／年、再構築による新たな利益の増加が2百万円／年であるとき、この投資の回収期間は何年か。ここで、これら以外の効果、費用などは考慮しないものとし、計算結果は小数点以下第2位を四捨五入するものとする。", "opts": ["2.5", "3.3", "5.0", "10.0"], "ans": 1, "how": "年間効果＝運用費削減（5－4＝1百万円）＋利益増加2百万円＝3百万円／年。投資額1千万円＝10百万円。10÷3＝3.33…なので3.3年。", "tip": "回収期間＝投資額÷年間効果。難しいのは計算ではなく「年間効果に何を含めるか」。コスト削減額と利益増加額は両方とも効果に含める、と決めておけば迷わない。単位（千万円と百万円）を揃えるのも忘れずに。", "year": "r6"}, {"id": 21, "cat": "strategy", "sub": "システム戦略", "prompt": "あるソフトウェアは、定額の料金や一定の期間での利用ができる形態で提供されている。この利用形態を表す用語として、適切なものはどれか。", "opts": ["アクティベーション", "アドウェア", "サブスクリプション", "ボリュームライセンス"], "ans": 2, "tip": "subscribe＝定期購読。新聞の定期購読と同じ発想で、買い切りではなく使っている間だけ払う。ボリュームライセンスは複数本まとめ買いなので、軸が「期間」ではなく「本数」である点が違う。", "year": "r6"}, {"id": 22, "cat": "strategy", "sub": "ビジネスインダストリ", "prompt": "インターネットを介して個人や企業が保有する住宅などの遊休資産の貸出しを仲介するサービスや仕組みを表す用語として、最も適切なものはどれか。", "opts": ["シェアードサービス", "シェアウェア", "シェアリングエコノミー", "ワークシェアリング"], "ans": 2, "tip": "「シェア」系4連発の引っかけ。何を分け合うかで区別する。遊休資産＝シェアリングエコノミー、間接業務の集約＝シェアードサービス、仕事＝ワークシェアリング、ソフト＝シェアウェア。", "year": "r6"}, {"id": 23, "cat": "strategy", "sub": "システム戦略", "prompt": "A社はRPAソフトウェアを初めて導入するに当たり、計画策定フェーズ、先行導入フェーズ、本格導入フェーズの3段階で進めようと考えている。次のうち、計画策定フェーズで実施する作業として、適切なものだけを全て挙げたものはどれか。\n\na RPAソフトウェアの適用可能性を見極めるための概念検証を実施する。\nb RPAソフトウェアを全社展開するための導入と運用の手順書を作成する。\nc 部門、業務を絞り込んでRPAソフトウェアを導入し、効果を実測する。", "opts": ["a", "a, c", "b", "b, c"], "ans": 0, "tip": "フェーズ名がそのまま作業内容を表している。計画策定＝やるかどうかを見極める（PoC）、先行導入＝一部で試す、本格導入＝全社展開の手順を整える。選択肢の語尾が「全社展開」「効果を実測」なら後のフェーズ、と振り分ける。", "year": "r6"}, {"id": 24, "cat": "strategy", "sub": "エンジニアリング", "prompt": "式は定期発注方式で原料の発注量を求める計算式である。a〜cに入れる字句の適切な組合せはどれか。\n\n発注量＝（[ a ]＋調達期間）× 毎日の使用予定量 ＋ [ b ] － 現在の在庫量 － [ c ]", "opts": ["a:営業日数／b:安全在庫量／c:現在の発注残", "a:営業日数／b:現在の発注残／c:安全在庫量", "a:発注間隔／b:安全在庫量／c:現在の発注残", "a:発注間隔／b:現在の発注残／c:安全在庫量"], "ans": 2, "tip": "意味で考えれば式は組み立てられる。カバーすべき期間＝次の発注までの間隔＋届くまでの期間。安全在庫は余分に持ちたいので足す。すでに手元にある在庫と、注文済みでこれから届く分（発注残）は要らないので引く。「持っているものは引く」で統一。", "year": "r6"}, {"id": 25, "cat": "strategy", "sub": "ビジネスインダストリ", "prompt": "史跡などにスマートフォンを向けると、昔あった建物の画像や説明情報を現実の風景と重ねるように表示して、観光案内をできるようにした。ここで活用した仕組みを表す用語として、最も適切なものはどれか。", "opts": ["AR", "GUI", "VR", "メタバース"], "ans": 0, "tip": "AR＝Augmented（拡張）Reality。現実に情報を足すのがAR、現実を丸ごと置き換えるのがVR。「現実の風景と重ねる」と書いてあればAR確定。", "year": "r6"}, {"id": 26, "cat": "strategy", "sub": "ビジネスインダストリ", "prompt": "データサイエンティストの役割に関する記述として、最も適切なものはどれか。", "opts": ["機械学習や統計などの手法を用いてビッグデータを解析することによって、ビジネスに活用するための新たな知見を獲得する。", "企業が保有する膨大なデータを高速に検索できるように、パフォーマンスの高いデータベースを運用するためのシステム基盤を構築する。", "企業における情報システムに関するリスクを評価するために、現場でのデータの取扱いや管理についての実態を調査する。", "企業や組織における安全な情報システムの企画、設計、開発、運用を、サイバーセキュリティに関する専門的な知識や技能を活用して支援する。"], "ans": 0, "tip": "サイエンティストなので「分析して知見を出す人」。イは基盤構築（エンジニア）、ウは監査、エはセキュリティ人材。データを「作る・守る」ではなく「読み解く」のがデータサイエンティスト。", "year": "r6"}, {"id": 27, "cat": "strategy", "sub": "法務", "prompt": "個人情報保護法では、あらかじめ本人の同意を得ていなくても個人データの提供が許される行為を規定している。この行為に該当するものだけを、全て挙げたものはどれか。\n\na 事故で意識不明の人がもっていた本人の社員証を見て、搬送先の病院が本人の会社に電話してきたので、総務の担当者が本人の自宅電話番号を教えた。\nb 新規加入者を勧誘したいと保険会社の従業員に頼まれたので、総務の担当者が新入社員の名前と所属部門のリストを渡した。\nc 不正送金等の金融犯罪被害者に関する個人情報を、類似犯罪の防止対策を進める捜査機関からの法令に基づく要請に応じて、総務の担当者が提供した。", "opts": ["a", "a, c", "b, c", "c"], "ans": 1, "tip": "同意なしで提供できる例外は4つ。「法令に基づく場合」「人の生命・身体・財産の保護」「公衆衛生・児童の健全育成」「国等への協力」。aは命の保護、cは法令に基づく要請でどちらも例外。単なる営業目的（b）は例外に入らない、と覚える。", "year": "r6"}, {"id": 28, "cat": "strategy", "sub": "ビジネスインダストリ", "prompt": "次の事例のうち、AIを導入することによって業務の作業効率が向上したものだけを全て挙げたものはどれか。\n\na 食品専門商社のA社が、取引先ごとに様式が異なる手書きの請求書に記載された文字を自動で読み取ってデータ化することによって、事務作業時間を削減した。\nb 繊維製造会社のB社が、原材料を取引先に発注する定型的なPCの操作を自動化するツールを導入し、事務部門の人員を削減した。\nc 損害保険会社のC社が、自社のコールセンターへの問合せに対して、オペレーターにつなげる前に音声チャットボットでヒアリングを行うことによって、オペレーターの対応時間を短縮した。\nd 物流会社のD社が、配送荷物に電子タグを装着して出荷時に配送先を電子タグに書き込み、配送時にそれを確認することによって、誤配送を削減した。", "opts": ["a, c", "b, c", "b, d", "c, d"], "ans": 0, "tip": "AIかどうかの判定は「学習・認識・自然言語処理が要るか」。手書き文字の認識（a）と音声の聞き取り（c）は人間の認識能力の代行なのでAI。定型操作の自動化（b）はRPA、電子タグ（d）はRFIDで、どちらも決められた通りに動くだけ。", "year": "r6"}, {"id": 29, "cat": "strategy", "sub": "ビジネスインダストリ", "prompt": "ある企業が、顧客を引き付ける優れたUX（User Experience）やビジネスモデルをデジタル技術によって創出し、業界における従来のサービスを駆逐してしまうことによって、その業界の既存の構造が破壊されるような現象を表す用語として、最も適切なものはどれか。", "opts": ["デジタルサイネージ", "デジタルディスラプション", "デジタルディバイド", "デジタルトランスフォーメーション"], "ans": 1, "tip": "disrupt＝破壊する。既存業界がひっくり返される「結果」を指すのがディスラプション。DXは自社が変革する「取組」、デバイドは格差、サイネージは電子看板。破壊されている側の視点かどうかで見分ける。", "year": "r6"}, {"id": 30, "cat": "strategy", "sub": "会計・財務", "prompt": "上司から自社の当期の損益計算書を渡され、「我が社の収益性分析をしなさい」と言われた。経営に関する指標のうち、この損益計算書だけから計算できるものだけを全て挙げたものはどれか。\n\na 売上高増加率　b 売上高利益率　c 自己資本利益率", "opts": ["a", "a, b", "a, b, c", "b"], "ans": 3, "tip": "損益計算書は「当期一期分の、もうけの記録」。したがって前期と比べる指標（増加率）と、貸借対照表の自己資本が要る指標は計算できない。「他の資料が要るか」を一つずつ問えば消える。", "year": "r6"}, {"id": 31, "cat": "strategy", "sub": "システム戦略", "prompt": "顧客との個々のつながりを意識して情報を頻繁に更新するSNSなどのシステムとは異なり、会計システムのように高い信頼性と安定稼働が要求される社内情報を扱うシステムの概念を示す用語として、最も適切なものはどれか。", "opts": ["IoT（Internet of Things）", "PoC（Proof of Concept）", "SoE（Systems of Engagement）", "SoR（Systems of Record）"], "ans": 3, "tip": "Record＝記録。会計や在庫のように正確に記録するのがSoR。Engagement＝つながり。SNSのように顧客と関わるのがSoE。「守りのIT＝SoR、攻めのIT＝SoE」と対で覚える。", "year": "r6"}, {"id": 32, "cat": "strategy", "sub": "法務", "prompt": "労働者派遣における派遣労働者の雇用関係に関する記述のうち、適切なものはどれか。", "opts": ["派遣先との間に雇用関係があり、派遣元との間には存在しない。", "派遣元との間に雇用関係があり、派遣先との間には存在しない。", "派遣元と派遣先のいずれの間にも雇用関係が存在する。", "派遣元と派遣先のいずれの間にも雇用関係は存在しない。"], "ans": 1, "tip": "派遣は「雇用は元、指揮命令は先」。給料を払うのが派遣元だから雇用関係も派遣元。請負との違いは、請負では発注者が直接指揮命令できない点。矢印を2本（雇用と指揮命令）描き分けると混乱しない。", "year": "r6"}, {"id": 33, "cat": "strategy", "sub": "開発技術", "prompt": "次の記述のうち、業務要件定義が曖昧なことが原因で起こり得る問題だけを全て挙げたものはどれか。\n\na 企画プロセスでシステム化構想がまとまらず、システム化の承認を得られない。\nb コーディングのミスによって、システムが意図したものと違う動作をする。\nc システムの開発中に仕様変更による手戻りが頻発する。\nd システムを受け入れるための適切な受入れテストを設計できない。", "opts": ["a, b", "b, c", "b, d", "c, d"], "ans": 3, "tip": "要件定義は「何を作るか」を決める工程。決まっていないと、後工程で作り直しが起き（c）、受入れの合格基準も作れない（d）。aは要件定義より前の企画段階、bは実装ミスで工程が違う。前後の工程の話を混ぜないのがコツ。", "year": "r6"}, {"id": 34, "cat": "strategy", "sub": "システム戦略", "prompt": "顧客の特徴に応じたきめ細かい対応を行うことによって、顧客と長期的に良好な関係を築き、顧客満足度の向上や取引関係の継続につなげる仕組みを構築したい。その仕組みの構成要素の一つとして、営業活動で入手した顧客に関する属性情報や顧客との交渉履歴などを蓄積し、社内で共有できるシステムを導入することにした。この目的を達成できるシステムとして、最も適切なものはどれか。", "opts": ["CAEシステム", "MRPシステム", "SCMシステム", "SFAシステム"], "ans": 3, "tip": "Sales Force Automation＝営業部隊の自動化。「営業活動で入手した」「交渉履歴」とあれば営業支援システム。CRM（顧客関係管理）を実現する手段の一つがSFA、という包含関係で押さえる。", "year": "r6"}, {"id": 35, "cat": "strategy", "sub": "法務", "prompt": "実用新案に関する記述として、最も適切なものはどれか。", "opts": ["今までにない製造方法は、実用新案の対象となる。", "自然法則を利用した技術的思想の創作で高度なものだけが、実用新案の対象となる。", "新規性の審査に合格したものだけが実用新案として登録される。", "複数の物品を組み合わせて考案した新たな製品は、実用新案の対象となる。"], "ans": 3, "tip": "実用新案は「物品の形状・構造・組合せ」に関する小発明が対象。だから方法（製造方法）は対象外、「高度なもの」は特許の定義、そして無審査で登録される点が特許との最大の違い。この3つの違いで選択肢が全部切れる。", "year": "r6"}, {"id": 36, "cat": "management", "sub": "プロジェクトマネジメント", "prompt": "プロジェクトに該当する事例として、適切なものだけを全て挙げたものはどれか。\n\na 会社合併に伴う新組織への移行\nb 社内システムの問合せや不具合を受け付けるサービスデスクの運用\nc 新規の経理システム導入に向けたプログラム開発\nd 毎年度末に実施する会計処理", "opts": ["a, c", "b, c", "b, d", "c"], "ans": 0, "tip": "プロジェクトの条件は「有期性（始まりと終わりがある）」と「独自性（毎回同じではない）」。繰り返し続く定常業務（運用・毎年の処理）は全て除外。「終わったら解散するか」を問えばよい。", "year": "r6"}, {"id": 37, "cat": "management", "sub": "プロジェクトマネジメント", "prompt": "システム開発プロジェクトを終結する時に、プロジェクト統合マネジメントで実施する活動として、最も適切なものはどれか。", "opts": ["工程の進捗の予定と実績の差異を分析する。", "作成した全ての成果物の一覧を確認する。", "総費用の予算と実績の差異を分析する。", "知識や教訓を組織の資産として登録する。"], "ans": 3, "tip": "統合マネジメントは全体を束ねる領域。終結時の代表的な活動が「教訓（lessons learned）を組織に残す」こと。進捗はスケジュール、費用はコスト、成果物一覧はスコープの担当なので、他の知識エリアに割り振れるものは除く。", "year": "r6"}, {"id": 38, "cat": "management", "sub": "サービスマネジメント", "prompt": "あるシステムの運用において、利用者との間でSLAを交わし、利用可能日を月曜日から金曜日、1日の利用可能時間を7時から22時まで、稼働率を98％以上で合意した。1週間の運用において、障害などでシステムの停止を許容できる時間は最大何時間か。", "opts": ["0.3", "1.5", "1.8", "2.1"], "ans": 1, "how": "1日の利用可能時間は7時〜22時で15時間。月〜金の5日間なので15×5＝75時間。停止が許されるのは2％なので75×0.02＝1.5時間。", "tip": "稼働率の問題は「分母は何時間か」を最初に確定させる。24時間365日ではなく、合意したサービス時間だけが分母。許容停止時間＝サービス時間×（1－稼働率）。", "year": "r6"}, {"id": 39, "cat": "management", "sub": "サービスマネジメント", "prompt": "サービスデスクを評価するためには適切なKPIを定めて評価する必要がある。顧客満足度を高めるために値が小さい方が良いKPIとして、適切なものだけを全て挙げたものはどれか。\n\na SLAで合意された目標時間内に対応が完了したインシデント件数の割合\nb 1回の問合せで解決ができたインシデント件数の割合\nc 二次担当へエスカレーションされたインシデント件数の割合\nd 利用者がサービスデスクの担当者につながるまでに費やした時間", "opts": ["a, b", "a, d", "b, c", "c, d"], "ans": 3, "tip": "KPIは「大きいほど良いもの」と「小さいほど良いもの」を仕分ける。目標達成率・一次解決率は高いほど良い、たらい回し率・待ち時間は低いほど良い。問題文がどちらを聞いているかを最初に丸で囲む。", "year": "r6"}, {"id": 40, "cat": "management", "sub": "開発技術", "prompt": "アジャイル開発に関する記述として、最も適切なものはどれか。", "opts": ["開発する機能を小さい単位に分割して、優先度の高いものから短期間で開発とリリースを繰り返す。", "共通フレームを適用して要件定義、設計などの工程名及び作成する文書を定義する。", "システム開発を上流工程から下流工程まで順番に進めて、全ての開発工程が終了してからリリースする。", "プロトタイプを作成して利用者に確認を求め、利用者の評価とフィードバックを行いながら開発を進めていく。"], "ans": 0, "tip": "アジャイルの核は「小さく分けて、優先順位順に、短い反復でリリース」。エのプロトタイピングも利用者を巻き込むが、あくまで試作品による要求確認であってリリースを繰り返さない。「リリースを繰り返すか」で切る。", "year": "r6"}, {"id": 41, "cat": "management", "sub": "プロジェクトマネジメント", "prompt": "あるプロジェクトの作業間の関係と所要時間がアローダイアグラムで示されている。このアローダイアグラムのBからEの四つの結合点のうち、工程全体の完了時間に影響を与えることなく、その結合点から始まる全ての作業の開始を最も遅らせることができるものはどれか。\n\n作業と所要時間：A→B 15／A→C 10／B→D 10／B→E 25／C→E 15／D→E 10／D→F 20／E→F 15", "opts": ["B", "C", "D", "E"], "ans": 1, "how": "最早開始はA=0、B=15、C=10、D=25、E=max(15+25, 10+15, 25+10)=40、F=max(25+20, 40+15)=55。最遅開始は逆算でE=55－15=40、D=min(55－20, 40－10)=30、C=40－15=25、B=min(30－10, 40－25)=15。余裕はB=0、C=15、D=5、E=0。最大はCの15。", "tip": "クリティカルパス上の結合点は余裕ゼロ。余裕（最遅開始－最早開始）が一番大きい点を探す問題なので、必ず「最早」を前から、「最遅」を後ろから、2回スキャンする。片方だけでは絶対に解けない。", "year": "r6"}, {"id": 42, "cat": "management", "sub": "システム監査", "prompt": "システム監査人の役割として、適切なものだけを全て挙げたものはどれか。\n\na 監査手続の種類、実施時期、適用範囲などについて、監査計画を立案する。\nb 監査の目的に応じた監査報告書を作成し、社内に公開する。\nc 監査報告書にある改善提案に基づく改善の実施を監査対象部門に指示する。\nd 監査報告書にある改善提案に基づく改善の実施状況をモニタリングする。", "opts": ["a, b", "a, d", "b, c", "c, d"], "ans": 1, "tip": "監査人は「計画する・調べる・報告する・追跡する（フォローアップ）」まで。命令はできない（改善を指示するのは経営者）。報告書は依頼者に提出するもので社内公開はしない。「指示」「公開」の語が出たら疑う。", "year": "r6"}, {"id": 43, "cat": "management", "sub": "サービスマネジメント", "prompt": "情報システムに関する施設や設備を維持・保全するために行うリスク対策のうち、ファシリティマネジメントの観点から行う対策として、適切なものだけを全て挙げたものはどれか。\n\na コンピュータ室への入室を、認可した者だけに限定する。\nb コンピュータの設置場所を示す標識を掲示しない。\nc 利用者のPCにマルウェア対策ソフトを導入する。", "opts": ["a", "a, b", "a, c", "b, c"], "ans": 1, "tip": "ファシリティ＝施設・設備。判定は「それ、建物や場所の話か？」の一問だけ。ソフトウェアの導入が出てきた時点で技術的対策なので外れる。", "year": "r6"}, {"id": 44, "cat": "management", "sub": "サービスマネジメント", "prompt": "提供しているITシステムが事業のニーズを満たせるように、人材、プロセス、情報技術を適切に組み合わせ、継続的に改善して管理する活動として、最も適切なものはどれか。", "opts": ["ITサービスマネジメント", "システム監査", "ヒューマンリソースマネジメント", "ファシリティマネジメント"], "ans": 0, "tip": "「人・プロセス・技術を組み合わせて継続的に改善」はITサービスマネジメント（ITIL）の定型文。監査は評価するだけ、ファシリティは施設だけ、と守備範囲の広さで切る。", "year": "r6"}, {"id": 45, "cat": "management", "sub": "開発技術", "prompt": "本番稼働後の業務遂行のために、業務別にサービス利用方法の手順を示した文書として、最も適切なものはどれか。", "opts": ["FAQ", "サービスレベル合意書", "システム要件定義書", "利用者マニュアル"], "ans": 3, "tip": "「手順を示した文書」＝マニュアル。FAQはよくある質問への回答集で、手順を体系的に示すものではない。目的が「困ったときの検索」か「業務の遂行」かで分ける。", "year": "r6"}, {"id": 46, "cat": "management", "sub": "サービスマネジメント", "prompt": "ITサービスマネジメントの管理プロセスに関する記述a〜cと用語の適切な組合せはどれか。\n\na ITサービスの変更を実装するためのプロセス\nb インシデントの根本原因を突き止めて解決策を提供するためのプロセス\nc 組織が所有しているIT資産を把握するためのプロセス", "opts": ["a:構成管理／b:問題管理／c:リリース及び展開管理", "a:構成管理／b:リリース及び展開管理／c:問題管理", "a:問題管理／b:リリース及び展開管理／c:構成管理", "a:リリース及び展開管理／b:問題管理／c:構成管理"], "ans": 3, "tip": "3つの担当を一言で。リリース及び展開管理＝本番に入れる、問題管理＝原因を根絶する、構成管理＝何を持っているか台帳で把握する。「根本原因」の語が出たら必ず問題管理（インシデント管理は復旧優先で原因は問わない）。", "year": "r6"}, {"id": 47, "cat": "management", "sub": "開発技術", "prompt": "ソフトウェアの開発におけるDevOpsに関する記述として、最も適切なものはどれか。", "opts": ["開発側が重要な機能のプロトタイプを作成し、顧客とともにその性能を実測して妥当性を評価する。", "開発側では、開発の各工程でその工程の完了を判断した上で次工程に進み、総合テストで利用者が参加して操作性の確認を実施した後に運用側に引き渡す。", "開発側と運用側が密接に連携し、自動化ツールなどを活用して機能の導入や更新などを迅速に進める。", "システム開発において、機能の拡張を図るために、固定された短期間のサイクルを繰り返しながらプログラムを順次追加する。"], "ans": 2, "tip": "Development＋Operations。名前のとおり「開発と運用が手を組む」こと。選択肢に運用側が登場するかどうかで即決できる。エはアジャイル（反復）で、運用の話が出てこない。", "year": "r6"}, {"id": 48, "cat": "management", "sub": "システム監査", "prompt": "システム監査で用いる判断尺度の選定方法に関する記述として、最も適切なものはどれか。", "opts": ["システム監査ではシステム管理基準の全項目をそのまま使用しなければならない。", "システム監査のテーマに応じて、システム管理基準以外の基準を使用してもよい。", "システム監査のテーマによらず、システム管理基準以外の基準は使用すべきでない。", "アジャイル開発では、システム管理基準は使用すべきでない。"], "ans": 1, "tip": "監査基準は目的に合わせて選ぶもので、縛りではない。選択肢に「全項目をそのまま」「〜すべきでない」といった硬い断定が並んだら、柔軟な言い回しのものが正解になる。", "year": "r6"}, {"id": 49, "cat": "management", "sub": "プロジェクトマネジメント", "prompt": "ソフトウェア開発プロジェクトにおける、コストの見積手法には、積み上げ法、ファンクションポイント法、類推見積法などがある。見積りで使用した手法とその特徴に関する記述a〜cの適切な組合せはどれか。\n\na プロジェクトに必要な個々の作業を洗い出し、その作業ごとの工数を見積もって集計する。\nb プロジェクトの初期段階で使用する手法で、過去の事例を活用してコストを見積もる。\nc データ入出力や機能に着目して、ソフトウェア規模を見積もり、係数を乗ずるなどしてコストを見積もる。", "opts": ["積み上げ法:a／FP法:c／類推見積法:b", "積み上げ法:b／FP法:a／類推見積法:c", "積み上げ法:c／FP法:a／類推見積法:b", "積み上げ法:c／FP法:b／類推見積法:a"], "ans": 0, "tip": "名前がそのまま手法を説明している。積み上げ＝作業を積み上げる、ファンクションポイント＝機能（function）を数える、類推＝過去の似た案件から推し量る。必要な情報量は類推＜FP＜積み上げの順に増える。", "year": "r6"}, {"id": 50, "cat": "management", "sub": "開発技術", "prompt": "ソフトウェア製品の品質特性を、移植性、機能適合性、互換性、使用性、信頼性、性能効率性、セキュリティ、保守性に分類したとき、RPAソフトウェアの使用性に関する記述として、最も適切なものはどれか。", "opts": ["RPAが稼働するPCのOSが変わっても動作する。", "RPAで指定した時間及び条件に基づき、適切に自動処理が実行される。", "RPAで操作対象となるアプリケーションソフトウェアがバージョンアップされても、簡単な設定変更で対応できる。", "RPAを利用したことがない人でも、簡単な教育だけで利用可能になる。"], "ans": 3, "tip": "使用性の主語は必ず「人」。人が使いやすいか、学びやすいかを問う特性なので、選択肢に人間が登場するものを探す。アは移植性、イは機能適合性、ウは保守性。", "year": "r6"}, {"id": 51, "cat": "management", "sub": "開発技術", "prompt": "システム開発プロジェクトにおいて、テスト中に発見された不具合の再発防止のために不具合分析を行うことにした。テスト結果及び不具合の内容を表に記入し、不具合ごとに根本原因を突き止めた後に、根本原因ごとに集計を行い発生頻度の多い順に並べ、主要な根本原因の特定を行った。ここで利用した図表のうち、根本原因を集計し、発生頻度順に並べて棒グラフで示し、累積値を折れ線グラフで重ねて示したものはどれか。", "opts": ["散布図", "チェックシート", "特性要因図", "パレート図"], "ans": 3, "tip": "「棒グラフ＋累積折れ線」の組合せはパレート図だけ。上位2割の原因が全体の8割を占めるというパレートの法則とセット。魚の骨の形は特性要因図（原因の洗い出し用で、集計はしない）。", "year": "r6"}, {"id": 52, "cat": "management", "sub": "プロジェクトマネジメント", "prompt": "システム開発プロジェクトにおいて、新機能の追加要求が変更管理委員会で承認された後にプロジェクトスコープマネジメントで実施する活動として、適切なものはどれか。", "opts": ["新機能を追加で開発するためにWBSを変更し、コストの詳細な見積りをするための情報として提供する。", "新機能を追加で開発するためのWBSのアクティビティの実行に必要なスキルを確認し、必要に応じてプロジェクトチームの能力向上を図る。", "変更されたWBSに基づいてスケジュールを作成し、完了時期の見通しを提示する。", "変更されたWBSに基づいて要員の充足度を確認し、必要な場合は作業の外注を検討する。"], "ans": 0, "tip": "WBSを「作る・変える」のがスコープマネジメント。できあがったWBSを使って日程を引くのがスケジュール、金額を出すのがコスト、人を当てるのが資源。「変更されたWBSに基づいて」で始まる選択肢は、すでに別領域の仕事に移っている。", "year": "r6"}, {"id": 53, "cat": "management", "sub": "ITガバナンス", "prompt": "ITガバナンスに関する次の記述中のaに入れる字句として、最も適切なものはどれか。\n\n経営者は、[ a ]の事業の目的を支援する観点で、効果的、効率的かつ受容可能な[ a ]のITの利用について評価する。", "opts": ["過去と現在", "現在", "現在と将来", "将来"], "ans": 2, "tip": "ガバナンスは今を回しつつ先も見る役割。定義文には「現在及び将来」と入る。経営の話で過去だけを見る選択肢は基本的に誤り、と割り切ってよい。", "year": "r6"}, {"id": 54, "cat": "management", "sub": "ITガバナンス", "prompt": "事業活動に関わる法令の遵守などを目的の一つとして、統制環境、リスクの評価と対応、統制活動、情報と伝達、モニタリング、ITへの対応から構成される取組はどれか。", "opts": ["CMMI", "ITIL", "内部統制", "リスク管理"], "ans": 2, "tip": "内部統制の基本的要素6つ。丸暗記が要るのはここだけ。「統制環境・リスクの評価と対応・統制活動・情報と伝達・モニタリング・ITへの対応」。この6語が並んでいたら内部統制で確定。", "year": "r6"}, {"id": 55, "cat": "management", "sub": "システム監査", "prompt": "システム監査の目的に関する記述として、適切なものはどれか。", "opts": ["開発すべきシステムの具体的な用途を分析し、システム要件を明らかにすること", "情報システムが設置されている施設とその環境を総合的に企画、管理、活用すること", "情報システムに係るリスクに適切に対応しているかどうかを評価することによって、組織体の目標達成に寄与すること", "知識、スキル、ツール及び技法をプロジェクト活動に適用することによって、プロジェクトの要求事項を満足させること"], "ans": 2, "tip": "監査は必ず「評価する」で終わる。作る（要件定義）、管理する（ファシリティ）、進める（プロジェクトマネジメント）が混ざった選択肢の中から、評価という動詞を探すだけ。", "year": "r6"}, {"id": 56, "cat": "technology", "sub": "コンピュータ構成", "prompt": "PCにおいて、電力供給を断つと記憶内容が失われるメモリ又は記憶媒体はどれか。", "opts": ["DVD-RAM", "DRAM", "ROM", "フラッシュメモリ"], "ans": 1, "tip": "電源を切ると消えるのが揮発性。揮発性はRAM（DRAM・SRAM）だけ、と覚えてしまう。名前にRAMが付くDVD-RAMは光ディスクなので不揮発、という引っかけが定番。", "year": "r6"}, {"id": 57, "cat": "technology", "sub": "セキュリティ", "prompt": "暗号化方式の特徴について記した表において、表中のa〜dに入れる字句の適切な組合せはどれか。\n\n方式a：暗号化鍵と復号鍵が異なる／鍵の安全な配布は容易／処理速度はc\n方式b：暗号化鍵と復号鍵が同一／鍵の安全な配布は難しい／処理速度はd", "opts": ["a:共通鍵暗号方式／b:公開鍵暗号方式／c:遅い／d:速い", "a:共通鍵暗号方式／b:公開鍵暗号方式／c:速い／d:遅い", "a:公開鍵暗号方式／b:共通鍵暗号方式／c:遅い／d:速い", "a:公開鍵暗号方式／b:共通鍵暗号方式／c:速い／d:遅い"], "ans": 2, "tip": "公開鍵は「鍵が2本・配布が楽・処理が遅い」、共通鍵は「鍵が1本・配布が大変・処理が速い」。全部が正反対の関係なので、どれか1つ思い出せば残りは自動的に決まる。実務では両者を組み合わせる（ハイブリッド方式）。", "year": "r6"}, {"id": 58, "cat": "technology", "sub": "ソフトウェア", "prompt": "文書作成ソフトや表計算ソフトなどにおいて、一連の操作手順をあらかじめ定義しておき、実行する機能はどれか。", "opts": ["オートコンプリート", "ソースコード", "プラグアンドプレイ", "マクロ"], "ans": 3, "tip": "macro＝大きなひとまとまり。細かい操作をひとかたまりにして一発で流すもの。ExcelのVBAがこれ。オートコンプリートは入力候補の補完で、操作手順ではなく文字の話。", "year": "r6"}, {"id": 59, "cat": "technology", "sub": "コンピュータ構成", "prompt": "OCRの役割として、適切なものはどれか。", "opts": ["10cm程度の近距離にある機器間で無線通信する。", "印刷文字や手書き文字を認識し、テキストデータに変換する。", "デジタル信号処理によって、人工的に音声を作り出す。", "利用者の指先などが触れたパネル上の位置を検出する。"], "ans": 1, "tip": "Optical Character Reader／Recognition＝光学的文字読取。Cが文字（Character）、OMRのMはマーク（Mark＝マークシート）。真ん中の1文字で読み取る対象が決まる。", "year": "r6"}, {"id": 60, "cat": "technology", "sub": "データベース", "prompt": "関係データベースを構成する要素の関係を表す図において、図中のa〜cに入れる字句の適切な組合せはどれか。\n\n関係データベースは[ a ]の集まり／[ a ]は[ b ]の集まり／[ b ]は[ c ]の集まり", "opts": ["a:表／b:フィールド／c:レコード", "a:表／b:レコード／c:フィールド", "a:フィールド／b:表／c:レコード", "a:レコード／b:表／c:フィールド"], "ans": 1, "tip": "大きい順に「データベース＞表＞レコード（行）＞フィールド（列項目）」。表を1枚の名簿と考えれば、1人分の行がレコード、氏名や住所の欄がフィールド。入れ子の大小関係さえ描ければ迷わない。", "year": "r6"}, {"id": 61, "cat": "technology", "sub": "ネットワーク", "prompt": "cookieを説明したものはどれか。", "opts": ["Webサイトが、Webブラウザを通じて訪問者のPCにデータを書き込んで保存する仕組み又は保存されるデータのこと", "Webブラウザが、アクセスしたWebページをファイルとしてPCのハードディスクに一時的に保存する仕組み又は保存されるファイルのこと", "Webページ上で、Webサイトの紹介などを目的に掲載されている画像のこと", "ブログの機能の一つで、リンクを張った相手に対してその旨を通知する仕組みのこと"], "ans": 0, "tip": "cookieは「サイト側が訪問者のPCに置いていく小さなメモ」。誰が書くかが決め手で、書く主体はWebサイト。イはキャッシュで、こちらはブラウザが自分の都合で保存するもの。主語で切り分ける。", "year": "r6"}, {"id": 62, "cat": "technology", "sub": "アルゴリズム", "prompt": "関数convertは、整数型の配列を一定のルールで文字列に変換するプログラムである。convert(arrayInput)の戻り値が「AABAB」になる引数arrayInputの値はどれか。ここで、配列の要素番号は1から始まる。\n\n［プログラム］\n文字列型: convert(整数型の配列: arrayInput)\n　stringOutput ← \n　for (i を 1 から arrayInput の要素数 まで 1 ずつ増やす)\n　　if (arrayInput[i] が 1 と等しい)\n　　　stringOutput の末尾に \"A\" を追加する\n　　else\n　　　stringOutput の末尾に \"B\" を追加する\n　　endif\n　endfor\n　return stringOutput", "opts": ["{0, 0, 1, 2, 1}", "{0, 1, 2, 1, 1}", "{1, 0, 1, 2, 0}", "{1, 1, 2, 1, 0}"], "ans": 3, "how": "ルールは「1ならA、1以外はB」。求める出力AABABを数字に直すと、A→1、A→1、B→1以外、A→1、B→1以外。つまり{1, 1, 1以外, 1, 1以外}。エの{1, 1, 2, 1, 0}がこれに一致する。", "tip": "選択肢がある問題は、プログラムを追うより「答えから逆に作る」方が速い。この手の変換プログラムは1文字目だけで大半の選択肢が落ちるので、まず先頭を見る。", "year": "r6"}, {"id": 63, "cat": "technology", "sub": "セキュリティ", "prompt": "SSDの全てのデータを消去し、復元できなくする方法として用いられているものはどれか。", "opts": ["Secure Erase", "磁気消去", "セキュアブート", "データクレンジング"], "ans": 0, "tip": "媒体ごとに消去方法が違う。SSD（半導体）はSecure Erase、HDD（磁気）は磁気消去や上書き、紙はシュレッダー。SSDに磁気消去は効かない（磁気で記録していないから）という理屈で覚える。", "year": "r6"}, {"id": 64, "cat": "technology", "sub": "セキュリティ", "prompt": "情報セキュリティのリスクマネジメントにおけるリスクへの対応を、リスク共有、リスク回避、リスク保有及びリスク低減の四つに分類するとき、リスク共有の例として、適切なものはどれか。", "opts": ["災害によるシステムの停止時間を短くするために、遠隔地にバックアップセンターを設置する。", "情報漏えいによって発生する損害賠償や事故処理の損失補填のために、サイバー保険に加入する。", "電子メールによる機密ファイルの流出を防ぐために、ファイルを添付した電子メールの送信には上司の許可を必要とする仕組みにする。", "ノートPCの紛失や盗難による情報漏えいを防ぐために、HDDを暗号化する。"], "ans": 1, "tip": "保険＝リスク共有（移転）。これは条件反射でよい。他の3つは回避＝やめる、低減＝小さくする、保有＝受け入れる。損失を誰かに肩代わりしてもらう話だけが共有。", "year": "r6"}, {"id": 65, "cat": "technology", "sub": "AI", "prompt": "AIにおける機械学習の学習方法に関する次の記述中のa〜cに入れる字句の適切な組合せはどれか。\n\n教師あり学習は、正解を付けた学習データを入力することによって、[ a ]と呼ばれる手法で未知のデータを複数のクラスに分けたり、[ b ]と呼ばれる手法でデータの関係性を見つけたりする学習方法である。教師なし学習は、正解を付けない学習データを入力することによって、[ c ]と呼ばれる手法などで次第にデータを正しくグループ分けできるようになる学習方法である。", "opts": ["a:回帰／b:分類／c:クラスタリング", "a:クラスタリング／b:分類／c:回帰", "a:分類／b:回帰／c:クラスタリング", "a:分類／b:クラスタリング／c:回帰"], "ans": 2, "tip": "教師ありは分類と回帰、教師なしはクラスタリング。まず「クラスタリング＝教師なし」を固定すれば、cが決まって選択肢が絞れる。分類はクラス分け、回帰は数値の関係を出す、と担当を分ける。", "year": "r6"}, {"id": 66, "cat": "technology", "sub": "セキュリティ", "prompt": "PKIにおけるCA（Certificate Authority）の役割に関する記述として、適切なものはどれか。", "opts": ["インターネットと内部ネットワークの間にあって、内部ネットワーク上のコンピュータに代わってインターネットにアクセスする。", "インターネットと内部ネットワークの間にあって、パケットフィルタリング機能などを用いてインターネットから内部ネットワークへの不正アクセスを防ぐ。", "利用者に指定されたドメイン名を基にIPアドレスとドメイン名の対応付けを行い、利用者を目的のサーバにアクセスさせる。", "利用者の公開鍵に対する公開鍵証明書の発行や失効を行い、鍵の正当性を保証する。"], "ans": 3, "tip": "Certificate＝証明書、Authority＝当局。証明書を発行する役所。「その公開鍵は本人のものだ」と第三者が保証する役割で、印鑑証明を出す役所と同じ立ち位置。アはプロキシ、イはファイアウォール、ウはDNS。", "year": "r6"}, {"id": 67, "cat": "technology", "sub": "システム構成", "prompt": "2台のWebサーバと1台のデータベースサーバから成るWebシステムがある。Webサーバの稼働率はともに0.8とし、データベースサーバの稼働率は0.9とすると、このシステムの小数第3位を四捨五入した稼働率は幾らか。ここで、2台のWebサーバのうち少なくとも1台が稼働していて、かつ、データベースサーバが稼働していれば、システムとしては稼働しているとみなす。", "opts": ["0.04", "0.58", "0.86", "0.96"], "ans": 2, "how": "並列のWebサーバ2台：両方止まる確率は0.2×0.2＝0.04なので、稼働率は1－0.04＝0.96。これとDBサーバ0.9が直列なので0.96×0.9＝0.864。四捨五入して0.86。", "tip": "直列は稼働率の掛け算、並列は「1－（全部止まる確率）」。並列を先に1つの数字にまとめてから、直列で掛ける。この順番を固定しておけば構成が複雑でも解ける。", "year": "r6"}, {"id": 68, "cat": "technology", "sub": "UI/UX", "prompt": "情報デザインで用いられる概念であり、部屋のドアノブの形で開閉の仕方を示唆するというような、人間の適切な行動を誘発する知覚可能な手掛かりのことを何と呼ぶか。", "opts": ["NUI（Natural User Interface）", "ウィザード", "シグニファイア", "マルチタッチ"], "ans": 2, "tip": "signify＝意味を示す。見ただけで使い方が分かる合図のこと。押し板だけのドアは押したくなる、取っ手が付いていれば引きたくなる、というアレ。アフォーダンスとセットで問われる。", "year": "r6"}, {"id": 69, "cat": "technology", "sub": "システム構成", "prompt": "障害に備えるために、4台のHDDを使い、1台分の容量をパリティ情報の記録に使用するRAID5を構成する。1台のHDDの容量が1Tバイトのとき、実効データ容量はおよそ何バイトか。", "opts": ["2T", "3T", "4T", "5T"], "ans": 1, "how": "RAID5はn台のうち1台分がパリティに使われるので、実効容量＝（4－1）×1Tバイト＝3Tバイト。", "tip": "RAIDは容量の考え方で覚える。RAID0＝全部使える（n台分）、RAID1＝半分（ミラー）、RAID5＝1台分をパリティに取られる（n－1台分）。「5は1台損する」と数字で紐づける。", "year": "r6"}, {"id": 70, "cat": "technology", "sub": "ネットワーク", "prompt": "ESSIDをステルス化することによって得られる効果として、適切なものはどれか。", "opts": ["アクセスポイントと端末間の通信を暗号化できる。", "アクセスポイントに接続してくる端末を認証できる。", "アクセスポイントへの不正接続リスクを低減できる。", "アクセスポイントを介さず、端末同士で直接通信できる。"], "ans": 2, "tip": "ステルス化＝名前を隠すだけ。隠れるので見つかりにくくなる＝リスクは下がるが、暗号化でも認証でもない。無線LANの3点セット（WPA2＝暗号化、MACフィルタ＝端末制限、ステルス＝隠蔽）の役割分担で覚える。", "year": "r6"}, {"id": 71, "cat": "technology", "sub": "ネットワーク", "prompt": "インターネットで使用されているドメイン名の説明として、適切なものはどれか。", "opts": ["Web閲覧や電子メールを送受信するアプリケーションが使用する通信規約の名前", "コンピュータやネットワークなどを識別するための名前", "通信を行うアプリケーションを識別するための名前", "電子メールの宛先として指定する相手の名前"], "ans": 1, "tip": "識別する対象で切り分ける。ドメイン名＝コンピュータやネットワーク、ポート番号＝アプリケーション、プロトコル＝通信の約束事。「何を識別するか」を毎回問う。", "year": "r6"}, {"id": 72, "cat": "technology", "sub": "セキュリティ", "prompt": "次の記述のうち、バイオメトリクス認証の例だけを全て挙げたものはどれか。\n\na Webページに歪んだ文字の列から成る画像を表示し、読み取った文字列を利用者に入力させることによって、認証を行う。\nb キーボードで特定文字列を入力させ、そのときの打鍵の速度やタイミングの変化によって、認証を行う。\nc タッチパネルに手書きで氏名を入力させ、そのときの筆跡、筆圧、運筆速度などによって、認証を行う。\nd タッチパネルに表示された複数の点をあらかじめ決められた順になぞらせることによって、認証を行う。", "opts": ["a, b", "a, d", "b, c", "c, d"], "ans": 2, "tip": "バイオメトリクスには身体的特徴（指紋・虹彩・静脈）だけでなく、行動的特徴（打鍵のクセ・筆跡・声）も含まれる。aはCAPTCHA（人間かどうかの判定）、dはパターンロック（知識認証）。「本人固有のクセか、覚えた情報か」で分ける。", "year": "r6"}, {"id": 73, "cat": "technology", "sub": "セキュリティ", "prompt": "IoT機器のセキュリティ対策のうち、ソーシャルエンジニアリング対策として、最も適切なものはどれか。", "opts": ["IoT機器とサーバとの通信は、盗聴を防止するために常に暗号化通信で行う。", "IoT機器の脆弱性を突いた攻撃を防止するために、機器のメーカーから最新のファームウェアを入手してアップデートを行う。", "IoT機器へのマルウェア感染を防止するためにマルウェア対策ソフトを導入する。", "IoT機器を廃棄するときは、内蔵されている記憶装置からの情報漏えいを防止するために物理的に破壊する。"], "ans": 3, "tip": "ソーシャルエンジニアリングは技術ではなく人や物理から情報を盗む手口。ゴミ箱あさり（スキャベンジング）、肩越しの盗み見、なりすまし電話が代表例。廃棄時の対策はゴミからの窃取への備えなので、この系統に入る。", "year": "r6"}, {"id": 74, "cat": "technology", "sub": "データベース", "prompt": "トランザクション処理に関する記述のうち、適切なものはどれか。", "opts": ["コミットとは、トランザクションが正常に処理されなかったときに、データベースをトランザクション開始前の状態に戻すことである。", "排他制御とは、トランザクションが正常に処理されたときに、データベースの内容を確定させることである。", "ロールバックとは、複数のトランザクションが同時に同一データを更新しようとしたときに、データの矛盾が起きないようにすることである。", "ログとは、データベースの更新履歴を記録したファイルのことである。"], "ans": 3, "tip": "用語を総入れ替えした引っかけ。コミット＝確定、ロールバック＝巻き戻し、排他制御＝同時更新の交通整理、ログ＝更新履歴。4語を先に自分で定義してから選択肢を読むと、ずれが一目で分かる。", "year": "r6"}, {"id": 75, "cat": "technology", "sub": "セキュリティ", "prompt": "情報セキュリティの3要素である機密性、完全性及び可用性と、それらを確保するための対策の例a〜cの適切な組合せはどれか。\n\na アクセス制御　b デジタル署名　c ディスクの二重化", "opts": ["a:可用性／b:完全性／c:機密性", "a:可用性／b:機密性／c:完全性", "a:完全性／b:機密性／c:可用性", "a:機密性／b:完全性／c:可用性"], "ans": 3, "tip": "CIAは動詞で判定する。見せない＝機密性（アクセス制御・暗号化）、変えさせない＝完全性（デジタル署名・ハッシュ）、止めない＝可用性（二重化・バックアップ）。対策の目的を一言に直せば自動的に割り振れる。", "year": "r6"}, {"id": 76, "cat": "technology", "sub": "コンピュータ構成", "prompt": "スマートフォンなどのタッチパネルで広く採用されている方式であり、指がタッチパネルの表面に近づいたときに、その位置を検出する方式はどれか。", "opts": ["感圧式", "光学式", "静電容量方式", "電磁誘導方式"], "ans": 2, "tip": "静電容量方式は指の帯電を検知するので、触れなくても近づくだけで反応する。だから手袋では反応しにくい。感圧式は押す力を検知するので手袋でも押せる、という体感の違いで覚える。", "year": "r6"}, {"id": 77, "cat": "technology", "sub": "セキュリティ", "prompt": "出所が不明のプログラムファイルの使用を避けるために、その発行元を調べたい。このときに確認する情報として、適切なものはどれか。", "opts": ["そのプログラムファイルのアクセス権", "そのプログラムファイルの所有者情報", "そのプログラムファイルのデジタル署名", "そのプログラムファイルのハッシュ値"], "ans": 2, "tip": "「誰が作ったか」を証明できるのはデジタル署名だけ。ハッシュ値は改ざんの有無しか分からず、作成者は分からない。所有者情報はコピーすれば変わるので証明にならない。「発行元＝署名」で固定。", "year": "r6"}, {"id": 78, "cat": "technology", "sub": "AI", "prompt": "利用者がスマートスピーカーに向けて話し掛けた内容に対して、スマートスピーカーから音声で応答するための処理手順が（1）〜（4）のとおりであるとき、音声認識に該当する処理はどれか。\n\n（1）利用者の音声をテキストデータに変換する。\n（2）テキストデータを解析して、その意味を理解する。\n（3）応答する内容を決定して、テキストデータを生成する。\n（4）生成したテキストデータを読み上げる。", "opts": ["（1）", "（2）", "（3）", "（4）"], "ans": 0, "tip": "音声認識＝音を文字にする（入口）、音声合成＝文字を音にする（出口）。間の意味理解は自然言語処理。入口・中身・出口の3段構えで並べれば取り違えない。", "year": "r6"}, {"id": 79, "cat": "technology", "sub": "ネットワーク", "prompt": "企業などの内部ネットワークとインターネットとの間にあって、セキュリティを確保するために内部ネットワークのPCに代わって、インターネット上のWebサーバにアクセスするものはどれか。", "opts": ["DNSサーバ", "NTPサーバ", "ストリーミングサーバ", "プロキシサーバ"], "ans": 3, "tip": "proxy＝代理人。「代わってアクセスする」と書いてあればプロキシ。DNSは名前解決、NTPは時刻合わせ。サーバ名は役割を一言で言えるようにしておけば全部解ける。", "year": "r6"}, {"id": 80, "cat": "technology", "sub": "法務・OSS", "prompt": "OSS（Open Source Software）に関する記述として、適切なものだけを全て挙げたものはどれか。\n\na OSSを利用して作成したソフトウェアを販売することができる。\nb ソースコードが公開されたソフトウェアは全てOSSである。\nc 著作権が放棄されているソフトウェアである。", "opts": ["a", "a, b", "b, c", "c"], "ans": 0, "tip": "OSSの2大誤解を潰す。「無料でなければならない」は誤り（販売可）、「著作権放棄」も誤り（著作権は保持したうえで許諾している）。また公開されていてもライセンス条件次第でOSSとは限らない。", "year": "r6"}, {"id": 81, "cat": "technology", "sub": "データベース", "prompt": "一つの表で管理されていた受注データを、受注に関する情報と商品に関する情報に分割して、正規化を行った上で関係データベースの表で管理する。正規化を行った結果の表の組合せとして、最も適切なものはどれか。ここで、同一商品で単価が異なるときは商品番号も異なるものとする。また、発注者名には同姓同名はいないものとする。\n\n受注データ（受注番号、発注者名、商品番号、商品名、個数、単価）", "opts": ["受注番号・発注者名／商品番号・商品名・個数・単価", "受注番号・発注者名・商品番号／商品番号・商品名・個数・単価", "受注番号・発注者名・商品番号・個数・単価／商品番号・商品名", "受注番号・発注者名・商品番号・個数／商品番号・商品名・単価"], "ans": 3, "tip": "分け方の判断は「その項目は何によって決まるか」。商品名と単価は商品番号が決まれば決まるので商品側へ。個数は受注ごとに変わるので受注側に残す。「個数を商品表に置くと商品ごとに1つしか持てない」と考えれば誤りに気づける。", "year": "r6"}, {"id": 82, "cat": "technology", "sub": "セキュリティ", "prompt": "ISMSクラウドセキュリティ認証に関する記述として、適切なものはどれか。", "opts": ["一度認証するだけで、複数のクラウドサービスやシステムなどを利用できるようにする認証の仕組み", "クラウドサービスについて、クラウドサービス固有の管理策が実施されていることを認証する制度", "個人情報について適切な保護措置を講ずる体制を整備しているクラウド事業者などを評価して、事業活動に関してプライバシーマークの使用を認める制度", "利用者がクラウドサービスへログインするときの環境、IPアドレスなどに基づいて状況を分析し、リスクが高いと判断された場合に追加の認証を行う仕組み"], "ans": 1, "tip": "名前のとおり「ISMSにクラウド固有の管理策を上乗せした認証制度」。アはシングルサインオン、エはリスクベース認証で、どちらも人の認証の話。制度の話か仕組みの話かで先に半分に割れる。", "year": "r6"}, {"id": 83, "cat": "technology", "sub": "基礎理論", "prompt": "1から6までの六つの目をもつサイコロを3回投げたとき、1回も1の目が出ない確率は幾らか。", "opts": ["1/216", "5/72", "91/216", "125/216"], "ans": 3, "how": "1回で1の目が出ない確率は6分の5。3回続けて出ない確率は(5/6)の3乗＝125/216。", "tip": "「1回も〜ない」は各回の確率を掛けるだけで済む。逆に「少なくとも1回は〜」と聞かれたら、1からこの値を引く。この2パターンの言い換えが問われる。", "year": "r6"}, {"id": 84, "cat": "technology", "sub": "ネットワーク", "prompt": "IoTエリアネットワークでも利用され、IoTデバイスからの無線通信をほかのIoTデバイスが中継することを繰り返し、リレー方式で通信をすることによって、広範囲の通信を実現する技術はどれか。", "opts": ["GPS", "MIMO", "キャリアアグリゲーション", "マルチホップ"], "ans": 3, "tip": "hop＝跳ぶ。何度も跳んでバケツリレーするからマルチホップ。MIMOは複数アンテナで速くする技術、キャリアアグリゲーションは複数の周波数を束ねる技術。「距離を伸ばす」のか「速度を上げる」のかで分ける。", "year": "r6"}, {"id": 85, "cat": "technology", "sub": "アルゴリズム", "prompt": "関数binaryToIntegerは、1桁以上の符号なし2進数を文字列で表した値を引数binaryStrで受け取り、その値を整数に変換した結果を戻り値とする。例えば、引数として「100」を受け取ると、4を返す。プログラム中のa、bに入れる字句の適切な組合せはどれか。\n\n［プログラム］\n整数型: binaryToInteger(文字列型: binaryStr)\n　integerNum ← 0\n　for (i を 1 から binaryStr の文字数 まで 1 ずつ増やす)\n　　digitNum ← binaryStr の末尾から i 番目の文字を整数型に変換した値\n　　exponent ← [ a ]\n　　integerNum ← [ b ]\n　endfor\n　return integerNum", "opts": ["a:(2 の i 乗)－1／b:integerNum × digitNum × exponent", "a:(2 の i 乗)－1／b:integerNum ＋ digitNum × exponent", "a:2 の (i－1) 乗／b:integerNum × digitNum × exponent", "a:2 の (i－1) 乗／b:integerNum ＋ digitNum × exponent"], "ans": 3, "how": "末尾からi番目の重みは2の(i－1)乗（i＝1で1、i＝2で2、i＝3で4）。よってaは2の(i－1)乗。各桁の値×重みを累積加算するので、bはintegerNum＋digitNum×exponent。", "tip": "2進数を10進数に直す作業は「各桁の重みを足し算する」。末尾（1の位）の重みは2の0乗＝1なので、i＝1のときに1になる式を選ぶ。またinteger Numは0から始まるので、掛け算だと永遠に0のまま。この2点で全選択肢が切れる。", "year": "r6"}, {"id": 86, "cat": "technology", "sub": "セキュリティ", "prompt": "PDCAモデルに基づいてISMSを運用している組織において、C（Check）で実施することの例として、適切なものはどれか。", "opts": ["業務内容の監査結果に基づいた是正処置として、サーバの監視方法を変更する。", "具体的な対策と目標を決めるために、サーバ室内の情報資産を洗い出す。", "サーバ管理者の業務内容を第三者が客観的に評価する。", "定められた運用手順に従ってサーバの動作を監視する。"], "ans": 2, "tip": "PDCAは動詞で割り振る。Plan＝決める・洗い出す、Do＝手順どおり実施する、Check＝評価する・監査する、Act＝是正する・変更する。選択肢の語尾だけ見れば分類できる。", "year": "r6"}, {"id": 87, "cat": "technology", "sub": "セキュリティ", "prompt": "通常の検索エンジンでは検索されず匿名性が高いので、サイバー攻撃や違法商品の取引などにも利用されることがあり、アクセスするには特殊なソフトウェアが必要になることもあるインターネット上のコンテンツの総称を何と呼ぶか。", "opts": ["RSS", "SEO", "クロスサイトスクリプティング", "ダークウェブ"], "ans": 3, "tip": "検索エンジンに載る表側がサーフェスウェブ、載らない裏側がディープウェブ、その中でも特殊な手段でしか届かない領域がダークウェブ。深さの3段階でイメージする。", "year": "r6"}, {"id": 88, "cat": "technology", "sub": "ソフトウェア", "prompt": "JavaScriptに関する記述として、適切なものはどれか。", "opts": ["Webブラウザ上に、動的な振る舞いなどを組み込むことができる。", "Webブラウザではなく、Webサーバ上だけで動作する。", "実行するためには、あらかじめコンパイルする必要がある。", "名前のとおり、Javaのスクリプト版である。"], "ans": 0, "tip": "JavaScriptとJavaは名前が似ているだけの別物、が最頻出の引っかけ。またコンパイル不要のスクリプト言語で、主にブラウザ側（クライアント側）で動く。この3点だけ押さえれば選択肢が全部片付く。", "year": "r6"}, {"id": 89, "cat": "technology", "sub": "セキュリティ", "prompt": "システムの利用者認証に関する記述のうち、適切なものはどれか。", "opts": ["1回の認証で、複数のサーバやアプリケーションなどへのログインを実現する仕組みを、チャレンジレスポンス認証という。", "指紋や声紋など、身体的な特徴を利用して本人認証を行う仕組みを、シングルサインオンという。", "情報システムが利用者の本人確認のために用いる、数字列から成る暗証番号のことを、PINという。", "特定の数字や文字の並びではなく、位置についての情報を覚えておき、認証時には画面に表示された表の中で、自分が覚えている位置に並んでいる数字や文字をパスワードとして入力する方式を、多要素認証という。"], "ans": 2, "tip": "用語を総取り替えした問題。1回で複数＝シングルサインオン、身体的特徴＝バイオメトリクス、位置を覚える＝マトリクス認証。正しい対応を先に頭に置いてから読むと、ずれている選択肢が浮き上がる。", "year": "r6"}, {"id": 90, "cat": "technology", "sub": "セキュリティ", "prompt": "セキュリティ対策として使用されるWAFの説明として、適切なものはどれか。", "opts": ["ECなどのWebサイトにおいて、Webアプリケーションソフトウェアの脆弱性を突いた攻撃からの防御や、不審なアクセスのパターンを検知する仕組み", "インターネットなどの公共のネットワークを用いて、専用線のようなセキュアな通信環境を実現する仕組み", "情報システムにおいて、機密データを特定して監視することによって、機密データの紛失や外部への漏えいを防止する仕組み", "ファイアウォールを用いて、インターネットと企業の内部ネットワークとの間に緩衝領域を作る仕組み"], "ans": 0, "tip": "Web Application Firewall。名前に答えが入っている。通常のファイアウォールは通信の入口（ポートやIP）を見るのに対し、WAFは中身（アプリへの攻撃）を見る。イはVPN、ウはDLP、エはDMZ。", "year": "r6"}, {"id": 91, "cat": "technology", "sub": "セキュリティ", "prompt": "職場で不要になったPCを廃棄する場合の情報漏えい対策として、最も適切なものはどれか。", "opts": ["OSが用意しているファイル削除の機能を使って、PC内のデータファイルを全て削除する。", "PCにインストールされているアプリケーションを、全てアンインストールする。", "PCに内蔵されている全ての記憶装置を論理フォーマットする。", "専用ソフトなどを使って、PCに内蔵されている全ての記憶装置の内容を消去するために、ランダムなデータを規定回数だけ上書きする。"], "ans": 3, "tip": "通常の削除や論理フォーマットは「目次を消すだけ」で本文は残っており、復元ソフトで読み出せる。確実に消すには上書き、物理破壊、専用消去機能のいずれかが要る。「本当に上書きしているか」で判定する。", "year": "r6"}, {"id": 92, "cat": "technology", "sub": "ネットワーク", "prompt": "インターネットに接続されているサーバが、1台でメール送受信機能とWebアクセス機能の両方を提供しているとき、端末のアプリケーションプログラムがそのどちらの機能を利用するかをサーバに指定するために用いるものはどれか。", "opts": ["IPアドレス", "ドメイン", "ポート番号", "ホスト名"], "ans": 2, "tip": "IPアドレスは建物の住所、ポート番号は部屋番号。同じ建物（1台のサーバ）の中でどのサービスに用があるかを示すのがポート番号。80番がHTTP、25番がSMTPと決まっている。", "year": "r6"}, {"id": 93, "cat": "technology", "sub": "データベース", "prompt": "関係データベースで管理している「従業員」表から、氏名が「%葉_」に該当する従業員を抽出した。抽出された従業員は何名か。ここで、「_」は任意の1文字を表し、「%」は0文字以上の任意の文字列を表すものとする。\n\n従業員：千葉翔／葉山花子／鈴木葉子／佐藤乙葉／秋葉彩葉／稲葉小春", "opts": ["1", "2", "3", "4"], "ans": 1, "how": "条件は末尾から2番目が「葉」であること。千葉翔は葉＋翔で該当、鈴木葉子は葉＋子で該当。葉山花子は葉の後が3文字、佐藤乙葉と秋葉彩葉は葉で終わり後ろに文字がなく、稲葉小春は末尾2文字が小春なので非該当。よって2名。", "tip": "アンダースコアはちょうど1文字、パーセントは0文字でもよい任意長。「%葉_」は「最後から2文字目が葉で、その後に必ず1文字ある」という意味になる。末尾から数えるのがコツ。", "year": "r6"}, {"id": 94, "cat": "technology", "sub": "セキュリティ", "prompt": "企業において情報セキュリティポリシー策定で行う作業のうち、次の作業の実施順序として、適切なものはどれか。\n\na 策定する責任者や担当者を決定する。\nb 情報セキュリティ対策の基本方針を策定する。\nc 保有する情報資産を洗い出し、分類する。\nd リスクを分析する。", "opts": ["a → b → c → d", "a → b → d → c", "b → a → c → d", "b → a → d → c"], "ans": 0, "tip": "順番は「誰がやるか決める→方針を掲げる→何を守るか洗い出す→どんな危険があるか分析する」。守る対象が決まっていないのにリスク分析はできないので、資産の洗い出しがリスク分析より先、というのが最大の判断ポイント。", "year": "r6"}, {"id": 95, "cat": "technology", "sub": "AI", "prompt": "AIの関連技術であるディープラーニングに用いられる技術として、最も適切なものはどれか。", "opts": ["ソーシャルネットワーク", "ニューラルネットワーク", "フィージビリ
