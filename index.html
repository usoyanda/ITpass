ティスタディ", "フォールトトレラント"], "ans": 1, "tip": "ディープ＝深い。何が深いかというと、ニューラルネットワークの層。人間の神経細胞を模したネットワークを多層にしたものがディープラーニング、と定義ごと結び付ける。", "year": "r6"}, {"id": 96, "cat": "technology", "sub": "ネットワーク", "prompt": "Aさんは次のように宛先を指定して電子メールを送信した。この電子メールの受信者に関する記述のうち、適切なものだけを全て挙げたものはどれか。\n\nTo:Bさん／Cc:Cさん／Bcc:Dさん、Eさん\n\n（1）CさんはDさんのメールアドレスを知ることができる。\n（2）DさんはCさんのメールアドレスを知ることができる。\n（3）EさんはDさんのメールアドレスを知ることができる。", "opts": ["（1）", "（1）、（3）", "（2）", "（2）、（3）"], "ans": 2, "tip": "Bccは一方通行。「Bccの人は全員（To・Cc）が見えるが、誰からもBccの人は見えない」。Bcc同士も互いに見えない、という点が最後の詰め。矢印を一方向に引いて考える。", "year": "r6"}, {"id": 97, "cat": "technology", "sub": "法務・OSS", "prompt": "次のOSのうち、OSS（Open Source Software）として提供されるものだけを全て挙げたものはどれか。\n\na Android　b FreeBSD　c iOS　d Linux", "opts": ["a, b", "a, b, d", "b, d", "c, d"], "ans": 1, "tip": "iOSだけがAppleの独占的製品で非OSS、と覚えれば一発。Android（AOSP）、FreeBSD、LinuxはいずれもOSS。「Appleは閉じている」で切る。", "year": "r6"}, {"id": 98, "cat": "technology", "sub": "セキュリティ", "prompt": "ランサムウェアに関する記述として、最も適切なものはどれか。", "opts": ["PCに外部から不正にログインするための侵入路をひそかに設置する。", "PCのファイルを勝手に暗号化し、復号のためのキーを提供することなどを条件に金銭を要求する。", "Webブラウザを乗っ取り、オンラインバンキングなどの通信に割り込んで不正送金などを行う。", "自らネットワークを経由して感染を広げる機能をもち、まん延していく。"], "ans": 1, "tip": "ransom＝身代金。データを人質に取って金を要求する。アはバックドア、ウはMITB（マンインザブラウザ）、エはワーム。マルウェアは「何をして稼ぐか」で分類すると混ざらない。", "year": "r6"}, {"id": 99, "cat": "technology", "sub": "ネットワーク", "prompt": "GPSの電波を捕捉しにくいビルの谷間や狭い路地などでも位置を計測することができるように、特定の地域の上空に比較的長く留まる軌道をとり、GPSと併用することによって、より高い測位精度を実現するものはどれか。", "opts": ["アシストGPS", "ジャイロセンサー", "準天頂衛星", "プローブカー"], "ans": 2, "tip": "「天頂」＝真上。日本の真上に長く留まるから、ビルの谷間でも上を向けば見える。みちびきがこれ。アシストGPSは携帯基地局の情報で測位を補助する別の仕組み。", "year": "r6"}, {"id": 100, "cat": "technology", "sub": "セキュリティ", "prompt": "正しいURLを指定してインターネット上のWebサイトへアクセスしようとした利用者が、偽装されたWebサイトに接続されてしまうようになった。原因を調べたところ、ドメイン名とIPアドレスの対応付けを管理するサーバに脆弱性があり、攻撃者によって、ドメイン名とIPアドレスを対応付ける情報が書き換えられていた。このサーバが受けた攻撃はどれか。", "opts": ["DDoS攻撃", "DNSキャッシュポイズニング", "ソーシャルエンジニアリング", "ドライブバイダウンロード"], "ans": 1, "tip": "「ドメイン名とIPアドレスの対応付け」＝DNS。そのDNSの記憶（キャッシュ）に毒（poison）を盛る攻撃。正しいURLを打ったのに偽サイトへ飛ばされる、という現象が出たらこれ。", "year": "r6"}];

 const res=await fetch(`${SUPA_URL}/rest/v1/sync_data?code=eq.${encodeURIComponent(code)}&app=eq.itpass&select=*`,{headers:{apikey:SUPA_KEY,Authorization:`Bearer ${SUPA_KEY}`}});

}

function buildAskText(x){

  if(x.how)s+=`\n【このアプリの解き方メモ】\n${x.how}\n`;
  s+=`\nこの解説の意味がよく分からない部分があるので、初心者にも分かるように噛み砕いて説明してください。`;

}
function buildCustomizeAskText(x){

const allSubs=()=>[...new Set(QS.filter(q=>S.cats.includes(q.cat)).map(q=>q.sub))].sort();
function pool(){
  let p=QS.filter(q=>S.years.includes(q.year)&&S.cats.includes(q.cat));
  if(S.subs.length)p=p.filter(q=>S.subs.includes(q.sub));
  if(S.weak)p=p.filter(q=>{const s=S.stats[key(q)];return s&&s.wrong>0});
  return p;
}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function prioritizedPool(n){
  const p=pool();
  if(p.length<=n)return shuffle(p);
  // 「最近出た問題」ほどスコアを大きく（＝後回しに）、「一度も出てない・久しく出てない問題」ほど小さく（＝優先）する。
  // 同程度の優先度の中ではランダム性をもたせるため、揺らぎ（ジッター）を混ぜる。
  const scored=p.map(qq=>{
    const s=S.stats[key(qq)];
    const last=(s&&s.last)?s.last:0;
    return {qq,score:last+Math.random()*3600000};
  });
  scored.sort((a,b)=>a.score-b.score);
  const bufferSize=Math.min(p.length,Math.max(n*3,n+10));
  const candidates=scored.slice(0,bufferSize).map(x=>x.qq);
  return shuffle(candidates).slice(0,n);
}

    <div class="note">この論点をセットアップ画面の「論点でさらに絞る」で選んで集中演習できます。</div></div>`:""}

  <div class="acts">
    <button class="btn" id="wkgo" ${weak>0?"":"disabled"}>苦手${weak}問だけ演習する</button>
    <button class="btn btn2" id="cstgo">カスタム問題を管理する（お気に入り${S.favs.length}問）</button>
    <button class="btn btn2" id="stbk">セットアップに戻る</button>
  </div>`;
  document.getElementById("stbk").onclick=()=>{S.screen="setup";render()};
  document.getElementById("cstgo").onclick=()=>{S.screen="custom";render()};
  const wg=document.getElementById("wkgo");
  if(wg&&weak>0)wg.onclick=()=>{S.years=YEARS.filter(y=>y.ok).map(y=>y.id);S.cats=Object.keys(CAT);S.subs=[];S.weak=true;clamp();S.screen="setup";render()};
}

function customPage(){
  hsub.textContent="カスタム問題の管理";
  const items=S.favs.map(k=>QSByKey[k]).filter(Boolean);
  app.innerHTML=`
  <div class="field">
    <div class="note">「お気に入り」に入れた問題はここに並びます。①下の依頼文をコピーしてClaudeに貼り、②返ってきたJSONをそのまま貼り付けて保存すると、その問題は次回から作り替えたバージョンで出題されます。</div>
  </div>
  ${items.length?items.map((qq,idx)=>{
    const k=key(qq),cst=S.custom[k],view=cst?Object.assign({},qq,cst):qq;
    return `<div class="custItem">
      <span class="badge ${cst?"custom":"orig"}">${cst?"カスタム版を使用中":"オリジナルのまま"}</span>
      <div class="qq">${esc(view.prompt)}</div>
      <div class="rowbtns">
        <button class="btn3" data-req="${idx}">作り直し依頼文をコピー</button>
        ${cst?`<button class="btn3" data-rev="${idx}">元の問題に戻す</button>`:""}
        <button class="btn3" data-unfav="${idx}">お気に入りから外す</button>
      </div>
      <textarea class="ta" id="ta_${idx}" placeholder='ここにClaudeから返ってきたJSONをそのまま貼り付けて「保存」を押す 例：{"prompt":"...","opts":["...","...","...","..."],"ans":0,"tip":"..."}'></textarea>
      <button class="btn btn2" data-save="${idx}">貼り付けた内容を保存する</button>
    </div>`}).join(""):'<div class="empty">お気に入りに入れた問題がまだありません。問題を解いた後の「☆ お気に入りに追加」から登録してください。</div>'}
  <button class="btn" id="cbk" style="margin-top:18px">学習記録に戻る</button>`;
  document.getElementById("cbk").onclick=()=>{S.screen="stats";render()};
  q("[data-req]").forEach(b=>b.onclick=()=>{const qq=items[+b.dataset.req];copyText(buildCustomizeAskText(qq));b.textContent="コピーしました";setTimeout(()=>{b.textContent="作り直し依頼文をコピー"},2000)});
  q("[data-unfav]").forEach(b=>b.onclick=()=>{const qq=items[+b.dataset.unfav];toggleFav(key(qq));render()});
  q("[data-rev]").forEach(b=>b.onclick=()=>{const qq=items[+b.dataset.rev];delete S.custom[key(qq)];saveCustom();render()});
  q("[data-save]").forEach(b=>b.onclick=()=>{
    const idx=+b.dataset.save,qq=items[idx],ta=document.getElementById("ta_"+idx);
    let obj;
    try{obj=JSON.parse(ta.value)}catch(e){alert("JSONとして読み取れませんでした。Claudeの返答をJSON部分だけそのまま貼り付けてください。");return}
    if(!obj||typeof obj.prompt!=="string"||!Array.isArray(obj.opts)||obj.opts.length!==4||!Number.isInteger(obj.ans)||obj.ans<0||obj.ans>3){
      alert("形式が正しくありません。prompt（文字列）、opts（4件の配列）、ans（0〜3の数値）が必要です。");return
    }
    S.custom[key(qq)]={prompt:obj.prompt,opts:obj.opts,ans:obj.ans,tip:typeof obj.tip==="string"?obj.tip:qq.tip};
    saveCustom();render();
  });
}

document.addEventListener("keydown",e=>{
  if(S.screen!=="quiz")return;
  if(!S.done&&["1","2","3","4"].includes(e.key)){
    const idx=+e.key-1;
    const btns=q("#op .opt");
    if(btns[idx])btns[idx].click();
  }else if(S.done&&e.key==="Enter"){
    e.preventDefault();
    const nx=document.getElementById("nx");
    if(nx)nx.click();
  }
});

(async()=>{await load();render();if(S.syncCode)doPullAndMerge()})();
</script>
</body>
</html>
